<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendaring Simulators — LSH Training Portal</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/simulators/sim.css">
<style>
    /* the colours and buttons the calendar page (calsim.js) was written with */
    :root { --navy: #0b1633; --card: #fff; --ink-soft: #475569; --line: #e5e7eb; --orange-deep: #c2410c; }
    .cs-wrap .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; }
    .cs-wrap .btn { display: inline-block; border: 1px solid transparent; border-radius: 10px; padding: 9px 16px; font: inherit; font-weight: 700; font-size: 13.5px; cursor: pointer; text-decoration: none; line-height: 1.2; }
    .cs-wrap .btn-sm { padding: 6px 12px; font-size: 12.5px; }
    .cs-wrap .btn-navy { background: var(--navy); color: #fff; }
    .cs-wrap .btn-primary { background: #f97316; color: #fff; }
    .cs-wrap .btn-ghost { background: #fff; color: var(--navy); border-color: #cbd5e1; }
    .cs-wrap .btn:disabled { opacity: .5; cursor: not-allowed; }
    .cs-wrap .fp-batch { margin: 10px 0; } .cs-wrap .fp-batch-hd { cursor: pointer; padding: 6px 2px; font-size: 14px; }
    .cs-wrap .fp-arow { border: 1px solid #e5e7eb; border-radius: 10px; margin: 6px 0; padding: 8px 12px; background: #fff; }
    .cs-wrap .fp-arow-hd { cursor: pointer; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13.5px; }
    .cs-wrap .fp-muted { color: #64748b; font-size: 13px; }
    .cs-wrap h1, .cs-wrap h3 { font-family: inherit; }
    .cs-wrap input[type=text], .cs-wrap input[type=number], .cs-wrap textarea { font: inherit; border: 1px solid #cbd5e1; border-radius: 8px; padding: 6px 8px; }
    #cs-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: #0b1633; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 9999; }
    #cs-toast.on { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<div id="topbar"></div>
<div class="cs-wrap">
    <div id="cs-root"><div class="sim-loading" style="padding:40px;text-align:center;">Loading…</div></div>
</div>

<script src="/app.js"></script>
<script src="/portal-nav.js"></script>
<script src="/portal.js"></script>
<script src="/simulators/sim.js"></script>
<script>Sim.module = 'calendaring';</script>
<script src="/simulators/calsim-core.js"></script>
<script src="/simulators/cal-scorecard.js"></script>
<script>
// Calendaring Simulators: one page for the three Google Calendar Simulators (simulators/gcal.html), one per program:
//   🎓 Standard Training (Foundational · Calendar Management): the original Google Calendar Simulator, as it was built;
//   ⚖️ Litigation Week (Case Management) and 🏢 Executive Week (EA / PA): clones of it with their own week, callers and rules.
// ?track=standard|cm|ea opens that simulator at once (the Foundational Training's cards link that way). Admins also get
// 📊 Earlier scheduler scores (?view=scores): the earlier drag-and-drop scheduler's submissions (calsim.js, only used for this page now).
// 📊 The Google Calendar Simulators' submissions (gsubs in each trainee's /api/calsim record): who submitted what, the automated score and the
// trainer's score, and a link that opens it in the Google Calendar look to review (gcal.html?track=…&review=<user>|<at>).
async function gsList(only) {
    const box = document.getElementById('gs-list'); if (!box) return;
    const NAMES = { standard: '🎓 Standard Training', cm: '⚖️ Litigation Week', ea: '🏢 Executive Week' };
    box.innerHTML = '<div style="max-width:1180px;margin:0 auto;padding:10px 16px"><div class="card" style="padding:16px 18px;background:#fff;border:1px solid #e5e7eb;border-radius:14px">Loading the Google Calendar submissions…</div></div>';
    let rows = [];
    try {
        const d = await (await fetch('/api/calsim?all=1', { credentials: 'include' })).json();
        (d.rows || []).forEach(r => (r.data && Array.isArray(r.data.gsubs) ? r.data.gsubs : []).forEach(g => { if (!only || g.track === only) rows.push({ r, g, rv: (r.data.reviews || {})['g:' + g.track + '|' + g.at] }); }));
    } catch (e) { rows = []; }
    rows.sort((a, b) => String(b.g.at).localeCompare(String(a.g.at)));
    const E = (t) => Sim.esc(t), todo = rows.filter(x => !x.rv).length;
    box.innerHTML = `<div style="max-width:1180px;margin:0 auto;padding:10px 16px"><div class="card" style="padding:16px 18px;background:#fff;border:1px solid #e5e7eb;border-radius:14px">
        <h3 style="margin:0 0 4px;font-family:inherit">📅 Google Calendar Simulator submissions${only ? ' · ' + E(NAMES[only] || only) : ''}</h3>
        <p style="margin:0 0 10px;font-size:13.5px"><a class="sim-btn orange" style="text-decoration:none" href="/simulators/gcal-review.html${only ? '?track=' + E(only) : ''}">🖥 Trainee evaluations →</a> <span style="color:#64748b">New submissions (📤 Submit for evaluation) are there: the trainee’s calendar, the automated check, the AI review, your feedback and the final report.</span></p>
        <p style="margin:0 0 10px;color:#64748b;font-size:13px">Earlier submissions: open one to see the calendar the trainee built, the automated check, and add your score and feedback. ${rows.length ? `${rows.length} submitted${todo ? `, ${todo} to review` : ', all reviewed'}.` : ''}</p>
        ${rows.length ? `<div style="display:grid;gap:6px">${rows.map(x => `<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;border:1px solid #e5e7eb;border-radius:10px;padding:8px 12px;font-size:13.5px">
            <b style="min-width:150px">${E(x.r.name)}</b><span style="color:#64748b">${E(x.r.batch || 'No batch')}</span><span>${E(NAMES[x.g.track] || x.g.track)}</span>
            <span style="color:#64748b">${E(new Date(x.g.at).toLocaleString())}</span><span>🤖 ${E(x.g.result && x.g.result.score)}%</span>
            <span>${x.rv ? '👤 ' + E(x.rv.score) + '/100' : '<b style="color:#b45309">To review</b>'}</span>
            <a class="sim-btn orange" style="text-decoration:none;margin-left:auto" href="/simulators/gcal.html?${x.g.track === 'standard' ? '' : 'track=' + E(x.g.track) + '&'}review=${encodeURIComponent(x.r.username + '|' + x.g.at)}">${x.rv ? 'Open' : 'Review'} →</a></div>`).join('')}</div>` : '<div style="color:#64748b">No one has submitted a Google Calendar Simulator yet.</div>'}</div></div>`;
}
(async function () {
    Sim.label('Calendaring Simulators');
    const root = document.getElementById('cs-root');
    const q = new URLSearchParams(location.search);
    const go = (track) => { const n = new URLSearchParams(location.search); n.delete('track'); n.delete('view'); if (track !== 'standard') n.set('track', track); return '/simulators/gcal.html' + (n.toString() ? '?' + n : ''); };
    // (the Foundational Training's cards say litigation / executive for the Case Management / EA clones)
    const want = ({ litigation: 'cm', executive: 'ea' })[String(q.get('track') || '').toLowerCase()] || String(q.get('track') || '').toLowerCase();
    const direct = ['standard', 'cm', 'ea'].includes(want) && q.get('view') !== 'scores';
    let me, rec = null;
    try {
        const r = await fetch('/api/calsim', { credentials: 'include' });
        const d = await r.json();
        if (!r.ok || !d.success) throw new Error(d.error || 'Sign in on the Portal first.');
        me = d.me; rec = d.data || null;
    } catch (e) {
        if (direct) { location.replace(go(want)); return; }     // (the simulator asks for a name itself)
        document.getElementById('topbar').innerHTML = Sim.topbar('calsim');
        root.innerHTML = '<div style="padding:40px;text-align:center;">' + Sim.esc(e.message) + ' <a href="/trainee-login.html">Sign in</a></div>';
        return;
    }
    if (!me.admin) Sim.setWho({ name: me.name, batch: me.batch });   // signed in on the Portal: no "who's practicing" box
    if (direct) { location.replace(go(want)); return; }
    document.getElementById('topbar').innerHTML = Sim.topbar('calsim');
    if (me.admin && q.get('view') === 'scores') {
        root.innerHTML = '<div style="max-width:1180px;margin:0 auto;padding:14px 16px 0"><a href="/simulators/calsim.html" class="sim-btn ghost" style="text-decoration:none">← Calendaring Simulators</a></div><div id="gs-list"></div><div id="cs-scores"></div>';
        gsList(['standard', 'cm', 'ea'].includes(want) ? want : '');
        window.CalSimHost = { me, root: document.getElementById('cs-scores'), page: 'scores' };
        await new Promise((ok, no) => { const s = document.createElement('script'); s.src = '/simulators/calsim.js'; s.onload = ok; s.onerror = no; document.body.appendChild(s); });
        CalSim.show('scores');
        return;
    }
    const TRACKS = [
        { id: 'standard', icon: '🎓', title: 'Standard Training', where: 'Foundational · Calendar Management',
          desc: 'The attorney’s calendar in a Google Calendar look-alike. Callers ask for appointments: book them on the Attorney’s Calendar under the attorney’s rules (title, description, Google Meet for video calls, an email reminder a day before, Eastern time, 15-minute buffers), move or cancel what they ask, then check the calendar.' },
        { id: 'cm', icon: '⚖️', title: 'Litigation Week', where: 'Case Management',
          desc: 'The same Google Calendar practice on a litigation attorney’s week: hearings, depositions and focus blocks to work around, with case status, treatment, expert, adjuster, mediation and settlement requests to book, move or cancel, under the litigation attorney’s rules.' },
        { id: 'ea', icon: '🏢', title: 'Executive Week', where: 'EA / PA',
          desc: 'The same Google Calendar practice on an executive’s week: board, travel, focus time and the all-hands to protect, with interviews, investor, vendor, press and donor requests to book, move or cancel, under the executive’s rules.' }
    ];
    // The page as the Foundational Training's Simulators page has it (the final set-up): the three tracks and, with them,
    // Lesson 5's Calendar Management Mock Calls in the CMS Call Simulator (call.html sends the call on, with the name and batch).
    const callHref = (graded) => { const n = new URLSearchParams(); ['name', 'batch'].forEach(k => { if (q.get(k)) n.set(k, q.get(k)); });
        n.set('program', 'FT'); n.set('line', 'Calendar Management Mock Calls'); if (graded) n.set('random', '1'); return '/simulators/call.html?' + n; };
    const kicker = (t) => `<div style="font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#c2410c">${Sim.esc(t)}</div>`;
    // 🤖 The automated calendar review, per track (a trainee's own): the last Check my calendar in the simulator (kept in this
    // browser by gcal.js, one calendar per name and track), what they submitted (their account's gsubs, with the check it had)
    // and the trainer's score on it.
    const lastCheck = (track) => { try { const s = JSON.parse(localStorage.getItem('lsh_gcal' + (track === 'standard' ? '' : '.' + track) + ':' + String(me.name || '').trim().toLowerCase()) || 'null');
        return s && s.result && typeof s.result.score === 'number' ? s.result : null; } catch (e) { return null; } };
    const reviewHTML = (track) => {
        if (me.admin) return '';
        const a = lastCheck(track), subs = (rec && Array.isArray(rec.gsubs) ? rec.gsubs : []).filter(x => x && x.track === track), last = subs[subs.length - 1];
        const fb = last && rec.reviews ? rec.reviews['g:' + track + '|' + last.at] : null, lines = [];
        if (a) lines.push(`🤖 Automated review: <b>${Sim.esc(a.score)}%</b>${Array.isArray(a.results) && a.right != null ? ` · ${Sim.esc(a.right)} of ${a.results.length} right` : ''}${a.at ? ` · ${Sim.esc(String(a.at).slice(0, 10))}` : ''}`);
        if (last) lines.push(`📤 Submitted${subs.length > 1 ? ` ${subs.length} times` : ''}${last.result && last.result.score != null ? ` · its review ${Sim.esc(last.result.score)}%` : ''}${fb && fb.score != null ? ` · 👤 trainer <b>${Sim.esc(fb.score)}/100</b>` : ''}`);
        const cards = rec && rec.scorecards && Array.isArray(rec.scorecards[track]) ? rec.scorecards[track] : [], sc = cards[cards.length - 1];
        const scLine = sc && window.CalScorecard ? `<details class="cs-scorecard" style="margin-top:4px"><summary style="cursor:pointer">📋 Trainer’s scorecard: <b>${Sim.esc(sc.average)}/5 (${Sim.esc(sc.pct)}%)</b> · ${Sim.esc(String(sc.at).slice(0, 10))}</summary><div style="margin-top:6px">${CalScorecard.sheetHTML(sc)}</div></details>` : '';
        return `<div class="cs-review" style="font-size:13px;line-height:1.5;color:#334155;background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:8px 10px">${lines.length ? lines.join('<br>')
            : '🤖 No automated review yet: open it, book what the callers ask, then click <b>Check my calendar</b> to review it against the rules.'}${scLine}</div>`;
    };
    root.innerHTML = `<div style="max-width:1180px;margin:0 auto;padding:24px 16px 40px">
        <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start"><div><h1 style="margin:0 0 6px;color:#0b1633;font-size:28px">📅 Calendaring Simulators</h1>
        <p style="margin:0 0 18px;color:#475569;max-width:760px">Practice the calendar on a Google Calendar style week: <b>Standard Training</b> (Foundational · Calendar Management), the <b>Litigation Week</b> (Case Management) and the <b>Executive Week</b> (EA / PA). Save, run the automated review under the attorney’s rules, submit for your trainer’s feedback. Your scores are saved to your own record.</p></div>
        ${me.admin ? '<a class="sim-btn ghost" style="text-decoration:none;align-self:flex-start" href="/simulators/calsim.html?view=scores" title="The earlier drag-and-drop scheduler’s submissions. Scores from the three simulators are under Recent results on the Simulators page.">📊 Earlier scheduler scores</a>' : ''}</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px">
        ${TRACKS.map(t => `<div class="card" style="padding:18px;display:flex;flex-direction:column;gap:10px">${kicker(t.where)}
            <h3 style="margin:0;color:#0b1633;font-size:19px">${t.icon} ${Sim.esc(t.title)}</h3><p style="margin:0;color:#475569;font-size:14px;flex:1">${Sim.esc(t.desc)}</p>
            ${reviewHTML(t.id)}
            <div><a class="sim-btn orange" style="text-decoration:none" href="${Sim.esc(go(t.id))}">📅 Open →</a></div></div>`).join('')}
        <div class="card cs-calls" style="padding:18px;display:flex;flex-direction:column;gap:10px">${kicker('Calendaring & Appointment Setting Training')}
            <h3 style="margin:0;color:#0b1633;font-size:19px">Calendar Management Mock Calls</h3><p style="margin:0;color:#475569;font-size:14px;flex:1">In the CMS Call Simulator: a caller phones in about one of the firm’s cases. Get their name, verify them, find their file in the CMS and handle the call. Who called, and about which case, is in your debrief.</p>
            <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="sim-btn orange" style="text-decoration:none" href="${Sim.esc(callHref(true))}">🎯 Take a graded call</a><a class="sim-btn ghost" style="text-decoration:none" href="${Sim.esc(callHref(false))}">📞 Practice a caller</a></div></div></div>
        ${me.admin ? '<div id="cs-trainees" style="margin-top:22px"></div><p style="margin:14px 0 0;color:#64748b;font-size:13.5px">Your trainees’ scores from these simulators are also under <a href="/simulators.html#results">Recent results</a> on the Simulators page.</p>' : ''}</div>`;
    if (me.admin) traineesList(TRACKS);
})();
// 👥 Your trainees’ calendars (trainers): everyone who has a calendar saved on a simulator, with 👁 View & score on each track:
// their calendar in the Google Calendar look, read only, with the automated check and the CALENDAR MANAGEMENT MOCK CALL
// scorecard (gcal.html?trainee=<username>), and the last scorecard given.
async function traineesList(TRACKS) {
    const box = document.getElementById('cs-trainees'); if (!box) return;
    const E = (t) => Sim.esc(t), card = (inner) => `<div class="card" style="padding:18px">${inner}</div>`;
    box.innerHTML = card('<h2 style="margin:0;font-size:20px;color:#0b1633">👥 Your trainees’ calendars</h2><p style="margin:6px 0 0;color:#64748b">Loading…</p>');
    let drafts = [], recs = [];
    try {
        const [a, b] = await Promise.all([fetch('/api/gcal-reviews?drafts=1', { credentials: 'include' }).then(r => r.json()), fetch('/api/calsim?all=1', { credentials: 'include' }).then(r => r.json())]);
        drafts = (a && a.success && a.drafts) || []; recs = (b && b.success && b.rows) || [];
    } catch (e) { drafts = []; }
    const people = {};
    drafts.forEach(d => { const p = people[d.username] = people[d.username] || { username: d.username, name: d.name || d.username, batch: d.batch || '', tracks: {}, latest: '' }; p.tracks[d.track] = { at: d.updatedAt }; if (String(d.updatedAt) > p.latest) p.latest = String(d.updatedAt); });
    recs.forEach(r => { const sc = (r.data && r.data.scorecards) || {}; Object.keys(sc).forEach(t => { const list = Array.isArray(sc[t]) ? sc[t] : []; if (!list.length) return;
        const p = people[r.username] = people[r.username] || { username: r.username, name: r.name || r.username, batch: r.batch || '', tracks: {}, latest: '' }; (p.tracks[t] = p.tracks[t] || {}).card = list[list.length - 1]; }); });
    const list = Object.values(people).sort((x, y) => String(y.latest).localeCompare(String(x.latest)) || x.name.localeCompare(y.name));
    const href = (u, t) => '/simulators/gcal.html?' + (t === 'standard' ? '' : 'track=' + encodeURIComponent(t) + '&') + 'trainee=' + encodeURIComponent(u);
    const when = (t) => { const d = new Date(String(t || '').replace(' ', 'T') + (/[zZ]|[+-]\d\d:?\d\d$/.test(String(t || '')) ? '' : 'Z')); return isNaN(d) ? '' : d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); };
    const cell = (p, t) => { const x = p.tracks[t.id]; if (!x) return '<td style="color:#94a3b8">—</td>';
        return `<td><a class="sim-btn orange cs-view" style="text-decoration:none;padding:5px 10px;font-size:13px" href="${E(href(p.username, t.id))}">👁 View &amp; score</a>
            <div style="font-size:12px;color:#64748b;margin-top:3px">${x.at ? 'Saved ' + E(when(x.at)) : 'Not saved'}${x.card ? ` · 📋 <b style="color:#0b1633">${E(x.card.average)}/5 (${E(x.card.pct)}%)</b>` : ''}</div></td>`; };
    box.innerHTML = card(`<h2 style="margin:0;font-size:20px;color:#0b1633">👥 Your trainees’ calendars</h2>
        <p style="margin:6px 0 10px;color:#475569;font-size:14px">Open a trainee’s calendar as they last saved it, read only, with the automated check, and score it on the <b>CALENDAR MANAGEMENT MOCK CALL</b> scorecard (each metric 0 to 5 with your feedback). The trainee sees your scorecard on their card here and in the simulator.</p>
        ${list.length ? `<input id="cs-tfind" type="search" placeholder="Find a trainee or batch…" style="width:min(100%,320px);font:inherit;padding:7px 10px;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:10px" oninput="csFind(this.value)">
        <div style="overflow-x:auto"><table class="cs-ttable" style="width:100%;border-collapse:collapse;font-size:14px"><thead><tr style="text-align:left;color:#64748b;font-size:12px;text-transform:uppercase;letter-spacing:.04em"><th style="padding:6px 8px">Trainee</th>${TRACKS.map(t => `<th style="padding:6px 8px">${t.icon} ${E(t.title)}</th>`).join('')}</tr></thead>
        <tbody>${list.map(p => `<tr data-find="${E((p.name + ' ' + p.batch + ' ' + p.username).toLowerCase())}" style="border-top:1px solid #e5e7eb"><td style="padding:8px"><b>${E(p.name)}</b><div style="font-size:12px;color:#64748b">${E(p.batch || 'No batch')}</div></td>${TRACKS.map(t => cell(p, t).replace('<td', '<td style="padding:8px;vertical-align:top"')).join('')}</tr>`).join('')}</tbody></table></div>`
        : '<p style="margin:0;color:#64748b">No trainee has saved a calendar yet. A trainee’s calendar is saved to their account as they work in a simulator.</p>'}`);
}
window.csFind = function (q) { q = String(q || '').trim().toLowerCase(); document.querySelectorAll('.cs-ttable tbody tr').forEach(tr => { tr.style.display = !q || tr.dataset.find.includes(q) ? '' : 'none'; }); };
</script>
</body>
</html>
