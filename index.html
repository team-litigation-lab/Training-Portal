    p.style.display = Number(p.dataset.idx)===i ? "block" : "none";

window.switchTaskTab = switchTaskTab;

function relatedTools(dayId){
  return PRACTICE_TOOLS.filter(t=>{
    const nums = (t.relates.match(/\d+/g)||[]).map(Number);
    return nums.includes(dayId);
  });
}
function renderRelatedTools(dayId){
  const tools = relatedTools(dayId);
  if(!tools.length) return "";
  return `
    <div class="card" style="padding:16px 20px;margin-bottom:16px;background:#FFFBF3;border-color:var(--orange-soft);">
      <b style="color:var(--navy);font-size:13px;">⚖ Practice what you just read</b>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px;">
        ${tools.map(t=>`
          <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;">

function renderDay(id){
  const d = DAYS.find(x=>x.id===id);
  if(!d) return `<p>Day not found.</p>`;
  if(!dayUnlocked(id)){
    return `
      <a class="back-link" onclick="goto('dashboard')">&larr; Back to roadmap</a>
      <div class="card" style="padding:40px;text-align:center;">
        <div style="font-size:34px;margin-bottom:10px;">🔒</div>
        <h2 style="color:var(--navy);margin:0 0 8px;">Day ${id} is locked</h2>
        <p style="color:var(--ink-soft);font-size:14px;">Complete Day ${id-1} with a passing score (70%+) to unlock this day.</p>
        <button class="btn btn-primary" style="margin-top:14px;" onclick="goto('day',${id-1})">Go to Day ${id-1}</button>
      </div>`;
  }

  return `
    <a class="back-link" onclick="goto('dashboard')">&larr; Back to roadmap</a>

      <p class="eyebrow">Day ${d.id} of 10</p>
      <h1>${esc(d.title)}</h1>
      <p>${esc(d.objective)}</p>

      <div class="discussion-tag">💬 For Discussion</div>

    <div id="quizWrap">${renderQuiz(d)}</div>
  `;

function renderLessonSlideshow(d){
  const total = d.lessons.length;
  const idx = Math.min(state.lessonSlide||0, total-1);
  const isLast = idx===total-1;

  if(state.slideInterstitial){
    const it = state.slideInterstitial;
    return `
      <div class="slide-dots">
        ${d.lessons.map((_,i)=>`<span class="slide-dot ${i===idx?'active':i<idx?'visited':''}"></span>`).join("")}
      </div>
      <div class="slide-interstitial">
        <div class="si-icon">${it.toKnowledgeCheck?"📝":"→"}</div>
        <div class="si-label">${it.toKnowledgeCheck?"Wrapping up the lessons":"Next Topic"}</div>
        <div class="si-title">${esc(it.title)}</div>
      </div>
    `;
  }

  const l = d.lessons[idx];
  return `
    <div class="slide-dots">
      ${d.lessons.map((_,i)=>`<span class="slide-dot ${i===idx?'active':i<idx?'visited':''}" onclick="goToSlide(${i})" title="Topic ${i+1}"></span>`).join("")}
    </div>
    <div class="lesson-slide dir-${state.slideDir||'next'}" id="lessonSlideWrap">
      ${renderLessonCard(l,idx,d)}
      ${renderQuickChecksAfter(d,idx)}
    </div>
    <div class="slide-nav">
      <button class="btn btn-ghost" ${idx===0?'disabled':''} onclick="prevSlide()">&larr; Previous</button>
      <span class="slide-counter">Topic ${idx+1} of ${total}</span>
      ${isLast
        ? `<button class="btn btn-primary" onclick="goToKnowledgeCheckWithInterstitial()">Continue to Knowledge Check &rarr;</button>`
        : `<button class="btn btn-primary" onclick="nextSlide()">Next Topic &rarr;</button>`}
    </div>
    ${isLast ? `<div class="slide-done-banner">🎉 That's every topic for Day ${d.id} — nice work. Practice what you learned below, or jump straight to the Knowledge Check.</div>` : ""}
  `;
}
function goToSlide(i){
  state.slideDir = i>(state.lessonSlide||0) ? "next" : "prev";
  state.lessonSlide = i;
  refreshLessonSlide();
}
window.goToSlide = goToSlide;
function nextSlide(){
  const d = DAYS.find(x=>x.id===state.dayId);
  const nextIdx = (state.lessonSlide||0)+1;
  if(nextIdx <= d.lessons.length-1){
    state.slideDir = "next";
    state.slideInterstitial = { title: d.lessons[nextIdx].h, toKnowledgeCheck:false };
    render();
    setTimeout(()=>{
      state.slideInterstitial = null;
      state.lessonSlide = nextIdx;
      refreshLessonSlide();
    }, 850);
  }
}
window.nextSlide = nextSlide;
function goToKnowledgeCheckWithInterstitial(){
  state.slideInterstitial = { title: "Knowledge Check", toKnowledgeCheck:true };
  render();
  setTimeout(()=>{
    state.slideInterstitial = null;
    render();
    setTimeout(()=>{ scrollToKnowledgeCheck(); }, 30);
  }, 900);
}
window.goToKnowledgeCheckWithInterstitial = goToKnowledgeCheckWithInterstitial;
function prevSlide(){
  if((state.lessonSlide||0) > 0){
    state.slideDir = "prev";
    state.lessonSlide = (state.lessonSlide||0)-1;
    refreshLessonSlide();
  }
}
window.prevSlide = prevSlide;
function refreshLessonSlide(){
  render();
  setTimeout(()=>{
    const el = document.getElementById("lessonSlideWrap");
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
  }, 30);
}
function scrollToKnowledgeCheck(){
  const el = document.getElementById("knowledgeCheckAnchor");
  if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
}
window.scrollToKnowledgeCheck = scrollToKnowledgeCheck;

function renderLessonCard(l,i,d){
  return `
    <div class="topic-separator">DAY ${d.id} &middot; TOPIC ${i+1} OF ${d.lessons.length}</div>
    <div class="card lesson-card">
      <h4><span class="lnum">0${i+1}</span>${esc(l.h)}</h4>
      ${renderLessonVisual(l)}
      <ul>${l.b.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      ${l.callout?renderCallout(l.callout):""}
      ${l.example?renderExample(l.example):""}
      ${l.table?renderTable(l.table):""}
    </div>`;
}
function renderLessonVisual(l){
  switch(l.layout){
    case "QUADRANT": return renderQuadrantVisual(l.quadrants);
    case "PROCESS": return renderProcessVisual(l.processSteps);
    case "COMPARE": return renderCompareVisual(l.compareLeft, l.compareRight);
    case "THREEBOX": return renderThreeBoxVisual(l.boxes);
    case "STAT": return renderStatVisual(l.statNumber, l.statLabel);
    default: return "";
  }
}
function renderQuadrantVisual(quadrants){
  return `<div class="lesson-quadrant">
    ${quadrants.map(q=>`
      <div class="qbox">
        <div class="qlabel">${esc(q.label)}</div>
        <div class="qdesc">${esc(q.desc)}</div>
      </div>`).join("")}
  </div>`;
}
function renderProcessVisual(steps){
  return `<div class="lesson-process">
    ${steps.map((s,i)=>`
      ${i>0?'<div class="lesson-process-arrow">&darr;</div>':""}

async function submitQuiz(dayId){
  const d = DAYS.find(x=>x.id===dayId);
  const total = d.quiz.length;
  const answered = Object.keys(state.quizAnswers).length;
  if(answered<total){ toast(`Answer all ${total} questions first (${answered}/${total} done).`); return; }
  let correct=0;
  d.quiz.forEach((q,i)=>{ if(state.quizAnswers[i]===q.a) correct++; });
  const score = Math.round((correct/total)*100);
  const passed = score>=70;
  state.quizSubmitted=true;
  state.lastScore=score; state.lastCorrect=correct; state.lastTotal=total; state.lastPassed=passed;

  const prevBest = state.progress[dayId]?.score || 0;
  const newRecord = {done: passed || (state.progress[dayId]?.done||false), score: Math.max(score, prevBest), date: new Date().toISOString()};
  state.progress[dayId]=newRecord;
  await storeSet("day-progress", state.progress);
  syncToLedger();

  document.getElementById("quizWrap").innerHTML = renderQuiz(d);
  document.getElementById("quizWrap").scrollIntoView({behavior:"smooth",block:"start"});
  renderAnswerFeedback(d);

const CAL_DAY_START = 8.5, CAL_DAY_END = 17.5, CAL_PX_PER_HR = 46;

function calMergedEvents(){
  const originals = CAL_EVENTS.map((e,i)=>{
    const ov = toolState.calEdits[i]||{};
    return Object.assign({}, e, ov, {idx:i, custom:false, _deleted:!!ov.deleted});
  });
  const customs = (toolState.calCustomEvents||[]).map((e,ci)=>Object.assign({}, e, {idx:CAL_EVENTS.length+ci, custom:true, _deleted:false}));
  return originals.concat(customs).filter(e=>!e._deleted);
}
function calFindConflicts(events){
  const conflicts=[];
  for(let i=0;i<events.length;i++){
    for(let j=i+1;j<events.length;j++){
      const a=events[i], b=events[j];
      if(a.day===b.day && a.s<b.e && b.s<a.e) conflicts.push([a.idx!==undefined?a.idx:i, b.idx!==undefined?b.idx:j]);
    }
  }
  return conflicts;
}

async function initCalendar(body){
  toolState.calEdits = (await storeGet("calendar-edits")) || {};
  toolState.calCustomEvents = (await storeGet("calendar-custom")) || [];
  toolState.calBaseline = calFindConflicts(CAL_EVENTS).length; // conflicts before any edits, fixed for this session
  renderCalendarBody(body);
}

function renderCalendarBody(body){
  const events = calMergedEvents();
  const conflicts = calFindConflicts(events);
  const conflictIdx = new Set(conflicts.flat());
  const hours=[]; for(let h=Math.ceil(CAL_DAY_START);h<=Math.floor(CAL_DAY_END);h++) hours.push(h);
  const colH = (CAL_DAY_END-CAL_DAY_START)*CAL_PX_PER_HR;

  function colFor(day){
    const dayEvents = events.filter(e=>e.day===day);
    return dayEvents.map(e=>{
      const top = (e.s-CAL_DAY_START)*CAL_PX_PER_HR;
      const h = Math.max((e.e-e.s)*CAL_PX_PER_HR, 30);
      const isConflict = conflictIdx.has(e.idx);
      const bg = e.color || PRI_COLOR[e.p];
      return `<div class="cal-block ${isConflict?'conflict':''}" draggable="true"
                ondragstart="calDragStart(event,${e.idx})"

        <button class="cal-del-btn" onclick="event.stopPropagation(); calDeleteEvent(${e.idx})" title="Remove this event">✕</button>
        <b>${esc(e.t)}</b><span class="cal-sub">${e.loc!=="—"?esc(e.loc)+" · ":""}${esc(e.type)}</span>

  body.innerHTML = `

    <div class="legend-row">
      ${["High","Medium","Low"].map(p=>`<span class="legend-chip"><span class="sw" style="background:${PRI_COLOR[p]};"></span>${p} priority</span>`).join("")}
      <button class="btn btn-navy btn-sm" style="margin-left:auto;" onclick="openAddEventDialog()">+ Add Event</button>
      <button class="btn btn-ghost btn-sm" onclick="calReset()">Reset to Original</button>
    </div>
    <div class="week-grid">
      <div class="week-gutter" style="height:${colH+30}px;">
        <div class="week-corner"></div>
        ${hours.map(h=>`<div class="week-hour" style="height:${CAL_PX_PER_HR}px;">${h>12?h-12:h}${h>=12?'PM':'AM'}</div>`).join("")}
      </div>
      ${DAY_ORDER.map(day=>`
        <div class="week-col" ondragover="event.preventDefault()" ondrop="calDrop(event,'${day}')">

    <p style="font-size:12.8px;color:var(--ink-soft);margin:0 0 12px;">A good EA doesn't just manage what's on the calendar — they spot what's <i>missing</i> from it. Get a fresh, AI-generated read on the current calendar above and see what independent admin work it implies.</p>
    <button class="btn btn-orange btn-sm" onclick="generateProactiveTasks()">Generate Proactive Tasks</button>
    <div id="proactiveResult" style="margin-top:14px;"></div>

}
function toHex(c){
  if(c.startsWith("#")) return c;
  return "#DB8437";

function calDragStart(ev, idx){
  ev.dataTransfer.setData("text/plain", String(idx));

window.calDragStart = calDragStart;
async function applyCalMove(idx, day, newStart){
  const target = calMergedEvents().find(e=>e.idx===idx);
  if(!target) return;
  const dur = target.e - target.s;
  newStart = Math.round(newStart*2)/2; // snap to nearest 30 min
  newStart = Math.max(CAL_DAY_START, Math.min(newStart, CAL_DAY_END-dur));
  if(idx < CAL_EVENTS.length){
    const existing = toolState.calEdits[idx] || {};
    toolState.calEdits[idx] = {...existing, day, s:newStart, e:newStart+dur};
    await storeSet("calendar-edits", toolState.calEdits);
  }else{

async function checkAudit(){
  const a = toolState.audit;
  const unhandled = INVOICE_QUEUE.filter((_,i)=>!a.statuses[i]).length;
  if(unhandled>0){ toast(`Classify all ${INVOICE_QUEUE.length} invoices first (${unhandled} left).`); return; }
  const needsErrorType = INVOICE_QUEUE.filter((_,i)=>a.statuses[i]==="correction" && !a.errorTypes[i]).length;
  if(needsErrorType>0){ toast(`Pick a reason for each invoice flagged for correction (${needsErrorType} left).`); return; }

  let classCorrect=0, errorCorrect=0, correctionTotal=0;
  const feedback = [];
  INVOICE_QUEUE.forEach((inv,i)=>{
    const yourStatus = a.statuses[i];
    const classOk = yourStatus===inv.status;
    if(classOk) classCorrect++;
    if(inv.status==="correction") correctionTotal++;
    let errOk = null;
    if(inv.status==="correction"){
      errOk = a.errorTypes[i]===inv.errorType;
      if(errOk) errorCorrect++;
    }
    feedback.push({inv, classOk, errOk});
  });
  const totalPossible = INVOICE_QUEUE.length + correctionTotal;
  const score = Math.round(((classCorrect+errorCorrect)/totalPossible)*100);

  const reconcileTotal = INVOICE_QUEUE.reduce((sum,inv)=>{
    if(inv.status==="valid") return sum+inv.statedTotal;
    if(inv.status==="correction") return sum+(inv.correctTotal||0);
    return sum;
  },0);

  document.getElementById("auditResult").innerHTML = `
    <div class="card" style="padding:18px 20px;margin-top:14px;">
      <b style="color:var(--navy);">Classification ${classCorrect}/${INVOICE_QUEUE.length} · Correction reasons ${errorCorrect}/${correctionTotal} (${score}% overall)</b>
      <p style="font-size:12.8px;color:var(--ink-soft);margin:8px 0 0;">Correct amount to reconcile against Alvarez's trust account, once corrections are made and the duplicate is excluded: <b style="color:var(--navy);">$${reconcileTotal.toLocaleString()}</b></p>

            <b style="color:var(--ink);">Invoice #${esc(inv.invNum)}</b> — correct status: <b>${inv.status}</b> ${classOk?"✅":"❌ (you said "+(toolState.audit.statuses[INVOICE_QUEUE.indexOf(inv)]||"—")+")"}
            ${inv.explain?`<div style="margin-top:2px;">${esc(inv.explain)}</div>`:""}
            ${errOk===false?`<div style="margin-top:2px;color:var(--danger);">Reason selected didn't match — correct reason: ${esc(ERROR_TYPES.find(e=>e.id===inv.errorType).label)}</div>`:""}
          </div>`).join("")}
      </div>
    </div>`;
  await bumpPracticeProgress("financial", score);
  if(score===100) burstConfetti();
}

async function reviewItinerary(){
  const el = document.getElementById("itinReview");
  const btn = document.getElementById("travelReviewBtn");
  const { legs, stops } = toolState.travel;
  if(!legs.length && !stops.length){ toast("Add at least one flight leg or stop first."); return; }
  btn.disabled = true;
  el.innerHTML = `<div class="ai-loading">Reviewing for meticulousness and resourcefulness…</div>`;
  const legsSummary = legs.map(l=>`- ${l.route||"(route TBD)"} on ${l.date||"(date TBD)"}, seat "${l.seat||"(not set)"}", ${l.direct?"direct":"connecting"}, screenshot: ${l.screenshotUrl?"provided":"MISSING"}, booking link: ${l.bookingLink?"provided":"MISSING"}. Notes: ${l.notes||"(none)"}`).join("\n");
  const stopsSummary = stops.map(s=>`- ${s.venue||"(venue TBD)"} at ${s.address||"(address TBD)"}, ${s.travelTime||"(no travel time given)"} from ${s.hotel||"(no hotel given)"}. Photo: ${s.photoUrl?"provided":"MISSING"}. Link: ${s.link?"provided":"MISSING"}. Rationale: ${s.insight||"(none)"}`).join("\n");
  const prompt = `You are grading a trainee Executive Assistant's travel itinerary for a legal-industry EA training program. This is a personal family trip for the client, Elias Thorne, taking his wife Sarah and children Leo (8) and Maya (5) to Spain. Grade strictly on meticulous detail and resourcefulness — this is the hardest exercise in the program by design.

CLIENT TRAVEL PREFERENCES (hard constraints):
- Seat: ${FLIGHT_PREFS.seat}
- Routing: ${FLIGHT_PREFS.routing}
- Redeye: ${FLIGHT_PREFS.redeye}
- Hotel: ${FLIGHT_PREFS.hotel}
- Also relevant: strict Paleo diet, zero dairy for Elias; something age-appropriate should be planned for the kids.

FLIGHT LEGS SUBMITTED:
${legsSummary || "(none)"}

ITINERARY STOPS SUBMITTED:
${stopsSummary || "(none)"}

Evaluate:
1. Do the flights actually match seat/routing preferences? Call out any that don't.
2. Are screenshots and direct links present, or missing? Missing evidence should be penalized — a real EA doesn't hand over an itinerary without proof of the booking.
3. Are venue/stop choices backed by real reasoning (client- and family-relevant, not generic "nice place"), including whether the strict Paleo/dairy-free need and something age-appropriate for the kids were actually addressed?
4. Is proximity/logistics actually addressed (travel time from hotel), not left blank?
5. Overall resourcefulness: does this itinerary look like it required real research, or does it read as placeholder content?

Give a structured critique: 2-3 bullets on flights, 2-3 bullets on stops, then one overall score out of 100 with a one-sentence justification. End your response with a line in exactly this format: "SCORE: <number>"`;
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:750, messages:[{role:"user", content:prompt}] })
    });
    if(!response.ok) throw new Error("Request failed");
    const data = await response.json();
    const feedback = (data.content||[]).map(b=>b.text||"").join("\n").trim() || "No feedback returned.";
    const scoreMatch = feedback.match(/SCORE:\s*(\d{1,3})/i);
    const score = scoreMatch ? Math.min(100, Number(scoreMatch[1])) : 50;
    el.innerHTML = `<div class="ai-result"><b>AI Review — Itinerary</b><div class="ai-result-body">${esc(feedback.replace(/SCORE:\s*\d{1,3}/i,"").trim()).replace(/\n/g,"<br>")}</div></div>`;
    toolState.travel.score = score;
    await bumpPracticeProgress("travel", score);
    if(score>=90) burstConfetti();
  }catch(e){
    el.innerHTML = `<div class="ai-result ai-error"><b>Couldn't get a review</b><div class="ai-result-body">Check your connection and try again.</div></div>`;
  }finally{
    btn.disabled = false;
  }
}

function drawPdfHeader(doc, title, subtitle){
  const navy=[38,43,69], orange=[219,132,55];
  const pageW = doc.internal.pageSize.getWidth();
  const marginX = 54;
  doc.setFillColor(...navy);
  doc.rect(0,0,pageW,86,"F");
  try{
    doc.addImage(LOGO_ICON_DATAURI, "PNG", marginX, 20, 46, 46);
  }catch(e){
    doc.setFillColor(...orange);
    doc.circle(marginX+16, 43, 15, "F");
    doc.setTextColor(255,255,255);
    doc.setFont("helvetica","bold"); doc.setFontSize(11);
    doc.text("LSH", marginX+16, 47, {align:"center"});
  }
  doc.setTextColor(255,255,255);
  doc.setFont("helvetica","bold"); doc.setFontSize(16);

/** Generic line-based report builder for Practice Lab downloads.
 *  Lines: plain strings (wrapped body text), "---" for a divider,
 *  or strings starting with "## " for a bold sub-heading. */
function buildAndSavePdf(title, subtitle, bodyLines, filenameBase){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"pt", format:"letter"});
  drawPdfHeader(doc, title, subtitle);
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const marginX = 54;
  let y = 118;
  doc.setTextColor(27,30,46);
  doc.setFont("helvetica","normal"); doc.setFontSize(10);
  doc.text(`Trainee: ${state.traineeName || "—"}`, marginX, y);
  doc.text(`Date: ${new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})}`, pageW-marginX, y, {align:"right"});
  y += 20;

  bodyLines.forEach(line=>{
    if(line==="---"){
      y+=4; doc.setDrawColor(220,224,234); doc.line(marginX,y,pageW-marginX,y); y+=14; return;
    }
    const isHeading = line.startsWith("## ");
    const text = isHeading ? line.slice(3) : line;
    doc.setFont("helvetica", isHeading?"bold":"normal");
    doc.setFontSize(isHeading?11.5:10);
    doc.setTextColor(...(isHeading?[38,43,69]:[27,30,46]));
    const wrapped = doc.splitTextToSize(text, pageW-marginX*2);
    wrapped.forEach(w=>{
      if(y>pageH-60){ doc.addPage(); y=60; }
      doc.text(w, marginX, y);
      y += isHeading?16:14;
    });
    if(isHeading) y+=2;
  });

  doc.setFontSize(8); doc.setTextColor(110,116,140);
  doc.text("LSH EA / PA Upskill Program — generated from this trainee's saved activity.", marginX, pageH-30);
  doc.save(`${filenameBase}_${(state.traineeName||"trainee").replace(/\s+/g,"_")}.pdf`);
  toast("Downloaded");
}

async function downloadFullPortfolioPdf(){

    `## Complete Training Portfolio`,

    lines.push(`Day ${d.id} — ${d.title}: ${status}`);
  });

  lines.push("---", "## Practice Lab Progress");
  const pp = state.practiceProgress||{};
  PRACTICE_TOOLS.forEach(t=>{

  lines.push("---", "## My Notes");

    lines.push("(No notes saved yet.)");
  }else{
    state.notes.forEach(n=>{
      lines.push(`## ${n.title || "Untitled Note"}`);
      lines.push(n.content && n.content.trim() ? n.content.trim() : "(Empty)");
      lines.push("");
    });
  }

async function downloadDayPdf(dayId){
  await ensureTraineeName();
  const d = DAYS.find(x=>x.id===dayId);
  const prog = state.progress[dayId];
  const lines = [`## Day ${d.id} — ${d.title}`, d.objective, "---", "## Lessons"];
  d.lessons.forEach(l=>{
    lines.push(`## ${l.h}`);
    l.b.forEach(b=>lines.push(`   • ${b}`));
    if(l.callout) lines.push(`   Note: ${l.callout.text}`);
    if(l.example){
      lines.push(`   Example — ${l.example.label||""}`);
      l.example.lines.forEach(x=>lines.push(`     ${x}`));
    }
    if(l.table){
      lines.push(`   ${l.table.headers.join(" | ")}`);
      l.table.rows.forEach(r=>lines.push(`   ${r.join(" | ")}`));
    }
  });
  lines.push("---", "## Knowledge Check");
  if(prog){
    lines.push(`Score: ${prog.score}%  (${prog.done?"Passed":"Not yet passed"})`, `Date: ${fmtDate(prog.date)}`);
  }else{
    lines.push("Not yet attempted.");
  }
  buildAndSavePdf("LSH EA / PA Upskill Program", `Day ${d.id} — ${d.title}`, lines, `LSH_Day${d.id}_Summary`);
}

function renderNoteCard(n){

function findNote(id){ return state.notes.find(n=>n.id===id); }

function onNoteChange(id, field, value){
  const n = findNote(id);
  if(!n) return;
  n[field] = value;
  const savedEl = document.getElementById(`saved_${id}`);
  if(savedEl) savedEl.textContent = "Saving…";
  clearTimeout(noteDebounceTimers[id]);
  noteDebounceTimers[id] = setTimeout(async ()=>{
    n.updatedAt = new Date().toISOString();
    const ok = await storeSet("notes", state.notes);
    const el = document.getElementById(`saved_${id}`);
    if(el) el.textContent = ok ? ("Saved "+fmtDate(n.updatedAt)) : "Couldn't save";
  }, 800); // debounced so we're not writing to storage on every keystroke
}
window.onNoteChange = onNoteChange;

async function addNote(){
  state.notes.push({id:"note_"+Date.now(), title:"New Note", content:"", updatedAt:new Date().toISOString(), pinned:false});
  await storeSet("notes", state.notes);
  render();
}
window.addNote = addNote;

async function deleteNote(id){
  state.notes = state.notes.filter(n=>n.id!==id);
  await storeSet("notes", state.notes);

}
window.deleteNote = deleteNote;

async function getAIFeedback(id){
  const n = findNote(id);
  if(!n) return;
  if(!n.content || n.content.trim().length<15){
    toast("Write a bit more before requesting feedback.");
    return;
  }
  const btn = document.getElementById(`aiBtn_${id}`);
  const fb = document.getElementById(`aifeedback_${id}`);
  btn.disabled = true; btn.textContent = "Reviewing…";
  fb.style.display = "block";
  fb.innerHTML = `<div class="ai-loading">Analyzing your note for quality, professionalism, and compliance…</div>`;

  const prompt = `You are reviewing a note written by a trainee in a Legal Executive Assistant / Personal Assistant training program at a company called Legal Support Help (LSH). The note may be an action plan, reflection, or general notes.

Evaluate the note against these standards taught in the program:
1. Clarity & Quality — is it specific and actionable, not vague?
2. Professionalism — is the tone and language appropriate for legal-office correspondence?
3. Compliance & Confidentiality awareness — does it reflect sound judgment about confidentiality, escalation, and professional boundaries (where relevant)?

Give concise, constructive feedback in 3-5 short bullet points, plus one overall takeaway sentence. Be encouraging but honest. Do not restate the note back verbatim. If the note is just a to-do list or personal reflection with no compliance angle, focus only on clarity and professionalism.

Note title: "${n.title}"
Note content:
"""
${n.content}
"""`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 600,
        messages: [{ role: "user", content: prompt }]
      })
    });
    if(!response.ok) throw new Error("Request failed: "+response.status);
    const data = await response.json();
    const text = (data.content||[]).map(b=>b.text||"").join("\n").trim();
    fb.innerHTML = text
      ? `<div class="ai-result"><b>AI Feedback</b><div class="ai-result-body">${esc(text).replace(/\n/g,"<br>")}</div></div>`
      : `<div class="ai-result"><b>AI Feedback</b><div class="ai-result-body">No feedback returned — try again in a moment.</div></div>`;
  }catch(e){
    fb.innerHTML = `<div class="ai-result ai-error"><b>Couldn't get feedback</b><div class="ai-result-body">The review service didn't respond. Check your connection and try again.</div></div>`;
  }finally{
    btn.disabled = false; btn.textContent = "✨ Get AI Feedback";
  }
}
window.getAIFeedback = getAIFeedback;

   ADMIN DASHBOARD
   ------------------------------------------------------------
   Honesty note (also surfaced in the UI): this is a LIGHTWEIGHT
   gate, not real authentication. The passphrase below is checked
   client-side and anyone with browser dev tools can bypass it or
   read/write any trainee's data directly. Fine for low-stakes
   internal practice tracking; not a substitute for a real backend
   if this ever needs to hold sensitive records.
   ============================================================ */

const ADMIN_PASSPHRASE = "LSHAdmin2026"; // change this before wider rollout

function openAdmin(){
  if(state.isAdmin){ goto("admin"); return; }
  const overlay=document.createElement("div");
  overlay.className="overlay";
  overlay.innerHTML=`
    <div class="card">
      <h3>🛡 Admin Access</h3>
      <p>Enter the admin passphrase. Note: this is a lightweight gate for internal use, not secure authentication — anyone with the passphrase (or browser dev tools) can view all trainee data.</p>
      <input id="adminPass" type="password" placeholder="Passphrase">
      <div class="row">
        <button class="btn btn-ghost" id="cancelAdmin">Cancel</button>
        <button class="btn btn-primary" id="submitAdmin">Enter</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById("adminPass").focus();
  document.getElementById("cancelAdmin").onclick=()=>overlay.remove();
  const tryLogin=()=>{
    const v=document.getElementById("adminPass").value;
    if(v===ADMIN_PASSPHRASE){
      state.isAdmin=true;
      overlay.remove();
      goto("admin");
    }else{
      toast("Incorrect passphrase.");
    }
  };
  document.getElementById("submitAdmin").onclick=tryLogin;
  document.getElementById("adminPass").addEventListener("keydown",(e)=>{ if(e.key==="Enter") tryLogin(); });
  overlay.addEventListener("click",(e)=>{ if(e.target===overlay) overlay.remove(); });
}
window.openAdmin = openAdmin;

function adminLogout(){
  state.isAdmin=false;
  state.adminData=null;
  goto("dashboard");
  toast("Logged out of Admin");
}
window.adminLogout = adminLogout;

async function loadAdminLedger(){
  state.adminLoading = true;
  const keys = await sharedList("trainee:");
  const records = [];
  for(const k of keys){
    const key = typeof k === "string" ? k : k.key;
    const rec = await sharedGet(key);
    if(rec) records.push(rec);
  }
  state.adminData = records;
  state.adminLoading = false;
  render();
}

function adminDayStats(rec){
  const dp = rec.dayProgress || {};
  const done = Object.values(dp).filter(p=>p&&p.done).length;
  const scores = Object.values(dp).filter(p=>p&&typeof p.score==="number").map(p=>p.score);
  const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
  return {done, total:DAYS.length, avg};
}
function adminPracticeStats(rec){
  const pp = rec.practiceProgress || {};
  const runs = Object.values(pp).reduce((a,v)=>a+(v.runs||0),0);
  const scores = Object.values(pp).filter(v=>typeof v.bestScore==="number").map(v=>v.bestScore);
  const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
  return {runs, avg};
}

async function downloadCohortPdf(){
  const lines = ["## Trainee Audit — Cohort Report"];
  state.adminData.forEach(rec=>{
    const day = adminDayStats(rec);
    const practice = adminPracticeStats(rec);
    lines.push(`${rec.name} (${rec.id})`);
    lines.push(`   Days: ${day.done}/${day.total}  ·  Avg score: ${day.avg}%  ·  Practice runs: ${practice.runs}, avg best ${practice.avg}%  ·  Last active: ${rec.lastActive?fmtDate(rec.lastActive):"—"}`);
  });

/* ============================================================
   EMAIL MANAGEMENT
   One unified inbox exercise: build a filing system with labels
   and sub-labels, draft real replies, and catch a hidden
   phishing attempt. No tiers — the trainee judges every message
   on its own and decides what to do with it.

   UI mirrors common webmail conventions (folder sidebar, list +
   reading pane, unread bolding, avatar initials, star,
   hover-reveal actions, a collapsed inline reply that expands)
   — built with our own styling, not a reproduction of any
   specific product's branding or trademarked design.
   ============================================================ */

const ESIM_AVATAR_COLORS = ["#B54A3F","#DB8437","#3F7D58","#3C4268","#6B4FA0","#2C7A7B","#B5651F","#5B6178"];
function esimAvatar(from){
  const namePart = from.split(/[,<]/)[0].trim();
  const initials = namePart.split(/\s+/).map(w=>w[0]).filter(Boolean).slice(0,2).join("").toUpperCase() || "?";
  let hash=0; for(let i=0;i<namePart.length;i++) hash = namePart.charCodeAt(i) + ((hash<<5)-hash);
  const color = ESIM_AVATAR_COLORS[Math.abs(hash)%ESIM_AVATAR_COLORS.length];
  return {initials, color};
}

async function initEmailSim(body){
  toolState.esim = {
    replies:{}, archived:{}, reported:{}, linkClicked:{}, unread:{}, starred:{}, replyOpen:{},
    searchQuery:"", addingUnder:null, selectedFolder:null,
    phase:"in_progress", // "in_progress" | "failed" | "evaluating" | "evaluated"
    failReason:null, selected:0, report:null, securityScore:null, filingScore:null
  };
  toolState.iz = {inbox:[], placements:{}};
  EMAIL_SIM_MESSAGES.forEach((_,i)=>{ toolState.esim.unread[i] = true; });
  toolState.esim.labels = (await storeGet("inbox-labels")) || LABEL_LEGEND.map((l,i)=>({id:"default_"+i, name:l.label, parentId:null, color:l.color}));
  toolState.esim.filing = (await storeGet("inbox-filing")) || {};
  renderEsimBody(body);
}

function esimHandledCount(){
  const e = toolState.esim;
  return EMAIL_SIM_MESSAGES.filter((_,i)=> e.replies[i] || e.archived[i] || e.reported[i]).length;
}
function esimFiledCount(){
  const e = toolState.esim;
  return EMAIL_SIM_MESSAGES.filter((_,i)=> e.filing[i]!=null).length;
}
function esimAllHandled(){
  return esimHandledCount()===EMAIL_SIM_MESSAGES.length && esimFiledCount()===EMAIL_SIM_MESSAGES.length;
}
function esimUnreadCount(){
  const e = toolState.esim;
  return EMAIL_SIM_MESSAGES.filter((_,i)=> e.unread[i]).length;
}

/* ---------- label / folder helpers (operate on toolState.esim.labels/filing) ---------- */
function findLabel(id){ return toolState.esim.labels.find(l=>l.id===id); }
function labelChildren(parentId){ return toolState.esim.labels.filter(l=>l.parentId===parentId); }
function labelChainNames(id){
  const names=[]; let cur=findLabel(id);
  while(cur){ names.push(cur.name); cur = cur.parentId ? findLabel(cur.parentId) : null; }
  return names;
}
function countInFolder(id){ return Object.values(toolState.esim.filing).filter(v=>v===id).length; }
function countUnfiled(){
  return EMAIL_SIM_MESSAGES.length - esimFiledCount();
}
function flattenLabelsForSelect(parentId=null, depth=0, out=[]){
  labelChildren(parentId).forEach(l=>{
    out.push({id:l.id, label:"— ".repeat(depth)+l.name});
    flattenLabelsForSelect(l.id, depth+1, out);
  });
  return out;
}

const SENSITIVE_REPLY_PATTERN = /(password|routing number|account number|ssn|social security|pin\s*(is|:)|\b\d{6,}\b)/i;

function renderEsimBody(body){
  const e = toolState.esim;

  if(e.phase==="failed"){
    const msg = EMAIL_SIM_MESSAGES[e.failReason.index];
    body.innerHTML = `

      <button class="btn btn-ghost" onclick="downloadEmailSimPdf()">⬇ Download Report</button>
    `;
    bumpPracticeProgress("emailsim", 0);
    return;
  }

  if(e.phase==="evaluating"){
    body.innerHTML = `<div class="card" style="padding:40px;text-align:center;color:var(--ink-soft);">Evaluating your filing, replies, and phishing handling…</div>`;
    return;
  }

  if(e.phase==="evaluated"){
    body.innerHTML = `
      <div class="card" style="padding:22px 24px;">
        <div style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:6px;">
          <div><b style="color:var(--navy);font-size:15px;">Filing Accuracy: ${e.filingScore}%</b></div>
          <div><b style="color:var(--navy);font-size:15px;">Security Awareness: ${e.securityScore}%</b></div>
        </div>
        <p style="font-size:12.5px;color:var(--ink-soft);margin:4px 0 16px;">Filing is graded against LSH's baseline categories (a custom sub-label still counts, as long as it's nested under the right one). Security awareness rewards reporting the phishing emails — safely ignoring them without falling for the trap still counts, just not as the strongest response.</p>
        <div class="ai-result"><b>AI-Assessed Evaluation — Writing DNA Match &amp; Professionalism</b><div class="ai-result-body">${esc(e.report).replace(/\n/g,"<br>")}</div></div>
        <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;">
          <button class="btn btn-ghost" onclick="initEmailSim(document.getElementById('toolBody'))">Run It Again</button>
          <button class="btn btn-navy" onclick="downloadEmailSimPdf()">⬇ Download My Work</button>
        </div>
      </div>`;
    return;
  }

  // in_progress
  const handled = esimHandledCount();
  const filed = esimFiledCount();
  body.innerHTML = `
    <p style="font-size:13px;color:var(--ink-soft);margin-bottom:10px;">A real inbox — file every message into a label (drag it, or use the "Move to" menu), and decide whether it needs a reply, an archive, or a phishing report. Nothing is labeled for you. Create your own sub-labels if you want to organize further; the categories below are LSH's baseline convention.</p>
    <div class="esim-progress">${handled} / ${EMAIL_SIM_MESSAGES.length} processed &middot; ${filed} / ${EMAIL_SIM_MESSAGES.length} filed &middot; ${esimUnreadCount()} unread</div>
    <div class="esim-searchbar">
      <span class="esim-search-icon">🔍</span>
      <input type="text" id="esimSearchInput" placeholder="Search mail" value="${esc(e.searchQuery)}" oninput="setEsimSearch(this.value)">
    </div>
    <div class="esim-shell esim-shell-3col">
      <div class="inbox-sidebar" ondragover="event.preventDefault()" ondrop="folderDrop(event, null)">
        <div class="folder-item ${e.selectedFolder===null?'active':''}" onclick="selectFolder(null)">
          <span class="fname">📥 <span>Inbox</span></span>
          <span class="fcount">${countUnfiled()}</span>
        </div>

  const e = toolState.esim;

  return `
    <div>
      <div class="folder-item ${e.selectedFolder===l.id?'active':''}" id="folderRow_${l.id}"
           onclick="selectFolder('${l.id}')"

/* ---------- list ---------- */
function renderEsimListRows(){
  const e = toolState.esim;
  const q = (e.searchQuery||"").toLowerCase();
  const indices = EMAIL_SIM_MESSAGES.map((_,i)=>i).filter(i=>{
    const inFolder = e.selectedFolder===null ? (e.filing[i]==null) : e.filing[i]===e.selectedFolder;
    if(!inFolder) return false;
    if(!q) return true;
    const m = EMAIL_SIM_MESSAGES[i];
    return m.from.toLowerCase().includes(q) || m.subj.toLowerCase().includes(q);
  });
  if(!indices.length) return `<div class="esim-empty">No messages here${q?" matching your search":e.selectedFolder===null?" — nice work filing everything!":". Drag a message here, or use its \"Move to\" menu."}.</div>`;
  return indices.map(i=>renderEsimRow(EMAIL_SIM_MESSAGES[i],i)).join("");

/* ---------- finish / evaluate ---------- */
async function finishEmailSim(){
  if(!esimAllHandled()){
    const h = esimHandledCount(), f = esimFiledCount(), total = EMAIL_SIM_MESSAGES.length;
    toast(`File and process every message first (${f}/${total} filed, ${h}/${total} processed).`);
    return;
  }
  await ensureTraineeName();
  const e = toolState.esim;
  e.phase = "evaluating";
  renderEsimBody(document.getElementById("toolBody"));

  let filingCorrect = 0;
  EMAIL_SIM_MESSAGES.forEach((m,i)=>{
    const chain = e.filing[i] ? labelChainNames(e.filing[i]) : [];
    if(chain.includes(m.correctLabel)) filingCorrect++;
  });
  e.filingScore = Math.round((filingCorrect/EMAIL_SIM_MESSAGES.length)*100);

  const phishingMsgs = EMAIL_SIM_MESSAGES.map((m,i)=>({m,i})).filter(x=>x.m.type==="phishing");
  let secTotal=0;
  phishingMsgs.forEach(({i})=>{ secTotal += e.reported[i] ? 100 : 60; });
  e.securityScore = Math.round(secTotal/phishingMsgs.length);

  const actionableSummary = EMAIL_SIM_MESSAGES.map((m,i)=>{
    if(m.type!=="actionable") return null;
    const reply = e.replies[i];
    return `--- Client Email ---\nFrom: ${m.from}\nSubject: ${m.subj}\nOriginal message:\n${m.body}\n\nTrainee's reply:\n${reply || "(No reply was sent — this client email was archived without a response.)"}`;
  }).filter(Boolean).join("\n\n");

  const phishingSummary = phishingMsgs.map(({m,i})=>{
    const outcome = e.reported[i]
      ? "Correctly reported as phishing; did not click the link or share sensitive info."
      : "Did not fall for it (no link clicked, no sensitive info shared), but did not proactively report it either.";
    return `- "${m.subj}": ${outcome}`;
  }).join("\n");

  const prompt = `You are evaluating a Legal Executive Assistant trainee's performance in an email management exercise for a company called Legal Support Help (LSH).

Evaluate strictly under these two headers, in this order, using short bullet points under each:

1. Writing DNA Match — for each client email below, assess how well the trainee's reply mirrored THAT SPECIFIC client's tone, formatting, and communication style. The clients intentionally differ: one is terse and formal, one is casual and rambling, one is frustrated/upset, one is detailed and itemized. Note where the trainee matched or mismatched the register.
2. Professionalism — grammar, clarity, completeness, and etiquette across their replies. Note if any actionable client email was left without a reply.

Do not evaluate filing or security awareness — those are scored separately and shown elsewhere.

${actionableSummary}

Keep it concise — a handful of bullets per section — and end with one overall takeaway sentence. Be constructive and specific.`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:800, messages:[{role:"user", content:prompt}] })
    });
    if(!response.ok) throw new Error("Request failed: "+response.status);
    const data = await response.json();
    e.report = (data.content||[]).map(b=>b.text||"").join("\n").trim() || "No feedback returned — try again in a moment.";
  }catch(err){
    e.report = "Couldn't reach the AI review service to assess Writing DNA Match and Professionalism — check your connection and try again. (Your Filing Accuracy and Security Awareness scores above were still computed normally.)";
  }
  e.phase = "evaluated";
  const overall = Math.round((e.filingScore + e.securityScore)/2);
  await bumpPracticeProgress("emailsim", overall);
  if(overall===100) burstConfetti();
  renderEsimBody(document.getElementById("toolBody"));
}
window.finishEmailSim = finishEmailSim;

async function downloadEmailSimPdf(){
  await ensureTraineeName();
  const e = toolState.esim;
  const lines = ["## Email Management — Results"];
  if(e.phase==="failed"){
    lines.push(`RESULT: FAILED`, e.failReason.reason, "---");
  }else if(e.phase==="evaluated"){
    lines.push(`Filing Accuracy: ${e.filingScore}%  ·  Security Awareness: ${e.securityScore}%`, "---", "## AI-Assessed Evaluation", e.report, "---");
  }
  lines.push("## Your Filing System");
  labelChildren(null).forEach(l=>{
    lines.push(`${l.name} (${countInFolder(l.id)} filed)`);
    labelChildren(l.id).forEach(k=>lines.push(`   └ ${k.name} (${countInFolder(k.id)} filed)`));
  });
  lines.push("---", "## Message-by-Message");
  EMAIL_SIM_MESSAGES.forEach((m,i)=>{
    const action = e.replies[i] ? "Replied" : e.reported[i] ? "Reported as phishing" : e.archived[i] ? "Archived" : "Not handled";
    const filedId = e.filing[i];
    const yourFiling = filedId ? labelChainNames(filedId).reverse().join(" > ") : "Unfiled";
    lines.push(`${m.subj} (${m.from}) — ${action}  |  Filed: ${yourFiling}  (correct category: ${m.correctLabel})`);
    if(e.replies[i]) lines.push(`   Reply: ${e.replies[i]}`);
  });
  buildAndSavePdf("LSH EA / PA Upskill Program", "Email Management — Results", lines, "LSH_Email_Management");
}

function izCardHtml(e){

function izRenderBoard(){

function izDropInto(ev, q){

  if(q===null) delete toolState.iz.placements[id];
  else toolState.iz.placements[id] = q;
  izRenderBoard();
}

async function izSubmitSort(){
  const { inbox, placements } = toolState.iz;
  const total = inbox.length;
  const sorted = Object.keys(placements).length;
  if(sorted < total){ toast(`Sort all ${total} emails first (${total-sorted} remaining).`); return; }
  let correct = 0;
  inbox.forEach(e=>{ if(placements[e.id]===e.idealQuadrant) correct++; });
  const score = Math.round((correct/total)*100);
  const el = document.getElementById("izSortResult");
  const mismatches = inbox.filter(e=>placements[e.id]!==e.idealQuadrant);
  el.innerHTML = `
    <div class="iz-score-banner">
      <div class="iz-score-num">${score}%</div>
      <div><b>${correct} / ${total} matched expert triage</b><div class="iz-score-note">A mismatch isn't automatically wrong — the point is defensible judgment. Review any surprises below.</div></div>
    </div>
    <div style="margin-top:12px;">

          <div class="iz-preview">You placed: <b>${esc(IZ_QUAD_LABELS[placements[e.id]])}</b> &middot; Expert triage: <b>${esc(IZ_QUAD_LABELS[e.idealQuadrant])}</b></div>

  await bumpPracticeProgress("emailsim", score);
  if(score===100) burstConfetti();

  btn.disabled = true; btn.textContent = "Reviewing…";
  const resultEl = document.getElementById("c9ReviewResult");
  resultEl.innerHTML = `<div class="ai-loading">Evaluating your response for professionalism and de-escalation…</div>`;
  const prompt = `You are reviewing a Legal Executive Assistant trainee's draft public response to a negative online review for a law firm called Legal Support Help (LSH).

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:500, messages:[{role:"user", content:prompt}] })

    const data = await response.json();
    const feedback = (data.content||[]).map(b=>b.text||"").join("\n").trim() || "No feedback returned.";

async function checkS10Rates(){

    const trueRate = (p.likes+p.comments+p.shares)/p.followers*100;
    const yourRate = Number(document.getElementById(`s10rate${i}`).value);
    const ok = Math.abs(yourRate-trueRate) <= 0.2;
    if(ok) correct++;
    return {label:p.label, trueRate:trueRate.toFixed(1), ok};
  });
  const trueBest = details.reduce((a,b)=>parseFloat(b.trueRate)>parseFloat(a.trueRate)?b:a).label;
  const bestOk = toolState.s10.bestPick===trueBest;
  const score = Math.round(((correct + (bestOk?1:0)) / (SOCIAL_POSTS.length+1))*100);
  document.getElementById("s10RateResult").innerHTML = `
    <b style="color:${score===100?'var(--success)':'var(--danger)'};">${correct}/${SOCIAL_POSTS.length} rates correct, best-performer pick ${bestOk?"✅":"❌"} (${score}%)</b>

function recalcS10Campaign(){
  const spend = Number(document.getElementById("s10Spend").value)||0;
  const leads = Number(document.getElementById("s10Leads").value)||0;
  const price = Number(document.getElementById("s10Price").value)||0;
  const cpl = leads ? spend/leads : 0;
  const revenue = leads*price;
  const roi = spend ? ((revenue-spend)/spend)*100 : 0;
  document.getElementById("s10Cpl").textContent = "$"+cpl.toLocaleString(undefined,{maximumFractionDigits:2});
  document.getElementById("s10Rev").textContent = "$"+revenue.toLocaleString(undefined,{maximumFractionDigits:2});
  document.getElementById("s10Roi").textContent = roi.toLocaleString(undefined,{maximumFractionDigits:1})+"%";
}

/* ---------- coverage-based scoring for free text ---------- */
function coverageScore(facts, sectionNames, getTextForSection){
  let totalFacts=0, covered=0;
  const bySection = {};
  sectionNames.forEach(sec=>{
    const sectionFacts = facts.filter(f=>f.section===sec);
    const text = (getTextForSection(sec)||"").toLowerCase();
    let sectionCovered = 0;
    sectionFacts.forEach(f=>{
      const hit = f.keywords.some(k=>text.includes(k));
      if(hit) sectionCovered++;
    });
    bySection[sec] = {covered:sectionCovered, total:sectionFacts.length};
    totalFacts += sectionFacts.length;
    covered += sectionCovered;
  });
  return {score: totalFacts?Math.round((covered/totalFacts)*100):0, covered, totalFacts, bySection};
}

/* ---------- reusable drag-and-drop matching board ---------- */
function renderMatchBoard(prefix, cardTexts, zoneLabels){
  return `
    <div class="match-board" id="${prefix}Board">
      <div class="match-tray" id="${prefix}Tray" ondragover="event.preventDefault()" ondrop="matchDrop(event,'${prefix}',null)">
        <div class="match-tray-label">Unsorted</div>
        ${cardTexts.map((t,i)=>renderMatchCard(prefix,i,t)).join("")}
      </div>
      <div class="match-zones">
        ${zoneLabels.map(z=>`
          <div class="match-zone" id="${prefix}Zone-${cssId(z)}" ondragover="event.preventDefault(); this.classList.add('zone-hover')" ondragleave="this.classList.remove('zone-hover')" ondrop="matchDrop(event,'${prefix}',${JSON.stringify(z)})">
            <div class="match-zone-label">${esc(z)}</div>
            <div class="match-zone-body"></div>
          </div>`).join("")}
      </div>
    </div>`;
}
function cssId(s){ return s.replace(/[^a-z0-9]/gi,"").toLowerCase(); }
function renderMatchCard(prefix,i,text){
  return `<div class="match-card" id="${prefix}Card-${i}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${i}')">${esc(text)}</div>`;
}
function matchDrop(ev, prefix, zone){
  ev.preventDefault();
  const i = Number(ev.dataTransfer.getData("text/plain"));
  const card = document.getElementById(`${prefix}Card-${i}`);
  if(!card) return;
  const store = prefix==="i5cat" ? toolState.i5.category : toolState.i5.strategy;
  if(zone===null){
    document.getElementById(`${prefix}Tray`).appendChild(card);
    delete store[i];
  }else{
    const zoneBody = document.querySelector(`#${prefix}Zone-${cssId(zone)} .match-zone-body`);
    zoneBody.appendChild(card);
    store[i] = zone;
    document.querySelectorAll(`.match-zone`).forEach(z=>z.classList.remove("zone-hover"));
    // satisfying "snap" pulse on the card that just landed
    card.classList.remove("card-snap"); void card.offsetWidth; card.classList.add("card-snap");
  }
}
window.matchDrop = matchDrop;

window.checkC6Kpi = checkC6Kpi;

async function checkC6Recovery(btn){
  const text = document.getElementById("c6RecoveryReply").value.trim();
  if(text.length<15){ toast("Write a fuller message first."); return; }
  btn.disabled = true; btn.textContent = "Reviewing…";
  const resultEl = document.getElementById("c6RecoveryResult");
  resultEl.innerHTML = `<div class="ai-loading">Evaluating your recovery plan…</div>`;
  const prompt = `You are reviewing a Legal Executive Assistant trainee's draft message to their principal, Elias Thorne (Managing Owner & CEO of Thorne & Partners Law Group), about a project that has fallen behind schedule.

Scenario: ${TRIAL_RECOVERY_SCENARIO.text}

The trainee's draft message: "${text}"

Evaluate against the standard taught: identify the root cause of the delay before reassigning blame, give a structured and specific plan (not vague reassurance), and match Elias's known preference for BLUF (bottom-line-up-front) communication — the key point and required action should be immediately clear, with detail available but not front-loaded. Give 3-4 short bullet points of feedback and one overall verdict sentence.`;
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:500, messages:[{role:"user", content:prompt}] })
    });
    if(!response.ok) throw new Error("Request failed");
    const data = await response.json();
    const feedback = (data.content||[]).map(b=>b.text||"").join("\n").trim() || "No feedback returned.";
    toolState.c6.recoveryReport = feedback;
    resultEl.innerHTML = `<div class="ai-result"><b>AI Feedback</b><div class="ai-result-body">${esc(feedback).replace(/\n/g,"<br>")}</div></div>`;
    await bumpPracticeProgress("projectcompliance6", 100);
    burstConfetti();
  }catch(e){
    toolState.c6.recoveryReport = "Couldn't reach the AI review service.";
    resultEl.innerHTML = `<div class="ai-result ai-error"><b>Couldn't get feedback</b><div class="ai-result-body">Check your connection and try again.</div></div>`;
  }finally{
    btn.disabled = false; btn.textContent = "Get AI Feedback";
  }
}
window.checkC6Recovery = checkC6Recovery;

async function downloadProjectCompliance6Pdf(){
  await ensureTraineeName();
  const c6 = toolState.c6;
  const lines = ["## A. Multi-Jurisdiction License Check"];
  FIRM_LICENSES.forEach((l,i)=>{
    lines.push(`${l.name} (expires ${l.expires}) — your call: ${c6.license[i]||"(not answered)"} (correct: ${l.status})`);
  });
  lines.push("---", "## B. KPI Dashboard Review");
  FIRM_KPIS.forEach((k,i)=>{
    lines.push(`${k.category} — ${k.kpi}: target ${k.target}, actual ${k.actual} — your call: ${c6.kpi[i]||"(not answered)"} (correct: ${k.correctStatus})`);
  });
  lines.push("---", "## C. Trial Team Project Recovery", `Scenario: ${TRIAL_RECOVERY_SCENARIO.text}`, `Your message: ${document.getElementById("c6RecoveryReply").value.trim()||"(not written)"}`);
  if(c6.recoveryReport) lines.push("", "AI Feedback:", c6.recoveryReport);
  buildAndSavePdf("LSH EA / PA Upskill Program", "Business Compliance & Project Recovery — Results", lines, "LSH_Project_Compliance");
}
window.downloadProjectCompliance6Pdf = downloadProjectCompliance6Pdf;
