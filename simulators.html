<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulators — LSH Training Portal</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/simulators/sim.css">
<style>
    .hub-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 1000px) { .hub-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 620px) { .hub-grid { grid-template-columns: 1fr; } }
    .hub-card { display: flex; flex-direction: column; gap: 10px; }
    .hub-card .icon { width: 48px; height: 48px; border-radius: 14px; background: #fff7ed; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .hub-card h3 { margin: 0; font-size: 17px; font-weight: 800; }
    .hub-card p { margin: 0; font-size: 13.5px; color: var(--slate); line-height: 1.55; flex: 1; }
    .hub-card .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; }
    .hub-card .uses { font-size: 11.5px; color: var(--slate); font-weight: 700; }
    .hub-card.soon { background: #fbfaf7; }
    .hub-sec { margin: 34px 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .hub-sec h2 { margin: 0; font-size: 20px; font-weight: 800; }
    .hub-links { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 10px; }
    .hub-links .sim-btn { text-align: left; text-decoration: none; justify-content: flex-start; }

    /* ===== The Simulators page design: dark navy, "SIMULATORS" down the left, white cards with gradient borders ===== */
    body { background: var(--navy); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .hub-rings { position: fixed; right: -260px; bottom: -260px; width: 560px; height: 560px; pointer-events: none; z-index: 0; }
    .hub-layout { position: relative; z-index: 1; display: grid; grid-template-columns: 92px 1fr; min-height: calc(100vh - 70px); }
    .hub-side { background: rgba(255,255,255,.08); display: flex; justify-content: center; padding: 30px 0; }
    .hub-vtitle { writing-mode: vertical-rl; text-orientation: upright; font-size: 46px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; line-height: 1;
        color: transparent; -webkit-text-stroke: 1.5px rgba(255,255,255,.9); position: sticky; top: 90px; align-self: flex-start; }
    @media (max-width: 760px) { .hub-layout { grid-template-columns: 1fr; } .hub-side { padding: 18px 0 0; background: none; } .hub-vtitle { writing-mode: horizontal-tb; font-size: 30px; letter-spacing: .1em; position: static; } }
    .hub-grid { grid-template-columns: repeat(2, 1fr); gap: 22px 26px; }
    @media (max-width: 900px) { .hub-grid { grid-template-columns: 1fr; } }
    .hub-card { position: relative; border: 4px solid transparent; border-radius: 16px; box-shadow: 0 12px 26px -16px rgba(0,0,0,.6);
        background: linear-gradient(#fff, #fff) padding-box, linear-gradient(120deg, #22d3ee, #fde047) border-box; }
    .hub-card:nth-child(4n+1), .hub-card:nth-child(4n) { background: linear-gradient(#fff, #fff) padding-box, linear-gradient(120deg, #f472b6, #fde047) border-box; }
    .hub-card.soon { background: linear-gradient(#f8fafc, #f8fafc) padding-box, linear-gradient(120deg, #cbd5e1, #e2e8f0) border-box; }
    .hub-card > .sim-chip { position: absolute; top: 12px; right: 12px; }
    .hub-head { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 70px; }
    .hub-card .icon { width: auto; height: auto; background: none; font-size: 30px; border-radius: 0; }
    .hub-card h3 { padding: 3px 14px; border: 2.5px solid var(--navy); color: var(--orange); font-size: 16px; font-weight: 900; letter-spacing: .03em; text-transform: uppercase; text-align: center; }
    .hub-card p { color: #1e293b; font-weight: 500; font-size: 13px; }
    .hub-go { background: var(--navy) !important; color: var(--orange) !important; border-color: var(--navy) !important; border-radius: 999px !important; font-weight: 900 !important; letter-spacing: .08em; text-transform: uppercase; padding: 8px 18px !important; }
    .hub-sec h2 { color: #fff; }
    .hub-sec .sim-muted { color: rgba(255,255,255,.6); }
    @media (max-width: 560px) { .hub-head { padding: 22px 0 0; flex-wrap: wrap; } }
</style>
</head>
<body>
<div id="topbar"></div>
<svg class="hub-rings" viewBox="0 0 600 600" fill="none" aria-hidden="true"><circle cx="300" cy="300" r="280" stroke="#f97316" stroke-opacity=".3" stroke-width="10"/><circle cx="300" cy="300" r="200" stroke="#fb923c" stroke-opacity=".16" stroke-width="2"/></svg>
<div class="hub-layout">
<aside class="hub-side" aria-hidden="true"><span class="hub-vtitle">Simulators</span></aside>
<div class="sim-wrap">
    <section class="sim-hero sr-only">
        <div class="eyebrow">Shared across every program</div>
        <h1>Simulators</h1>
        <p>Hands-on tools every LSH program can use — Case Management, EA/PA and the specialised trainings. Pick a simulator, work a realistic scenario, and get a scored debrief. Your results are saved to your account.</p>
    </section>

    <div class="hub-grid" id="hub-grid"></div>

    <div class="hub-sec"><h2 id="results-title">My recent results</h2><span class="sim-muted" style="font-size:12.5px;" id="results-note"></span></div>
    <div class="sim-card" id="results"><div class="sim-loading">Loading results…</div></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="/app.js"></script>
<script src="/portal-nav.js"></script>
<script src="/portal.js"></script>
<script src="/simulators/sim.js"></script>
<script>
    const SIMULATORS = [
        { id: 'call', icon: '📞', title: 'Call Simulator', status: 'live', href: '/api/launch?tool=cms&to=calls', links: [['☎ On a real phone line: 🤖 AI caller in LSH Ring Channel', '/api/launch?tool=ringchannel&to=aicall']], uses: 'Standard · CM · PD · EA/PA · all programs',
          desc: 'Real phone calls, in the CMS (it opens there, already signed in): it rings, the caller speaks, you answer out loud or type, then get a scored debrief. Every program\'s lines, each with Practice and Graded calls: Standard Training\'s Reception, Calendar Management and Intake Mock Calls on the Training Library files; Case Management (the John Doe file); Property Damage (the Angela Carter claim); EA / PA (Elias Thorne: executive, gatekeeping, legal operations, lifestyle, intake and outreach calls). Graded calls count in your course.' },
        { id: 'ringchannel', icon: '☎', title: 'LSH Ring Channel', status: 'live', href: '/api/launch?tool=ringchannel', uses: 'Standard · trainer-led and 🤖 AI mock calls',
          links: [['🤖 Take an AI call (the AI plays the caller)', '/api/launch?tool=ringchannel&to=aicall'], ['🎛 Trainers: send AI callers to trainees', '/api/launch?tool=ringchannel&to=console']],
          desc: 'Live mock calls with your trainer over a real training phone (VOIP, in the browser). Your trainer dials your desk extension and plays the caller; you answer, use Hold, Transfer and the case files, and take the message, calendar or intake note. Every call is recorded (you can play it back) and graded on the Reception, Calendar Management or Intake Mock Calls Metrics, with your trainer\'s review. Practice calls with an AI caller too. It opens already signed in; use a headset.' },
        { id: 'calsim', icon: '📆', title: 'Calendaring Simulators', status: 'live', href: '/simulators/calsim.html', uses: 'Foundational · CM · EA/PA',
          links: [['🎓 Standard Training: Google Calendar Simulator', '/simulators/calsim.html?track=standard'], ['⚖️ Litigation Week · Case Management', '/simulators/calsim.html?track=cm'], ['🏢 Executive Week · EA / PA', '/simulators/calsim.html?track=ea'], ['🗓 Conflicts week', '/simulators/calendar.html']],
          desc: 'All the calendaring practice in one place: the Google Calendar Simulator for each program. 🎓 Standard Training (Foundational · Calendar Management), ⚖️ Litigation Week (Case Management) and 🏢 Executive Week (EA / PA). Callers ask for appointments: book them on the attorney\'s (or executive\'s) calendar under the rules, with the right title, description, Google Meet for video calls and an email reminder a day before, move or cancel what they ask, then check your calendar. Scores are saved for your trainer.' },
        { id: 'chat', icon: '💬', title: 'Chat Simulator', status: 'next', uses: 'All programs',
          desc: 'Written client and team conversations (portal chat, SMS, Teams-style) with tone, accuracy and confidentiality graded. Coming next.' },
        { id: 'docket', icon: '⚖️', title: 'Docket System', status: 'live', href: '/simulators/docket.html', uses: 'CM · Litigation · all programs',
          desc: 'Law-firm docketing. Court notices and mail arrive in an inbox: put what belongs on the court docket there and calendar every deadline it triggers, counted under federal (FRCP 6) or state rules, with a responsible attorney and reminders. Federal-style docket reports for every case, a firm calendar and a rules-based deadline calculator.' },
        { id: 'records', icon: '🗂', title: 'Medical Records Requests', status: 'live', href: '/simulators/records.html', uses: 'CM · Medsum and Demand',
          desc: 'A medical records request platform on the John Doe file. Check the HIPAA authorization, request records and itemized bills from the right departments for the right dates, and move the calendar forward. Handle what comes back: rejections, invoices over the fee cap, silence, partial ledgers and providers hiding in the records. Scored against the attorney\'s objectives.' },
        { id: 'efiling', icon: '🏛', title: 'Court E-Filing', status: 'live', href: '/simulators/efiling.html', uses: 'CM · Litigation',
          desc: 'File like US courts require: a federal filing through electronic case filing (event, case, filer, linked entry, attachments, docket text) and state filings through an e-filing provider (filing code, parties, service contacts, fees). Fix the documents first: OCR, signatures, certificates of service, redaction, size limits, passwords. Then submit and see if the clerk accepts it.' },
        { id: 'email', icon: '✉️', title: 'Email Simulators', status: 'live', href: '/simulators/email.html', uses: 'All programs · CM',
          desc: 'All the email practice in one place: the ✉️ Email Workspace, a Gmail-style practice inbox (a ready-made CM or EA/PA inbox, or one for any program) to triage, label, reply, forward and report phishing, and ✍️ Email Replies, one email at a time answered like at work (an upset client, an adjuster, a lien letter, your attorney, a phishing attempt), here or from your own inbox. Scored on filing, security, triage and writing, with a model reply.' }
    ];
    const CHIP = { live: ['live', 'Live'], next: ['next', 'Coming next'], plan: ['plan', 'Planned'], input: ['input', 'Needs input'] };

    function renderHub() {
        document.getElementById('topbar').innerHTML = Sim.topbar('hub');
        Sim.label('Simulators');
        document.getElementById('hub-grid').innerHTML = SIMULATORS.map(s => `
            <div class="sim-card hub-card ${s.status === 'live' ? '' : 'soon'}">
                <span class="sim-chip ${CHIP[s.status][0]}">${CHIP[s.status][1]}</span>
                <div class="hub-head"><span class="icon">${s.icon}</span><h3>${Sim.esc(s.title)}</h3></div>
                <p>${Sim.esc(s.desc)}</p>
                ${s.links ? `<div class="hub-links">${(s.id === 'calsim' ? s.links.concat([Sim.isAdmin() ? ['🖥 Trainee Evaluations (trainer review and feedback)', '/simulators/gcal-review.html'] : ['📋 My Evaluations: my calendars and my reports', '/simulators/my-evaluations.html']]) : s.links).map(l => `<a class="sim-btn ghost" href="${l[1]}">${Sim.esc(l[0])}</a>`).join('')}</div>` : ''}
                <div class="row"><span class="uses">${Sim.esc(s.uses)}</span>
                    ${s.href ? `<a class="sim-btn primary hub-go" href="${s.href}">Explore</a>` : `<button class="sim-btn ghost hub-go" disabled>Not yet</button>`}</div>
            </div>`).join('');
    }

    async function renderResults() {
        const el = document.getElementById('results');
        try {
            const data = await Sim.results();
            if (data.admin) {
                document.getElementById('results-title').textContent = 'Recent results — all trainees';
                document.getElementById('results-note').textContent = 'Admin view · latest 200';
            }
            else {
                const w = Sim.who();
                document.getElementById('results-note').textContent = w.name
                    ? `Saved in this browser. Your trainer also sees results saved as ${w.name}${w.batch ? ' · ' + w.batch : ''}.`
                    : 'Saved in this browser only. Add your name (top right) so your trainer can see your results.';
            }
            const rows = data.results || [];
            el.innerHTML = rows.length ? `<div class="sim-table-wrap"><table class="sim-table"><thead><tr>${data.admin ? '<th>Trainee</th>' : ''}<th>Simulator</th><th>Scenario</th><th>Score</th><th>Summary</th><th>When</th></tr></thead><tbody>
                ${rows.map(r => `<tr>${data.admin ? `<td><b>${Sim.esc(r.full_name || r.username)}</b></td>` : ''}<td>${Sim.esc(r.simulator)}</td><td>${Sim.esc(r.scenario || '')}</td><td>${Sim.scoreChip(r.score)}</td><td class="sim-muted">${Sim.esc(r.summary || '')}</td><td class="sim-muted" style="white-space:nowrap;">${Sim.esc(Sim.fmtDate(r.created_at))}</td></tr>`).join('')}
                </tbody></table></div>` : `<div class="sim-muted" style="font-size:13.5px;">No simulator results yet — open one above to get started.</div>`;
        } catch (e) {
            el.innerHTML = `<div class="sim-error">${Sim.esc(e.message)}</div>`;
        }
    }

    // A new tab has the signed cookie but no copy of who in its own storage: ask first, so an admin gets the admin hub and results, and the heartbeat runs.
    document.addEventListener('DOMContentLoaded', async () => { await Sim.restore(); renderHub(); renderResults(); });
</script>
</body>
</html>
