<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CM Training Interface — Trainee Portal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
  :root{
    --bg-dark:#1E2E4D;
    --bg-card-dark:#28395A;
    --bg-card-dark-hover:#324567;
    --navy-header:#2C3F63;
    --orange:#E8792E;
    --orange-dark:#C4611F;
    --peach:#FBE4D2;
    --white:#FFFFFF;
    --ink:#1B2130;
    --muted:#8A93A6;
    --muted-dark:#5B6478;
    --input-bg:#F5F6F8;
    --green:#1FB37B;
    --green-dark:#17945F;
    --red:#D64545;
    --line:#324361;
    --line-light:#E4E7ED;
    --r-lg:16px;
    --r-md:12px;
    --r-sm:9px;
    --r-xs:7px;
    --shadow-sm:0 1px 2px rgba(20,28,45,0.06);
    --shadow-md:0 6px 20px rgba(20,28,45,0.08);
    --shadow-lg:0 14px 34px rgba(20,28,45,0.14);
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    background:#EEF1F5;
    color:var(--ink);
    font-family:Arial, Helvetica, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  input,select,textarea,button{ font-family:Arial, Helvetica, sans-serif; }
  ::selection{background:var(--orange); color:#fff;}
  a,button,input,select,textarea,.nav-item,.pill,.status-badge{ transition:background 0.16s ease, border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease; }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:rgba(138,147,166,0.35); border-radius:20px; }
  ::-webkit-scrollbar-thumb:hover{ background:rgba(138,147,166,0.55); }

  .app{ display:flex; min-height:100vh; }

  /* ================= SIDEBAR ================= */
  .sidebar{
    width:290px;
    flex-shrink:0;
    background:var(--bg-dark);
    color:#fff;
    padding:24px 20px 20px 20px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .logo-row{ display:flex; align-items:center; gap:12px; }
  .logo-box{
    width:50px; height:50px; background:var(--orange); border-radius:var(--r-sm);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:19px; color:#fff;
    letter-spacing:0.5px; flex-shrink:0; box-shadow:var(--shadow-sm);
  }
  .logo-text .l1{ font-weight:700; font-size:14.5px; letter-spacing:0.3px; line-height:1.3; }
  .logo-text .l2{ font-weight:700; font-size:10px; letter-spacing:1.5px; color:var(--orange); margin-top:1px; }

  .field-label{ font-size:10px; letter-spacing:1.3px; color:var(--muted); margin-bottom:6px; }
  .side-input{
    width:100%; padding:10px 12px; background:var(--bg-card-dark);
    border:1px solid var(--line); color:#fff; font-size:12.5px; border-radius:var(--r-xs);
  }
  .side-input:focus{ outline:none; border-color:var(--orange); box-shadow:0 0 0 3px rgba(232,121,46,0.18); }
  .side-input::placeholder{ color:var(--muted-dark); }
  .roletoggle{ display:flex; background:var(--bg-card-dark); border:1px solid var(--line); border-radius:var(--r-xs); overflow:hidden; padding:3px; gap:3px; }
  .roletoggle button{
    flex:1; border:none; background:transparent; color:var(--muted); border-radius:6px;
    font-size:11px; letter-spacing:0.8px; padding:8px 6px; cursor:pointer; font-weight:600;
  }
  .roletoggle button.active{ background:var(--orange); color:#fff; font-weight:700; box-shadow:var(--shadow-sm); }

  .nav-label{ font-size:10px; letter-spacing:1.8px; color:var(--muted); margin:6px 0 2px 0; }
  .nav-list{ display:flex; flex-direction:column; gap:8px; overflow-y:auto; }
  .nav-item{
    background:var(--bg-card-dark); border:1px solid var(--line); border-radius:var(--r-sm);
    padding:11px 13px; cursor:pointer; position:relative;
  }
  .nav-item:hover{ background:var(--bg-card-dark-hover); transform:translateY(-1px); box-shadow:var(--shadow-sm); }
  .nav-item.active{ background:var(--bg-card-dark-hover); border-color:var(--orange); box-shadow:0 0 0 1px var(--orange); }
  .nav-item.locked{ opacity:0.45; cursor:not-allowed; }
  .nav-item.locked:hover{ transform:none; box-shadow:none; }
  .nav-item .title-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .nav-item .name{ font-weight:700; font-size:12.5px; letter-spacing:0.2px; }
  .nav-item .sub{ font-size:10.5px; color:var(--muted); margin-top:4px; }
  .pill{
    font-size:9px; letter-spacing:0.8px; padding:3px 8px; border-radius:20px; border:1px solid var(--orange);
    color:var(--orange); white-space:nowrap;
  }
  .pill.gray{ border-color:var(--muted-dark); color:var(--muted); }
  .pill.green{ border-color:var(--green); color:var(--green); }

  .sidebar-spacer{ flex:1; }
  .btn-full{
    width:100%; padding:12px; border:none; font-size:12px; letter-spacing:0.8px; font-weight:700;
    cursor:pointer; border-radius:var(--r-xs);
  }
  .btn-green{ background:var(--green); color:#fff; box-shadow:var(--shadow-sm); }
  .btn-green:hover{ background:var(--green-dark); transform:translateY(-1px); box-shadow:var(--shadow-md); }
  .btn-outline-red{ background:transparent; border:1px solid var(--red); color:var(--red); }
  .btn-outline-red:hover{ background:rgba(214,69,69,0.12); }
  .signed-in{ font-size:10.5px; color:var(--muted); text-align:center; line-height:1.6; }
  .signed-in b{ color:#fff; }

  /* ================= TOPBAR ================= */
  .topbar{
    background:var(--bg-dark); color:#fff; padding:12px 26px;
    display:flex; align-items:center; gap:20px; border-bottom:1px solid var(--line);
    font-size:11px; letter-spacing:0.3px; flex-wrap:wrap;
  }
  .topbar .badge{ background:var(--orange); color:#fff; font-weight:700; padding:4px 10px; letter-spacing:0.8px; border-radius:6px; }
  .topbar .portal-title{ font-weight:700; letter-spacing:0.6px; }
  .topbar .announce{ color:var(--orange); font-weight:700; }
  .topbar .announce-text{ color:#cfd4e0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; max-width:360px; }
  .topbar .spacer{ flex:1; }
  .topbar .clock{ color:#cfd4e0; }
  .topbar select.loc{
    background:var(--bg-card-dark); color:#fff; border:1px solid var(--line); padding:7px 12px; font-size:11px; border-radius:var(--r-xs); cursor:pointer;
  }

  /* ================= MAIN ================= */
  .main{ flex:1; padding:28px; min-width:0; }
  .card{
    background:var(--white); border:1px solid var(--line-light); border-radius:var(--r-lg);
    padding:26px 30px; margin-bottom:20px; box-shadow:var(--shadow-md);
  }
  .card-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap; }
  .card-head h1{
    font-family:Arial, Helvetica, sans-serif; font-style:normal; font-weight:700; font-size:24px;
    color:var(--navy-header); margin:0 0 6px 0; letter-spacing:0.2px;
  }
  .card-head .intro{ color:var(--muted-dark); font-size:12px; max-width:560px; line-height:1.65; }
  .stamp{
    font-family:Arial, Helvetica, sans-serif; font-style:normal; font-weight:700; font-size:12px; letter-spacing:1.5px;
    color:var(--orange); background:rgba(232,121,46,0.1); border-radius:20px; padding:6px 14px;
    text-align:right; display:inline-block;
  }
  .meta-mini{ font-size:10px; color:var(--muted-dark); letter-spacing:1px; text-align:right; margin-top:8px;}

  .stat-bar{
    background:var(--bg-dark); border-radius:var(--r-md); margin-top:18px; padding:16px 20px;
    display:flex; gap:34px; flex-wrap:wrap; align-items:center; color:#fff;
  }
  .stat{ }
  .stat .lbl{ font-size:9.5px; letter-spacing:1.3px; color:var(--muted); margin-bottom:5px; }
  .stat .val{ font-size:15px; font-weight:700; }
  .stat-bar .grow{ flex:1; }
  .role-chip{
    background:rgba(232,121,46,0.15); border:1px solid var(--orange); color:var(--orange); border-radius:20px;
    padding:6px 14px; font-size:11px; letter-spacing:0.6px; font-weight:700;
  }

  .search-row{ margin-top:18px; }
  .search-row input{
    width:100%; padding:11px 14px; background:var(--input-bg); border:1px solid var(--line-light); font-size:12.5px; color:var(--ink);
    border-radius:var(--r-xs);
  }
  .search-row input:focus{ outline:none; border-color:var(--orange); box-shadow:0 0 0 3px rgba(232,121,46,0.12); background:#fff; }
  .search-row input::placeholder{ color:var(--muted-dark); }

  .empty-note{ color:var(--muted-dark); font-size:12px; }

  /* ---------- data card (IDENTITY-style) ---------- */
  .dcard{ border:1px solid var(--line-light); border-radius:var(--r-lg); margin-top:16px; background:#fff; overflow:hidden; box-shadow:var(--shadow-sm); }
  .dcard.alt .dhead{ background:var(--peach); color:var(--orange-dark); }
  .dhead{
    background:var(--navy-header); color:#fff; font-size:11.5px; font-weight:700;
    letter-spacing:1px; padding:12px 18px;
  }
  .dbody{ padding:20px; }
  .dbody .prompt{ font-size:12.5px; line-height:1.7; color:var(--ink); margin-bottom:14px; }
  .dbody textarea{
    width:100%; min-height:100px; padding:12px; background:var(--input-bg); border:1px solid var(--line-light);
    font-size:12.5px; color:var(--ink); resize:vertical; border-radius:var(--r-xs);
  }
  .dbody textarea:focus{ outline:none; border-color:var(--orange); box-shadow:0 0 0 3px rgba(232,121,46,0.12); background:#fff; }
  .dbody textarea:disabled{ background:#EEEFF2; color:#666; }
  .dbody textarea::placeholder{ color:var(--muted-dark); }

  .row-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; flex-wrap:wrap; gap:10px;}
  .status-badge{ font-size:10px; letter-spacing:0.8px; padding:6px 12px; border:1px solid transparent; border-radius:20px; font-weight:600; }
  .status-empty{ background:var(--input-bg); color:var(--muted-dark); border-color:var(--line-light); }
  .status-pending{ background:var(--peach); color:var(--orange-dark); border-color:var(--orange); }
  .status-graded{ background:var(--navy-header); color:#fff; border-color:var(--navy-header); }

  .model-answer{
    background:var(--input-bg); border-left:3px solid var(--orange); border-radius:0 var(--r-xs) var(--r-xs) 0; padding:12px 14px; font-size:11.5px;
    color:var(--ink); margin-top:10px; display:none; line-height:1.65;
  }
  .model-answer.show{ display:block; }
  .toggle-model{ font-size:10.5px; color:var(--orange-dark); cursor:pointer; font-weight:600; }
  .toggle-model:hover{ color:var(--orange); }

  .grade-row{ margin-top:14px; border-top:1px solid var(--line-light); padding-top:14px; display:flex; gap:14px; flex-wrap:wrap; align-items:center;}
  .grade-inputs{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .grade-inputs label{ font-size:10px; color:var(--muted-dark); letter-spacing:0.8px; }
  .grade-inputs input[type=number]{ width:58px; padding:8px; border:1px solid var(--line-light); background:var(--input-bg); font-size:12px; border-radius:var(--r-xs); }
  .grade-inputs input[type=text]{ flex:1; min-width:220px; padding:8px 10px; border:1px solid var(--line-light); background:var(--input-bg); font-size:12px; border-radius:var(--r-xs); }
  .grade-inputs input:focus{ outline:none; border-color:var(--orange); box-shadow:0 0 0 3px rgba(232,121,46,0.12); background:#fff; }

  select.day-select{ padding:10px 12px; border:1px solid var(--line-light); background:var(--input-bg); font-size:12px; border-radius:var(--r-xs); cursor:pointer; }

  button.btn{
    font-size:11.5px; letter-spacing:0.6px; padding:11px 22px; border:none; cursor:pointer; font-weight:700;
    border-radius:var(--r-xs);
  }
  button.btn.orange{ background:var(--orange); color:#fff; box-shadow:var(--shadow-sm); }
  button.btn.orange:hover{ background:var(--orange-dark); transform:translateY(-1px); box-shadow:var(--shadow-md); }
  button.btn.ghost{ background:transparent; border:1px solid var(--line-light); color:var(--navy-header); }
  button.btn.ghost:hover{ background:var(--input-bg); }
  button.btn:disabled{ opacity:0.45; cursor:not-allowed; transform:none; box-shadow:none; }

  /* ---------- leaderboard ---------- */
  table.leader{ width:100%; border-collapse:collapse; margin-top:6px; }
  table.leader th{
    text-align:left; font-size:10px; letter-spacing:1.2px; color:var(--muted-dark);
    padding:10px; border-bottom:2px solid var(--line-light);
  }
  table.leader td{ padding:14px 10px; border-bottom:1px solid var(--line-light); font-size:12.5px; }
  table.leader tr:hover td{ background:#FAFBFC; }
  .rank{ font-weight:700; color:var(--navy-header); }
  .rank.gold{ color:var(--orange); }
  .score-total{ font-weight:700; color:var(--orange-dark); }

  .locked-panel{ text-align:center; padding:60px 20px; color:var(--muted-dark); }
  .locked-panel .lock-stamp{
    font-weight:700; letter-spacing:1.5px; border:1px solid var(--orange); border-radius:20px;
    color:var(--orange); background:rgba(232,121,46,0.08); display:inline-block; padding:8px 20px; margin-bottom:14px;
  }

  /* ---------- subtabs (admin: manage vs grade) ---------- */
  .subtabs{ display:flex; gap:6px; margin-top:18px; }
  .subtab{
    padding:9px 16px; font-size:11px; letter-spacing:0.8px; font-weight:700; color:var(--muted-dark);
    background:var(--input-bg); border:1px solid var(--line-light); border-radius:var(--r-xs); cursor:pointer;
  }
  .subtab.active{ background:var(--navy-header); color:#fff; border-color:var(--navy-header); }

  /* ---------- activity builder form ---------- */
  .form-field{ margin-bottom:14px; }
  .form-field label{ display:block; font-size:10px; letter-spacing:1px; color:var(--muted-dark); margin-bottom:6px; font-weight:600; }
  .form-field input[type=text], .form-field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line-light); background:var(--input-bg);
    font-size:12.5px; color:var(--ink); border-radius:var(--r-xs); font-family:inherit;
  }
  .form-field textarea{ min-height:80px; resize:vertical; }
  .form-field input:focus, .form-field textarea:focus{
    outline:none; border-color:var(--orange); box-shadow:0 0 0 3px rgba(232,121,46,0.12); background:#fff;
  }
  .form-row{ display:flex; gap:14px; flex-wrap:wrap; }
  .form-row > .form-field{ flex:1; min-width:220px; }

  .item-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap:14px;
    padding:14px 16px; border:1px solid var(--line-light); border-radius:var(--r-sm); margin-top:10px; background:#fff;
  }
  .item-row .item-num{ font-size:10px; color:var(--orange); font-weight:700; letter-spacing:1px; margin-bottom:4px; }
  .item-row .item-title{ font-weight:700; font-size:13px; color:var(--ink); }
  .item-row .item-preview{ font-size:11.5px; color:var(--muted-dark); margin-top:4px; line-height:1.5; }
  .item-actions{ display:flex; gap:8px; flex-shrink:0; }
  .icon-btn{
    padding:7px 12px; font-size:10.5px; font-weight:700; letter-spacing:0.5px; border-radius:var(--r-xs);
    border:1px solid var(--line-light); background:var(--input-bg); color:var(--navy-header); cursor:pointer;
  }
  .icon-btn:hover{ background:#fff; }
  .icon-btn.danger{ color:var(--red); border-color:rgba(214,69,69,0.3); }
  .icon-btn.danger:hover{ background:rgba(214,69,69,0.08); }

  .empty-state{
    text-align:center; padding:34px 20px; color:var(--muted-dark); font-size:12px;
    border:1px dashed var(--line-light); border-radius:var(--r-md); margin-top:14px;
  }

  .form-field select, .form-field input[type=datetime-local]{
    width:100%; padding:10px 12px; border:1px solid var(--line-light); background:var(--input-bg);
    font-size:12.5px; color:var(--ink); border-radius:var(--r-xs); font-family:inherit;
  }
  .form-field select:focus, .form-field input[type=datetime-local]:focus{
    outline:none; border-color:var(--orange); box-shadow:0 0 0 3px rgba(232,121,46,0.12); background:#fff;
  }

  /* ---------- rich text editor ---------- */
  .rte-wrap{ border:1px solid var(--line-light); border-radius:var(--r-xs); overflow:hidden; background:var(--input-bg); }
  .rte-wrap:focus-within{ border-color:var(--orange); box-shadow:0 0 0 3px rgba(232,121,46,0.12); background:#fff; }
  .rte-toolbar{ display:flex; align-items:center; gap:3px; padding:6px 8px; border-bottom:1px solid var(--line-light); background:#fff; }
  .rte-toolbar button{
    width:26px; height:26px; border:1px solid transparent; background:transparent; border-radius:6px;
    color:var(--navy-header); font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .rte-toolbar button:hover{ background:var(--input-bg); border-color:var(--line-light); }
  .rte-toolbar button.active{ background:var(--orange); border-color:var(--orange); color:#fff; }
  .rte-toolbar button.active:hover{ background:var(--orange-dark); border-color:var(--orange-dark); }
  .rte-editor{
    min-height:80px; padding:10px 12px; font-size:12.5px; color:var(--ink); line-height:1.5;
    outline:none;
  }
  .rte-editor:empty:before{ content:attr(data-placeholder); color:var(--muted-dark); font-style:italic; }
  .rte-editor.readonly{ background:#F6F7F9; cursor:default; }
  .rte-display{ font-size:12px; line-height:1.65; color:var(--ink); }

  @media (max-width:900px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; }
  }

  /* ================= AUTH GATE (login / register) — restyled to match the LSH Case Management System login screen ================= */
  .authpage{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    --auth-navy:#0f2148;
    --auth-navy-deep:#081226;
    --auth-navy-mid:#132a5c;
    --auth-navy-input:#0d1c3d;
    --auth-line:#1e2c4d;
    --auth-accent:#f97316;
    --auth-accent-hover:#fb923c;
    background: radial-gradient(circle at 30% 20%, var(--auth-navy-mid), var(--auth-navy-deep) 70%);
    padding:40px 16px; font-family:'IBM Plex Sans', Arial, Helvetica, sans-serif;
    transition: background 0.4s ease;
  }
  .authpage.theme-admin{
    --auth-accent:#ef4444;
    --auth-accent-hover:#f87171;
    background: radial-gradient(circle at 30% 20%, #3b0d0d, var(--auth-navy-deep) 70%);
  }
  .authcard{
    width:100%; max-width:420px; background:rgba(255,255,255,0.03);
    border:1px solid var(--auth-line);
    border-top:3px solid var(--auth-accent); border-radius:12px;
    box-shadow:0 30px 80px rgba(0,0,0,0.5); padding:32px; color:#fff;
    transition: border-top-color 0.4s ease;
  }

  .authbrand{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .authbrand .logo-box{
    width:38px; height:38px; font-size:14px; border-radius:6px;
    background:transparent; border:2px solid var(--auth-accent); color:var(--auth-accent);
    display:flex; align-items:center; justify-content:center; font-weight:900;
    transition: border-color 0.4s ease, color 0.4s ease;
  }
  .authbrand .l1{ font-size:16px; font-weight:900; text-transform:uppercase; letter-spacing:0.04em; color:#fff; }
  .authbrand .l2{ font-size:10px; color:var(--auth-accent); font-weight:700; letter-spacing:0.06em; margin-top:4px; transition: color 0.4s ease; }
  .authpage.theme-admin .authbrand .logo-box{ background:transparent; }

  .authtabs{ display:flex; gap:6px; margin-bottom:20px; background:var(--auth-navy-input); border:none; border-radius:8px; padding:4px; }
  .authtabs button{
    flex:1; border:none; background:transparent; color:#94a3b8; border-radius:6px;
    font-size:10.5px; letter-spacing:0.05em; font-weight:800; padding:9px 6px; cursor:pointer;
    text-transform:uppercase; transition: background 0.25s ease, color 0.25s ease;
  }
  .authtabs button.active{ background:var(--auth-accent); color:#0f2148; box-shadow:none; }
  .authpage.theme-admin .authtabs button.active{ color:#2b0a0a; }

  .authfield{ margin-bottom:12px; }
  .authfield label{ display:block; font-size:9.5px; letter-spacing:0.05em; color:#94a3b8; margin-bottom:6px; text-transform:uppercase; }
  .authfield input, .authfield select{
    width:100%; padding:10px 12px; background:var(--auth-navy-input); border:1px solid var(--auth-line);
    color:#fff; font-size:13px; border-radius:6px; font-family:'IBM Plex Mono','Courier New',monospace;
  }
  .authfield input::placeholder{ color:#64748b; }
  .authfield input:focus, .authfield select:focus{
    outline:none; border-color:var(--auth-accent); box-shadow:none;
  }
  .authfield input:disabled{ opacity:0.5; cursor:not-allowed; }
  .authhint{ font-size:11px; color:#64748b; margin-top:6px; line-height:1.4; }

  .authrow{ display:flex; gap:12px; }
  .authrow .authfield{ flex:1; }
  .authrow .authfield.small{ flex:0 0 68px; }
  .authrow .authfield.suffix{ flex:0 0 118px; }

  .authbtn{
    width:100%; padding:11px; border:none; border-radius:6px; background:var(--auth-accent);
    color:#0f2148; font-size:11px; font-weight:900; letter-spacing:0.05em; text-transform:uppercase;
    cursor:pointer; margin-top:6px; transition: background 0.25s ease;
  }
  .authbtn:hover{ background:var(--auth-accent-hover); }
  .authpage.theme-admin .authbtn{ color:#2b0a0a; }

  .authfooter{ text-align:center; font-size:11px; color:#94a3b8; margin-top:16px; }
  .authfooter a{ color:var(--auth-accent); font-weight:700; text-decoration:underline; cursor:pointer; }

  .autherror{ font-size:11px; font-weight:700; margin-bottom:12px; display:none; padding:9px 12px; border-radius:6px;
    background:rgba(185,28,28,0.15); color:#fca5a5; }
  .authnotice{ font-size:11px; font-weight:700; margin-bottom:12px; display:none; padding:9px 12px; border-radius:6px;
    background:rgba(22,101,52,0.2); color:#86efac; }

  .authview{ display:none; }
  .authview.active{ display:block; }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="logo-row">
      <div class="logo-box">CM</div>
      <div class="logo-text">
        <div class="l1">CASE MANAGEMENT</div>
        <div class="l2">TRAINING INTERFACE</div>
      </div>
    </div>

    <div class="roletoggle" id="roleToggle">
      <button data-role="trainee" class="active">TRAINEE</button>
      <button data-role="admin">ADMIN</button>
    </div>

    <div>
      <div class="field-label">YOUR NAME</div>
      <input class="side-input" id="nameInput" type="text" placeholder="Enter your name" />
    </div>

    <div class="nav-label">TRAINING ACTIVITIES</div>
    <div class="nav-list" id="navList"></div>
    <button class="btn-full" id="addDayBtn" style="display:none; background:transparent; border:1px dashed var(--line); color:var(--muted); margin-top:2px;">+ ADD DAY</button>

    <div class="sidebar-spacer"></div>
    <button class="btn-full btn-green" id="primaryActionBtn">SUBMIT ANSWERS</button>
    <div class="signed-in" id="signedInBlock">Not signed in</div>
    <button class="btn-full btn-outline-red" id="logoutBtn">LOG OUT</button>
  </aside>

  <div style="flex:1; display:flex; flex-direction:column; min-width:0;">
    <div class="topbar">
      <span class="badge">CM</span>
      <span class="portal-title" id="portalTitle">CASE MANAGEMENT TRAINING INTERFACE — TRAINEE PORTAL</span>
      <span class="announce">ANNOUNCEMENT:</span>
      <span class="announce-text" id="announceText">Welcome to the CM Training Interface.</span>
      <span class="spacer"></span>
      <span class="clock" id="clock"></span>
      <select class="loc">
        <option>Manila</option>
        <option>Caloocan</option>
        <option>Quezon City</option>
      </select>
    </div>

    <div class="main">
      <div id="panel"></div>
    </div>
  </div>

</div>

<script>
/* ================= CONFIG ================= */
const DEFAULT_DAY_KEYS = ["day1","day2","day3","day4","day5"];
const DEFAULT_DAY_LABELS = {
  day1:{label:"Day 1", short:"DAY 1"},
  day2:{label:"Day 2", short:"DAY 2"},
  day3:{label:"Day 3", short:"DAY 3"},
  day4:{label:"Day 4", short:"DAY 4"},
  day5:{label:"Day 5", short:"DAY 5"},
};
let DAY_KEYS = [...DEFAULT_DAY_KEYS];
let DAY_LABELS = {...DEFAULT_DAY_LABELS};

/* Admin-added days beyond the default 5 are stored under a shared key so every
   admin/trainee session sees the same set. */
async function loadExtraDays(){
  const extra = await getJSON('config:extra_days', true);
  if(!Array.isArray(extra)) return;
  extra.forEach(d=>{
    if(d && d.key && !DAY_KEYS.includes(d.key)){
      DAY_KEYS.push(d.key);
      DAY_LABELS[d.key] = { label: d.label || d.key, short: d.short || d.key.toUpperCase() };
    }
  });
}

function nextDayNumber(){
  let max = 0;
  DAY_KEYS.forEach(k=>{
    const m = k.match(/^day(\d+)$/);
    if(m) max = Math.max(max, parseInt(m[1], 10));
  });
  return max + 1;
}

async function addDay(){
  const n = nextDayNumber();
  const suggested = `Day ${n}`;
  const input = prompt('Name for the new day:', suggested);
  if(input === null) return;
  const label = input.trim() || suggested;
  const key = `day${n}`;
  const short = label.toUpperCase();

  DAY_KEYS.push(key);
  DAY_LABELS[key] = { label, short };

  const extra = (await getJSON('config:extra_days', true)) || [];
  extra.push({ key, label, short });
  await setJSON('config:extra_days', extra, true);

  state.activeTab = key;
  render();
}

/* ================= STATE ================= */
let state = {
  role: "trainee",
  name: "",
  activeTab: "day1",
  selectedTrainee: null,
  search: "",
  adminView: "manage",
  editingItemId: null,
};

function slugify(n){
  return n.trim().toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_\-]/g,'') || 'anonymous';
}
function uid(){ return 'itm_' + Math.random().toString(36).slice(2,9); }
function stripHtml(html){
  const d = document.createElement('div');
  d.innerHTML = html || '';
  return (d.textContent || d.innerText || '').trim();
}
function formatDeadline(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  return d.toLocaleString('en-US', { month:'short', day:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

/* ================= STORAGE HELPERS ================= */
async function getJSON(key, shared){
  try{
    const res = await fetch(`/api/kv/${encodeURIComponent(key)}${shared ? '?shared=1' : ''}`, { credentials: 'include' });
    if(res.status === 401){ location.reload(); return null; }
    const data = await res.json();
    return data.value ? JSON.parse(data.value) : null;
  }catch(e){ return null; }
}
async function setJSON(key, val, shared){
  try{
    const res = await fetch(`/api/kv/${encodeURIComponent(key)}`, {
      method: 'PUT',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ value: JSON.stringify(val), shared: !!shared }),
    });
    return res.ok;
  }catch(e){ console.error("storage set failed", e); return false; }
}
async function listKeys(prefix, shared){
  try{
    const res = await fetch(`/api/kv?prefix=${encodeURIComponent(prefix)}${shared ? '&shared=1' : ''}`, { credentials: 'include' });
    const data = await res.json();
    return data.keys || [];
  }catch(e){ return []; }
}

/* ================= ACTIVITY DATA ================= */
async function getActivityMeta(day){
  const m = await getJSON(`activity_meta:${day}`, true);
  return m || { title:"", description:"", instructions:"", deadline:"" };
}
async function setActivityMeta(day, meta){
  return setJSON(`activity_meta:${day}`, meta, true);
}
async function getActivityItems(day){
  const items = await getJSON(`activity_items:${day}`, true);
  return items || [];
}
async function setActivityItems(day, items){
  return setJSON(`activity_items:${day}`, items, true);
}

/* ================= RICH TEXT EDITOR ================= */
function richEditorHTML(id, contentHTML, placeholder, readonly){
  if(readonly){
    return `<div class="rte-display">${contentHTML || '<em>No answer submitted.</em>'}</div>`;
  }
  return `
    <div class="rte-wrap">
      <div class="rte-toolbar">
        <button type="button" data-rte="${id}" data-cmd="bold" title="Bold"><b>B</b></button>
        <button type="button" data-rte="${id}" data-cmd="italic" title="Italic"><i>I</i></button>
      </div>
      <div class="rte-editor" id="${id}" contenteditable="true" data-placeholder="${placeholder}">${contentHTML || ''}</div>
    </div>`;
}
function updateToolbarState(editor){
  const wrap = editor.closest('.rte-wrap');
  if(!wrap) return;
  wrap.querySelectorAll('button[data-cmd]').forEach(btn=>{
    let active = false;
    try{ active = document.queryCommandState(btn.dataset.cmd); }catch(e){ active = false; }
    btn.classList.toggle('active', active);
  });
}
function bindRichEditors(root){
  root.querySelectorAll('button[data-rte]').forEach(btn=>{
    btn.addEventListener('mousedown', (e)=> e.preventDefault());
    btn.addEventListener('click', ()=>{
      const editor = document.getElementById(btn.dataset.rte);
      if(!editor) return;
      editor.focus();
      document.execCommand(btn.dataset.cmd, false, null);
      updateToolbarState(editor);
    });
  });
  root.querySelectorAll('.rte-editor').forEach(editor=>{
    ['keyup','mouseup','click'].forEach(evt=>{
      editor.addEventListener(evt, ()=> updateToolbarState(editor));
    });
  });
}
function getRteContent(id){
  const el = document.getElementById(id);
  return el ? el.innerHTML.trim() : '';
}

/* ================= CLOCK ================= */
function startClock(){
  const el = document.getElementById('clock');
  function tick(){
    const d = new Date();
    const opts = { month:'short', day:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true };
    el.textContent = d.toLocaleString('en-US', opts);
  }
  tick();
  setInterval(tick, 1000);
}

/* ================= HEADER BINDINGS ================= */
function bindHeader(){
  const roleToggle = document.getElementById('roleToggle');
  if(roleToggle) roleToggle.style.display = 'none'; // role is now set by the server session, not chosen client-side

  const nameInput = document.getElementById('nameInput');
  nameInput.value = state.name;
  nameInput.readOnly = true; // identity now comes from the authenticated account

  document.getElementById('logoutBtn').onclick = async ()=>{
    try{ await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }); }
    catch(e){ /* ignore — reload will re-check session either way */ }
    location.reload();
  };

  document.getElementById('portalTitle').textContent =
    `CASE MANAGEMENT TRAINING INTERFACE — ${state.role.toUpperCase()} PORTAL`;

  document.getElementById('announceText').textContent =
    state.activeTab === 'leaderboard'
      ? 'Leaderboard updates live as admins submit grades.'
      : (state.role === 'admin' ? 'Build or grade this activity from the panel below.' : 'Select a training activity to begin.');

  document.getElementById('signedInBlock').innerHTML = state.name.trim()
    ? `Signed in as: <b>${state.name.trim()}</b><br/>Role: <b>${state.role.toUpperCase()}</b>`
    : `Not signed in`;
}

async function renderSidebarNav(){
  const nav = document.getElementById('navList');
  let html = '';
  const visibleDays = [];
  for(const d of DAY_KEYS){
    const meta = DAY_LABELS[d];
    const items = await getActivityItems(d);
    const hasContent = items.length > 0;

    /* Trainees only ever see a day once the admin has added at least one activity item. */
    if(state.role === 'trainee' && !hasContent) continue;

    visibleDays.push(d);
    const active = state.activeTab === d ? 'active' : '';
    let sub = hasContent ? `${items.length} item${items.length===1?'':'s'}` : 'No activities assigned yet';
    if(hasContent){
      if(state.role === 'admin'){
        const keys = await listKeys(`submission:${d}:`, true);
        sub = `${keys.length} trainee${keys.length===1?'':'s'} submitted`;
      } else {
        const slug = slugify(state.name || '');
        const grade = state.name.trim() ? await getJSON(`grade:${d}:${slug}`, true) : null;
        const gradedCount = grade ? Object.keys(grade.items||{}).length : 0;
        sub = `${gradedCount}/${items.length} graded`;
      }
    }
    html += `
      <div class="nav-item ${active}" data-day="${d}">
        <div class="title-row">
          <span class="name">${meta.short}</span>
          <span class="pill ${hasContent ? '' : 'gray'}">${hasContent ? items.length+' ITEMS' : 'EMPTY'}</span>
        </div>
        <div class="sub">${sub}</div>
      </div>`;
  }

  if(state.role === 'trainee' && visibleDays.length === 0){
    html += `<div class="empty-note" style="padding:6px 2px;">No activities assigned yet. Check back once your admin publishes one.</div>`;
  }

  html += `
    <div class="nav-item ${state.activeTab==='leaderboard'?'active':''}" data-day="leaderboard">
      <div class="title-row"><span class="name">LEADERBOARD</span><span class="pill green">LIVE</span></div>
      <div class="sub">Ranked by total points</div>
    </div>`;
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-item').forEach(item=>{
    item.onclick = ()=>{
      state.activeTab = item.dataset.day;
      state.selectedTrainee = null;
      state.adminView = "manage";
      state.editingItemId = null;
      state.search = "";
      render();
    };
  });

  /* If the trainee's active tab points at a day that's no longer visible (e.g. the
     admin removed its last item, or the trainee just switched roles), fall back to
     the first visible day, or the leaderboard if none are available yet. */
  if(state.role === 'trainee' && state.activeTab !== 'leaderboard' && !visibleDays.includes(state.activeTab)){
    state.activeTab = visibleDays.length ? visibleDays[0] : 'leaderboard';
  }
}

/* ================= MAIN RENDER ================= */
async function render(){
  bindHeader();
  await renderSidebarNav();

  const addDayBtn = document.getElementById('addDayBtn');
  if(addDayBtn){
    addDayBtn.style.display = state.role === 'admin' ? 'block' : 'none';
    addDayBtn.onclick = addDay;
  }

  const panel = document.getElementById('panel');
  const primaryBtn = document.getElementById('primaryActionBtn');

  if(state.activeTab === 'leaderboard'){
    primaryBtn.style.display = 'none';
    await renderLeaderboard(panel);
    return;
  }

  if(state.role === 'trainee'){
    await renderTraineeDay(panel, state.activeTab);
  } else {
    await renderAdminDay(panel, state.activeTab);
  }
}

/* ================= LESSON DECK BLOCK ================= */
async function renderLessonBlock(dayKey){
  const lesson = await getJSON(`lesson:${dayKey}`, true);
  if(state.role === 'admin'){
    return `
      <div class="dcard alt">
        <div class="dhead">LESSON DECK — ${DAY_LABELS[dayKey].label.toUpperCase()}</div>
        <div class="dbody" style="display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;">
          <div>${lesson ? `<strong>${lesson.filename}</strong>` : `<span class="empty-note">No deck uploaded yet.</span>`}</div>
          <div>
            <input type="file" id="pptxInput" accept=".ppt,.pptx" style="display:none" />
            <button class="btn ghost" id="uploadPptxBtn">${lesson ? 'Replace deck' : 'Upload PPTX'}</button>
          </div>
        </div>
      </div>`;
  } else {
    return `
      <div class="dcard alt">
        <div class="dhead">LESSON DECK — ${DAY_LABELS[dayKey].label.toUpperCase()}</div>
        <div class="dbody" style="display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;">
          <div>${lesson ? `<strong>${lesson.filename}</strong><div class="empty-note">Uploaded by admin</div>` : `<span class="empty-note">Not uploaded yet — check back before starting the activity.</span>`}</div>
          ${lesson ? `<a class="btn orange" href="${lesson.dataUrl}" download="${lesson.filename}" style="text-decoration:none;">REVIEW LESSON</a>` : ''}
        </div>
      </div>`;
  }
}

function bindLessonUpload(dayKey){
  const btn = document.getElementById('uploadPptxBtn');
  if(!btn) return;
  const input = document.getElementById('pptxInput');
  btn.onclick = ()=> input.click();
  input.onchange = async ()=>{
    const file = input.files[0];
    if(!file) return;
    if(file.size > 4.5 * 1024 * 1024){
      alert("This file is too large for the prototype's storage (limit ~4.5MB). A production build would upload this to real file storage instead.");
      return;
    }
    const reader = new FileReader();
    reader.onload = async ()=>{
      btn.textContent = "Uploading...";
      const ok = await setJSON(`lesson:${dayKey}`, {filename:file.name, dataUrl:reader.result, uploadedAt:Date.now()}, true);
      if(!ok) alert("Upload failed. Please try again.");
      render();
    };
    reader.readAsDataURL(file);
  };
}

/* ================= TRAINEE VIEW ================= */
async function renderTraineeDay(panel, dayKey){
  const meta = await getActivityMeta(dayKey);
  const items = await getActivityItems(dayKey);
  const dayLabel = DAY_LABELS[dayKey];
  const slug = slugify(state.name || '');
  const hasName = !!state.name.trim();

  document.getElementById('primaryActionBtn').style.display = items.length ? 'block' : 'none';
  document.getElementById('primaryActionBtn').textContent = 'SUBMIT ANSWERS';

  const lessonHtml = await renderLessonBlock(dayKey);

  if(items.length === 0){
    panel.innerHTML = `
      <div class="card">
        <div class="card-head">
          <div><h1>${dayLabel.label}</h1><div class="intro">No activities assigned yet.</div></div>
          <div><div class="stamp">TRAINEE</div><div class="meta-mini">${dayLabel.short}</div></div>
        </div>
      </div>
      ${lessonHtml}
      <div class="empty-state">No activities assigned yet for ${dayLabel.label}. Check back once your admin uploads one.</div>
    `;
    bindLessonUpload(dayKey);
    return;
  }

  let submission = hasName ? await getJSON(`submission:${dayKey}:${slug}`, true) : null;
  let grade = hasName ? await getJSON(`grade:${dayKey}:${slug}`, true) : null;

  const gradedCount = grade ? Object.keys(grade.items || {}).length : 0;
  const submittedCount = submission ? Object.keys(submission.answers||{}).filter(k=>submission.answers[k]).length : 0;
  const totalPoints = grade ? Object.values(grade.items||{}).reduce((s,it)=>s+(it.points||0),0) : 0;

  const visibleItems = items.filter(q =>
    !state.search || (q.title + stripHtml(q.prompt)).toLowerCase().includes(state.search.toLowerCase())
  );

  let cards = '';
  visibleItems.forEach((q)=>{
    const savedAns = submission && submission.answers ? (submission.answers[q.id] || '') : '';
    const g = grade && grade.items ? grade.items[q.id] : null;
    let badge = `<span class="status-badge status-empty">NOT STARTED</span>`;
    if(stripHtml(savedAns) && !g) badge = `<span class="status-badge status-pending">SUBMITTED · AWAITING REVIEW</span>`;
    if(g) badge = `<span class="status-badge status-graded">GRADED · ${g.points}/10</span>`;

    cards += `
      <div class="dcard">
        <div class="dhead">${q.title}</div>
        <div class="dbody">
          <div class="prompt">${q.prompt}</div>
          ${richEditorHTML(`rte-ans-${q.id}`, savedAns, 'Type your response here...', !!g)}
          ${g && g.feedback ? `<div class="model-answer show"><strong>Admin feedback:</strong> ${g.feedback}</div>` : ''}
          <div class="row-actions">${badge}<span></span></div>
        </div>
      </div>`;
  });

  panel.innerHTML = `
    <div class="card">
      <div class="card-head">
        <div>
          <h1>${meta.title || dayLabel.label}</h1>
          <div class="intro">${meta.description || ''}</div>
        </div>
        <div>
          <div class="stamp">${state.role.toUpperCase()}</div>
          <div class="meta-mini">${dayLabel.short}${meta.deadline ? ' · DUE '+formatDeadline(meta.deadline) : ' · OPEN DEADLINE'}</div>
        </div>
      </div>
      <div class="stat-bar">
        <div class="stat"><div class="lbl">ANSWERED</div><div class="val">${submittedCount}/${items.length}</div></div>
        <div class="stat"><div class="lbl">GRADED</div><div class="val">${gradedCount}/${items.length}</div></div>
        <div class="stat"><div class="lbl">POINTS EARNED</div><div class="val">${totalPoints}/${items.length*10}</div></div>
        <div class="grow"></div>
        <div class="role-chip">${hasName ? state.name.trim().toUpperCase() : 'ENTER NAME TO START'}</div>
      </div>
      <div class="search-row"><input id="searchInput" placeholder="Search this activity's items..." value="${state.search}" /></div>
    </div>

    ${meta.instructions ? `<div class="dcard alt"><div class="dhead">INSTRUCTIONS</div><div class="dbody"><div class="rte-display">${meta.instructions}</div></div></div>` : ''}
    ${lessonHtml}
    ${!hasName ? '<p class="empty-note" style="margin:10px 0 16px 4px;">Enter your name in the sidebar to save and submit answers.</p>' : ''}
    ${cards}
  `;

  document.getElementById('searchInput').oninput = (e)=>{ state.search = e.target.value; renderTraineeDay(panel, dayKey); };
  bindRichEditors(panel);
  document.getElementById('primaryActionBtn').onclick = async ()=>{
    const answers = {};
    panel.querySelectorAll('.rte-editor[id^="rte-ans-"]').forEach(ed=>{
      if(ed.classList.contains('readonly')) return;
      const qid = ed.id.replace('rte-ans-','');
      answers[qid] = ed.innerHTML.trim();
    });
    const existing = submission && submission.answers ? submission.answers : {};
    const merged = {...existing, ...answers};
    await setJSON(`submission:${dayKey}:${slug}`, {name: state.name.trim(), answers: merged, submittedAt: Date.now()}, true);
    render();
  };
  bindLessonUpload(dayKey);
}

/* ================= ADMIN VIEW ================= */
async function renderAdminDay(panel, dayKey){
  const meta = await getActivityMeta(dayKey);
  const items = await getActivityItems(dayKey);
  const dayLabel = DAY_LABELS[dayKey];
  const lessonHtml = await renderLessonBlock(dayKey);

  const subtabsHtml = `
    <div class="subtabs">
      <div class="subtab ${state.adminView==='manage'?'active':''}" data-view="manage">MANAGE ACTIVITY</div>
      <div class="subtab ${state.adminView==='grade'?'active':''}" data-view="grade">GRADE SUBMISSIONS</div>
    </div>`;

  const headerHtml = `
    <div class="card">
      <div class="card-head">
        <div><h1>${meta.title || dayLabel.label}</h1><div class="intro">${meta.description || 'No description yet.'}</div></div>
        <div><div class="stamp">ADMIN</div><div class="meta-mini">${dayLabel.short}${meta.deadline ? ' · DUE '+formatDeadline(meta.deadline) : ' · OPEN DEADLINE'}</div></div>
      </div>
      ${subtabsHtml}
    </div>`;

  document.getElementById('primaryActionBtn').style.display = 'none';

  if(state.adminView === 'manage'){
    panel.innerHTML = headerHtml + renderManageView(dayKey, meta, items) + lessonHtml;
    bindManageView(dayKey, meta, items, panel);
    bindRichEditors(panel);
  } else {
    panel.innerHTML = headerHtml + lessonHtml + await renderGradeView(dayKey, items, panel);
  }

  panel.querySelectorAll('.subtab').forEach(t=>{
    t.onclick = ()=>{
      state.adminView = t.dataset.view;
      state.editingItemId = null;
      state.search = "";
      render();
    };
  });
  bindLessonUpload(dayKey);
}

/* ---- Manage Activity sub-view ---- */
function renderManageView(dayKey, meta, items){
  let itemRows = '';
  items.forEach((it, i)=>{
    const preview = stripHtml(it.prompt);
    itemRows += `
      <div class="item-row">
        <div>
          <div class="item-num">ITEM ${String(i+1).padStart(2,'0')}</div>
          <div class="item-title">${it.title}</div>
          <div class="item-preview">${preview.slice(0,140)}${preview.length>140?'...':''}</div>
        </div>
        <div class="item-actions">
          <button class="icon-btn" data-edit="${it.id}">EDIT</button>
          <button class="icon-btn danger" data-delete="${it.id}">DELETE</button>
        </div>
      </div>`;
  });

  const editing = items.find(it => it.id === state.editingItemId) || null;
  const dayOptions = DAY_KEYS.map(d => `<option value="${d}" ${d===dayKey?'selected':''}>${DAY_LABELS[d].label}</option>`).join('');
  const deadlineVal = meta.deadline || '';

  return `
    <div class="dcard alt">

function bindManageView(dayKey, meta, items, panel){
  document.getElementById('dayPicker').onchange = (e)=>{
    state.activeTab = e.target.value;
    state.editingItemId = null;
    render();
  };

  const openDeadlineToggle = document.getElementById('openDeadlineToggle');
  const deadlineInput = document.getElementById('deadlineInput');
  if(openDeadlineToggle && deadlineInput){
    openDeadlineToggle.onchange = ()=>{
      deadlineInput.disabled = openDeadlineToggle.checked;
      if(openDeadlineToggle.checked) deadlineInput.value = '';
    };
  }

  document.getElementById('saveDayMetaBtn').onclick = async ()=>{
    const title = document.getElementById('dayTitleInput').value.trim();
    const description = document.getElementById('dayDescInput').value.trim();
    const instructions = document.getElementById('dayInstrInput').value.trim();
    const deadline = openDeadlineToggle && openDeadlineToggle.checked ? '' : deadlineInput.value;
    await setActivityMeta(dayKey, { title, description, instructions, deadline });
    render();
  };

  document.getElementById('saveItemBtn').onclick = async ()=>{
    const title = document.getElementById('itemTitleInput').value.trim();
    const prompt = getRteContent('itemQuestionEditor');
    const model = getRteContent('itemAnswerEditor');
    if(!title || !stripHtml(prompt)){ alert('Please provide at least a scenario and a question.'); return; }

    let current = await getActivityItems(dayKey);
    if(state.editingItemId){
      current = current.map(it => it.id === state.editingItemId ? {...it, title, prompt, model} : it);
    } else {
      current = [...current, { id: uid(), title, prompt, model }];
    }
    await setActivityItems(dayKey, current);
    state.editingItemId = null;
    render();
  };

  const cancelBtn = document.getElementById('cancelEditBtn');
  if(cancelBtn) cancelBtn.onclick = ()=>{ state.editingItemId = null; render(); };

  panel.querySelectorAll('[data-edit]').forEach(b=>{
    b.onclick = ()=>{ state.editingItemId = b.dataset.edit; render(); };
  });
  panel.querySelectorAll('[data-delete]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Delete this activity item? This does not remove trainee answers already submitted.')) return;
      const current = await getActivityItems(dayKey);
      await setActivityItems(dayKey, current.filter(it => it.id !== b.dataset.delete));
      render();
    };
  });
}

/* ---- Grade Submissions sub-view ---- */
async function renderGradeView(dayKey, items, panel){
  if(items.length === 0){
    return `<div class="empty-state">Add activity items in "Manage Activity" before grading submissions.</div>`;
  }

  const submissionKeys = await listKeys(`submission:${dayKey}:`, true);
  const slugs = submissionKeys.map(k => k.split(':').slice(2).join(':'));

  if(slugs.length === 0){
    return `<div class="empty-state">No trainee submissions yet for this activity.</div>`;
  }

  if(!state.selectedTrainee || !slugs.includes(state.selectedTrainee)) state.selectedTrainee = slugs[0];

  const submission = await getJSON(`submission:${dayKey}:${state.selectedTrainee}`, true);
  const grade = await getJSON(`grade:${dayKey}:${state.selectedTrainee}`, true) || {items:{}};

  let options = '';
  for(const s of slugs){
    const sub = await getJSON(`submission:${dayKey}:${s}`, true);
    options += `<option value="${s}" ${s===state.selectedTrainee?'selected':''}>${sub ? sub.name : s}</option>`;
  }

  const qs = items.filter(q =>
    !state.search || (q.title + stripHtml(submission.answers?.[q.id]||'')).toLowerCase().includes(state.search.toLowerCase())
  );

  let cards = '';
  qs.forEach((q)=>{
    const ans = submission && submission.answers ? (submission.answers[q.id] || '') : '';
    const g = grade.items[q.id] || null;
    cards += `
      <div class="dcard">
        <div class="dhead">${q.title}</div>
        <div class="dbody">
          <div class="rte-display" style="margin-bottom:12px;">${ans || '<em>No answer submitted.</em>'}</div>
          ${q.model ? `<span class="toggle-model" data-qid="${q.id}">Show answer key</span><div class="model-answer" id="model-${q.id}">${q.model}</div>` : ''}
          <div class="grade-row">
            <div class="grade-inputs">
              <label>POINTS (0–10)</label>
              <input type="number" min="0" max="10" data-points="${q.id}" value="${g ? g.points : ''}" />
              <input type="text" data-feedback="${q.id}" placeholder="Feedback for trainee (optional)" value="${g && g.feedback ? g.feedback.replace(/"/g,'&quot;') : ''}" />
            </div>
          </div>
        </div>
      </div>`;
  });

  const html = `
    <div class="card">
      <div class="stat-bar">
        <div class="stat"><div class="lbl">TRAINEE</div><div class="val"><select class="day-select" id="traineeSelect" style="background:var(--bg-card-dark);color:#fff;border-color:var(--line);">${options}</select></div></div>
        <div class="grow"></div>
        <div class="role-chip">${slugs.length} SUBMISSION${slugs.length===1?'':'S'}</div>
      </div>
      <div class="search-row"><input id="searchInput" placeholder="Search items or answers..." value="${state.search}" /></div>
    </div>
    ${cards}
    <div class="row-actions" style="margin:6px 4px 0 4px;">
      <span></span>
      <button class="btn orange" id="saveGradesBtn">Save Grades</button>
    </div>
  `;

  setTimeout(()=>{
    const searchEl = document.getElementById('searchInput');
    if(searchEl) searchEl.oninput = (e)=>{ state.search = e.target.value; render(); };
    const traineeSel = document.getElementById('traineeSelect');
    if(traineeSel) traineeSel.onchange = (e)=>{ state.selectedTrainee = e.target.value; render(); };
    panel.querySelectorAll('.toggle-model').forEach(el=>{
      el.onclick = ()=>{
        const box = document.getElementById('model-'+el.dataset.qid);
        box.classList.toggle('show');
        el.textContent = box.classList.contains('show') ? 'Hide answer key' : 'Show answer key';
      };
    });
    const saveBtn = document.getElementById('saveGradesBtn');
    if(saveBtn) saveBtn.onclick = async ()=>{
      const currentItems = await getActivityItems(dayKey);
      const items2 = {...grade.items};
      currentItems.forEach(q=>{
        const pEl = document.querySelector(`[data-points="${q.id}"]`);
        const fEl = document.querySelector(`[data-feedback="${q.id}"]`);
        if(!pEl) return;
        const p = pEl.value, f = fEl.value;
        if(p !== '') items2[q.id] = { points: Math.max(0, Math.min(10, Number(p))), feedback: f };
      });
      await setJSON(`grade:${dayKey}:${state.selectedTrainee}`, {name: submission.name, items: items2, gradedAt: Date.now()}, true);
      render();
    };
  }, 0);

  return html;
}

/* ================= LEADERBOARD ================= */
async function renderLeaderboard(panel){
  panel.innerHTML = `<div class="card"><div class="card-head"><div><h1>Leaderboard</h1><div class="intro">Total points across all graded activities.</div></div></div></div><p class="empty-note">Loading...</p>`;
  const gradeKeys = await listKeys('grade:', true);
  const totals = {};

  for(const key of gradeKeys){
    const parts = key.split(':');
    const dayKey = parts[1];
    const slug = parts.slice(2).join(':');
    const g = await getJSON(key, true);
    if(!g) continue;
    const dayTotal = Object.values(g.items || {}).reduce((s,it)=> s + (it.points||0), 0);
    if(!totals[slug]) totals[slug] = { name: g.name || slug, total: 0, perDay: {} };
    totals[slug].total += dayTotal;
    totals[slug].perDay[dayKey] = dayTotal;
  }

  const ranked = Object.values(totals).sort((a,b)=> b.total - a.total);
  let rows = '';
  if(ranked.length === 0){
    rows = `<tr><td colspan="4" class="empty-note">No grades recorded yet.</td></tr>`;
  } else {
    ranked.forEach((r,i)=>{
      const breakdown = DAY_KEYS.map(d => r.perDay[d] ? `${DAY_LABELS[d].short.replace('DAY ','D')}:${r.perDay[d]}` : '').filter(Boolean).join('  ');
      rows += `<tr>
        <td class="rank ${i===0?'gold':''}">#${i+1}</td>
        <td>${r.name}</td>
        <td style="color:var(--muted-dark); font-size:11px;">${breakdown}</td>
        <td class="score-total">${r.total} PTS</td>
      </tr>`;
    });
  }

  panel.innerHTML = `
    <div class="card">
      <div class="card-head">
        <div><h1>Leaderboard</h1><div class="intro">Total points across all graded activities. Updates live as the admin submits grades.</div></div>
        <div><div class="stamp">RANKINGS</div></div>
      </div>
    </div>
    <div class="dcard">
      <div class="dhead">DOCKET — ALL TRAINEES</div>
      <div class="dbody" style="padding-top:6px;">
        <table class="leader">
          <thead><tr><th>RANK</th><th>TRAINEE</th><th>BREAKDOWN</th><th>TOTAL</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}

async function checkSession(){
  try{
    const res = await fetch('/api/auth/me', { credentials: 'include' });
    if(res.status === 401) return null;
    const data = await res.json();
    return data.user || null;
  }catch(e){ return null; }
}

function renderLoginGate(){
  document.body.innerHTML = `
    <div class="authpage" id="authPage">
      <div class="authcard">

        <div class="authbrand">
          <div class="logo-box">CM</div>
          <div class="logo-text">
            <div class="l1">CASE MANAGEMENT</div>
            <div class="l2">TRAINING INTERFACE</div>
          </div>
        </div>

        <!-- LOGIN VIEW -->
        <div id="authLoginView" class="authview active">
          <div class="authtabs" id="authPortalTabs">
            <button type="button" data-portal="trainee" class="active">TRAINEE PORTAL</button>
            <button type="button" data-portal="admin">ADMIN PORTAL</button>
          </div>

          <div class="autherror" id="loginError"></div>

          <div class="authfield">
            <label>USERNAME</label>
            <input id="authUsername" type="text" placeholder="Enter your username" />
          </div>
          <div class="authfield">
            <label>PASSWORD</label>
            <input id="authPassword" type="password" placeholder="Enter your password" />
          </div>

          <button id="authLoginBtn" class="authbtn">LOG IN</button>
          <div class="authfooter">No account yet? <a id="goToRegister">Register here</a></div>
        </div>

        <!-- REGISTER VIEW -->
        <div id="authRegisterView" class="authview">
          <div class="autherror" id="registerError"></div>
          <div class="authnotice" id="registerNotice"></div>

          <div class="authrow">
            <div class="authfield"><label>FIRST NAME</label><input id="regFirst" type="text" placeholder="e.g., Juan" /></div>
            <div class="authfield small"><label>M.I.</label><input id="regMI" type="text" placeholder="M.I." maxlength="2" /></div>
          </div>
          <div class="authrow">
            <div class="authfield"><label>LAST NAME</label><input id="regLast" type="text" placeholder="e.g., Dela Cruz" /></div>
            <div class="authfield suffix"><label>SUFFIX (OPTIONAL)</label><input id="regSuffix" type="text" placeholder="Jr., III..." /></div>
          </div>
          <div class="authfield">
            <label>EMAIL</label>
            <input id="regEmail" type="email" placeholder="name@example.com" />
          </div>
          <div class="authfield">
            <label>TYPE OF USER</label>
            <select id="regRole">
              <option value="trainee">Trainee</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="authfield">
            <label>BATCH ID</label>
            <input type="text" placeholder="Batch ID will be assigned upon approval" disabled />
          </div>
          <div class="authfield">
            <label>USERNAME</label>
            <input id="regUsername" type="text" placeholder="Choose a username" />
          </div>
          <div class="authfield">
            <label>PASSWORD</label>
            <input id="regPassword" type="password" placeholder="Create a password" />
            <div class="authhint">At least 8 characters, letters and numbers only (must include at least one of each).</div>
          </div>
          <div class="authfield">
            <label>RETYPE PASSWORD</label>
            <input id="regPassword2" type="password" placeholder="Retype your password" />
          </div>

          <button id="authRegisterBtn" class="authbtn">SUBMIT REGISTRATION</button>
          <div class="authfooter">Already have an account? <a id="goToLogin">Back to log in</a></div>
        </div>

      </div>
    </div>
  `;

  const page = document.getElementById('authPage');
  const loginView = document.getElementById('authLoginView');
  const registerView = document.getElementById('authRegisterView');
  const portalTabs = document.querySelectorAll('#authPortalTabs button');
  const regRole = document.getElementById('regRole');
  const loginErr = document.getElementById('loginError');
  const regErr = document.getElementById('registerError');
  const regNotice = document.getElementById('registerNotice');

  const showError = (box, msg)=>{ box.textContent = msg; box.style.display = 'block'; };
  const hideError = (box)=>{ box.style.display = 'none'; };

  const setTheme = (portal)=>{
    page.classList.toggle('theme-admin', portal === 'admin');
  };

  portalTabs.forEach(btn=>{
    btn.onclick = ()=>{
      portalTabs.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      setTheme(btn.dataset.portal);
    };
  });

  document.getElementById('goToRegister').onclick = ()=>{
    loginView.classList.remove('active');
    registerView.classList.add('active');
    setTheme(regRole.value);
  };
  document.getElementById('goToLogin').onclick = ()=>{
    registerView.classList.remove('active');
    loginView.classList.add('active');
    const activePortal = document.querySelector('#authPortalTabs button.active').dataset.portal;
    setTheme(activePortal);
  };
  regRole.onchange = ()=> setTheme(regRole.value);

  const doLogin = async ()=>{
    hideError(loginErr);
    const username = document.getElementById('authUsername').value.trim();
    const password = document.getElementById('authPassword').value;
    if(!username || !password){ showError(loginErr, 'Enter a username and password.'); return; }
    try{
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      if(!res.ok){
        const data = await res.json().catch(()=>({}));
        showError(loginErr, data.error || 'Something went wrong.');
        return;
      }
      location.reload();
    }catch(e){ showError(loginErr, 'Network error — please try again.'); }
  };

  const doRegister = async ()=>{
    hideError(regErr); regNotice.style.display = 'none';
    const first = document.getElementById('regFirst').value.trim();
    const mi = document.getElementById('regMI').value.trim();
    const last = document.getElementById('regLast').value.trim();
    const suffix = document.getElementById('regSuffix').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const role = regRole.value;
    const username = document.getElementById('regUsername').value.trim();
    const password = document.getElementById('regPassword').value;
    const password2 = document.getElementById('regPassword2').value;

    if(!first || !last || !email || !username || !password){
      showError(regErr, 'Please fill in all required fields.'); return;
    }
    const pwRule = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$/;
    if(!pwRule.test(password)){
      showError(regErr, 'Password must be at least 8 characters and include letters and numbers.'); return;
    }
    if(password !== password2){
      showError(regErr, 'Passwords do not match.'); return;
    }

    try{
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ firstName: first, mi, lastName: last, suffix, email, role, username, password }),
      });
      if(!res.ok){
        const data = await res.json().catch(()=>({}));
        showError(regErr, data.error || 'Something went wrong. Please try again.');
        return;
      }
      regNotice.textContent = 'Registration submitted. Please wait for admin approval, then log in.';
      regNotice.style.display = 'block';
      setTimeout(()=>{ document.getElementById('goToLogin').click(); }, 2200);
    }catch(e){ showError(regErr, 'Network error — please try again.'); }
  };

  document.getElementById('authLoginBtn').onclick = doLogin;
  document.getElementById('authRegisterBtn').onclick = doRegister;
}

(async ()=>{
  const user = await checkSession();
  if(!user){ renderLoginGate(); return; }
  state.role = user.role;
  state.name = user.name || user.email;
  await loadExtraDays();
  startClock();
  render();
})();
</script>
