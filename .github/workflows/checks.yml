# Runs on every pull request and every push to main. A failure shows as a red
# "Checks" status on the PR/commit with a readable log, and GitHub emails the
# person who pushed. Nothing here deploys.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Syntax, files and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: JavaScript syntax, local files, JSON
        run: node .github/scripts/check-site.mjs
      - name: Batch IDs (B + MMDDYY, no trainee number)
        run: node .github/scripts/batch.mjs
      - name: Front door (signed-in trainees and admins go straight to the Training Directory; only a signed-out browser sees a sign-in box)
        run: node --no-warnings .github/scripts/front-door.mjs
      - name: Master Control (a trainer's own admin account opens it; only the site lock is the master account's)
        run: node --no-warnings .github/scripts/master-control.mjs
      - name: Calendaring Simulators' saved work (trainee saves, admin-only feedback)
        run: node --no-warnings .github/scripts/calsim.mjs
      - name: Calendar evaluations (submit, AI review, the trainer's live review and final report; trainees see it only once final)
        run: node --no-warnings .github/scripts/gcal-reviews.mjs
      - name: Google Calendar weekly schedule (Standard Training as it was; the Case Management and EA / PA clones apart; Admin only; unknown tracks refused)
        run: node --no-warnings .github/scripts/gcal-schedule.mjs
      - name: AI gateway (one shared budget for every call flow; per-flow share, per-minute and per-person limits)
        run: node --no-warnings .github/scripts/ai-gateway.mjs
      - name: The Call Simulator opens the CMS's (signed in, on the link's tab and line)
        run: node --no-warnings .github/scripts/calls-route.mjs
      - name: LSH Ring Channel opens from the Portal (signed in; admins to its trainer sign-in; linked on the Portal)
        run: node --no-warnings .github/scripts/ringchannel.mjs
      - name: Graded calls from the CMS count in the trainee's course (the Portal's results and each course's store)
        run: node --no-warnings .github/scripts/call-results.mjs
      - name: Simulator results count in the trainee's own record and course (the account's name, each course's store)
        run: node --no-warnings .github/scripts/sim-results.mjs
      - name: Build the Pages Functions without deploying
        run: npx --yes wrangler@3 pages functions build --outdir "$RUNNER_TEMP/dist"

  smoke:
    name: Smoke test in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1 jspdf@4.2.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Open every page and simulator (desktop and phone)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/smoke.cjs
      - name: Server requests from an open page (one /api/live every 20 s, heartbeat every 30 s)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/requests.cjs
      - name: Simulator pages keep a signed-in person (a trainee's session and heartbeat, a new tab asks /api/me once, retry on SESSION_EXPIRED, a second trainee starts clean)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/sim-session.cjs
      - name: Google Calendar Simulator (the week, every request doable, the check, the page, an Admin's schedule)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/gcal.cjs
      - name: Google Calendar Simulator submit and trainer review
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/gcal-review.cjs
      - name: Trainee Evaluations page in a new tab (a signed-in admin sees the review; trainees and signed-out visitors get the trainers-only note)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/gcal-review-page.cjs
      - name: My Evaluations (the trainee's own section - drafts with a way back in, submitted status, the sent report and its PDF)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/my-evaluations.cjs
      - name: Trainees' calendars on Trainee Evaluations (the table with View & score, search, each trainee's submission and a button into its review)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/trainees-on-evaluations.cjs
      - name: The trainee's side (a newer saved copy is never overwritten, today, big calendars, track names, PDF accents, the cards, a trainee's calendar in a new tab)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/gcal-trainee-side.cjs
      - name: Blueprint (the admin track for admins only; each track downloads as a PDF with the deploy stamp)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/blueprint.cjs
