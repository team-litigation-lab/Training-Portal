<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSH Academy Index — LSH Nexus</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="styles.css">
<style>
    :root {
        --navy: #0f2148; --navy-deep: #081226; --navy-mid: #132a5c;
        --orange: #f97316; --orange-soft: #fb923c; --slate: #334155; --paper: #faf8f4;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; font-family: 'IBM Plex Sans', Arial, Helvetica, sans-serif; color: var(--navy);
        /* The scales-of-justice backdrop itself now comes from theme.css
           (body.portal-bg), which every portal screen shares; the photo and
           the iOS-Safari fallback live there. What stays here is this page's
           own wash: 40% rather than the 30% it used to be, because the
           program cards above it are translucent now — the photo reads
           through the cards, so the page no longer has to spend its whole
           contrast budget on the gaps between them.
           --paper is the fallback colour under both layers. */
        --portal-wash: rgba(250, 248, 244, .60);
        --portal-base: var(--paper);
        /* styles.css (shared with core.html) sets body to height:100vh +
           overflow:hidden — correct for core.html's fixed "app shell" with
           its own internally-scrolling panels, but this page has no such
           inner scroll container, so inheriting that rule blocked the
           whole page from scrolling at all. Restored to normal flow. */
        height: auto; overflow: visible;
    }

    /* Announcement ticker — the same broadcast an admin sets in Master Control
       (Broadcast & Ping → /api/announcement). It used to show only on the admin
       screen (core.html's classification bar), so trainees never saw it; the
       LSH Academy Index is the first page they land on, so it belongs here.
       The ids are the ones app.js already fills (loadAnnouncement/refreshClock),
       and app.js is loaded further down this page. */
    .idx-ticker-bar {
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
        padding: 8px 28px; background: var(--navy-deep); color: #cbd5e1;
        border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .idx-ticker-bar .top-ticker-mini { flex: 1 1 260px; max-width: none; min-width: 0; }
    .idx-ticker-bar .ticker-viewport { min-width: 0; overflow: hidden; }
    .idx-ticker-bar .top-clock { color: #cbd5e1; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .idx-ticker-bar select { border: none; background: none; font: inherit; font-weight: 600; color: #fdba74; cursor: pointer; }
    @media (max-width: 640px) { .idx-ticker-bar { padding: 8px 16px; gap: 8px 14px; } }

    .idx-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; background: var(--navy-deep); }
    .idx-brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 800; font-size: 14px; }
    .idx-brand-mark { width: 34px; height: 34px; border-radius: 0; background: #fff; padding: 3px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
    .idx-brand-mark img { width: 100%; height: 100%; object-fit: contain; }
    .idx-user { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
    @media (max-width: 640px) { .idx-top { flex-wrap: wrap; gap: 10px; padding: 14px 16px; } .idx-user { justify-content: flex-start; gap: 6px 14px; } }
    .idx-user-name { color: rgba(255,255,255,0.85); font-size: 12.5px; font-weight: 700; }
    .idx-logout { color: rgba(255,255,255,0.5); font-size: 12px; font-weight: 600; text-decoration: none; cursor: pointer; }
    .idx-logout:hover, .idx-logout.on { color: #fff; }
    .idx-logout.on { font-weight: 800; }
    @media (max-width: 760px) { .idx-top { flex-wrap: wrap; gap: 10px; padding: 14px 16px; } .idx-user { flex-wrap: wrap; gap: 10px 14px; } }

    .idx-wrap { max-width: 1880px; margin: 0 auto; padding: 12px 32px 12px; width: 100%; box-sizing: border-box; }   /* (a flex item with auto margins is only as narrow as its content: a wide table, the access requests, then pushed a phone sideways) */

    .queue-card { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 16px; padding: 18px 20px; margin-bottom: 28px; }
    .topic-free { display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 999px; background: #dcfce7; color: #166534; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; vertical-align: middle; }
    .queue-card h3 { font-size: 13px; font-weight: 800; color: #9a3412; margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.03em; }
    .queue-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid #fed7aa; font-size: 12.5px; }
    .queue-row:first-of-type { border-top: none; }
    .queue-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .queue-btn { padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; border: none; cursor: pointer; }
    .queue-btn.approve { background: #166534; color: #fff; }
    .queue-btn.deny { background: #fff; color: #b91c1c; border: 1px solid #fca5a5; }
    .queue-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .queue-head h3 { margin: 0; }
    .queue-head a { font-size: 12px; font-weight: 700; color: #9a3412; text-decoration: underline; }
    .queue-table { width: 100%; border-collapse: collapse; font-size: 12.5px; background: #fff; border-radius: 10px; overflow: hidden; }
    .queue-table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: #9a3412; padding: 8px 10px; border-bottom: 1px solid #fed7aa; background: #fffaf5; }
    .queue-table td { padding: 8px 10px; border-top: 1px solid #ffedd5; vertical-align: middle; }
    .queue-table .queue-actions { justify-content: flex-end; }
    .queue-table .sub { color: #64748b; font-size: 11.5px; }
    .queue-wrap { overflow-x: auto; }

    /* Four across is the default, but a group's last row should not be a stub:
       a group of six is 4 + 2 on a four-column grid and a
       balanced 3 + 3 on a three-column one. groupedTopicsHtml() picks the count
       that divides the group evenly (see cols-3) rather than this being a
       one-off for that one section. */
    .topic-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(8px, 1.1vh, 15px) 15px; }
    .topic-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    /* A group of nine (Beyond-Legal Skills): five across, then four, with 📬 Your Daily Digest taking the last row's two slots. */
    @media (min-width: 1001px) { .topic-grid[style*="--cols:5"] { grid-template-columns: repeat(5, minmax(0, 1fr)); }
        .topic-grid[style*="--cols:5"] > .tool-card:nth-child(9):last-child { grid-column: span 2; } }
    .topic-group { margin-bottom: clamp(8px, 1.1vh, 12px); }
    .topic-group-head { display: flex; align-items: center; justify-content: center; text-align: center; gap: 14px; flex-wrap: nowrap; margin: 0 0 7px; }
    /* The group's name sits in a dark pill, and a thin muted orange rule runs out from both sides of it. */
    /* the line either side of a section's name: 2px, solid orange where it meets the name and fading out, with a soft glow */
    .topic-group-head::before, .topic-group-head::after { content: ""; flex: 1 1 0; min-width: 16px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, rgba(249,115,22,0), rgba(249,115,22,.55) 45%, #f97316); box-shadow: 0 0 8px rgba(249,115,22,.45); }
    .topic-group-head::after { background: linear-gradient(90deg, #f97316, rgba(249,115,22,.55) 55%, rgba(249,115,22,0)); }
    /* A quiet signpost, so the track cards stay the main thing on the page: a pill in the Portal's navy (the same gradient
       as the 📬 Daily Digest card), a thin muted orange edge, no glow, and slightly smaller capitals. */
    .topic-group-head h2 { display: inline-flex; align-items: center; gap: 8px; flex: 0 0 auto; font-size: 15px; line-height: 1.15; font-weight: 800; margin: 0; padding: 4px 18px; color: rgba(255,255,255,.92); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap;
        background: linear-gradient(135deg, var(--navy-deep) 0%, var(--navy) 55%, var(--navy-mid) 100%); border: 1px solid rgba(249,115,22,.45); border-radius: 999px;
        box-shadow: 0 6px 14px -10px rgba(0,0,0,.55); }
    .topic-group-head h2::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: rgba(249,115,22,.85); flex-shrink: 0; }
    /* These section notes sit directly on the body backdrop, not on a card,
       so the wash behind them is all the contrast they get. The photo's
       darkest area composites to about rgb(151,149,150) under the 40% wash
       this page now uses, where the old #334155 measures 3.49:1 — under WCAG
       AA for 12px text. The navy ink reads 5.31:1 on that same spot, so the
       note takes the heading's colour and separates itself by weight and
       size instead of by being a lighter grey. */
    .topic-group-head span { font-size: 12px; color: var(--navy); font-weight: 600; }
    @media (max-width: 1000px) { .topic-grid, .topic-grid.cols-3 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px) { .topic-grid, .topic-grid.cols-3 { grid-template-columns: 1fr; } }
    /* The cards keep their gridlines: the navy frame around the card and around its title,
       so they read as a grid over the page's photo backdrop. */
    .topic-card { background: #fff; border-radius: 14px; padding: clamp(7px, 1.2vh - 2px, 15px) 16px; border: 2px solid rgba(15,33,72,.35); box-shadow: 0 14px 28px -18px rgba(15,33,72,.35);
        display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "title title" "status action"; align-items: center; gap: clamp(5px, 1vh - 2px, 11px) 10px; }
    .topic-card h3 { grid-area: title; }
    .topic-card .topic-status { grid-area: status; }
    /* The action is a compact pill at the card's right, not a full-width bar: the track's title is what the eye should land on. */
    .topic-card .topic-action-btn { grid-area: action; margin-top: 0; justify-self: end; width: fit-content; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Centered, so the title reads as the card's headline rather than being pinned to one side. */
    .topic-card h3 { font-size: calc(16px + 1pt); font-weight: 800; margin: 0; color: var(--navy); border: 2px solid var(--navy); border-radius: 10px; padding: clamp(6px, 0.9vh - 1px, 10px) 11px; line-height: 1.25; text-align: center; }
    /* 🎨 Track identity: the card's top edge, its title frame and its name take the track's colour (--tk); the emblem
       sits before the name. A light shimmer passes over every name; an available track's frame also glows softly and
       its emblem bobs, so open programs are easy to spot. Nothing here changes a card's size; all motion stops for
       anyone whose system asks for reduced motion. */
    .topic-card.tk { box-shadow: inset 0 4px 0 var(--tk), 0 14px 28px -18px rgba(15,33,72,.35); }
    /* The name is the track's colour, deeper (--tk-ink: 72% of it with 28% navy), in the boldest weight with its shine: on the
       light frame below it reads well above WCAG AA. */
    .topic-card h3 { background: color-mix(in srgb, var(--navy) 9%, #fff); }
    .topic-card.tk { --tk-ink: color-mix(in srgb, var(--tk) 72%, #0f172a); }   /* the name's ink: the track's colour, deeper, so it reads at WCAG AA (5.0:1 or better) on the wash */
    /* ✨ The title frame, lighter and glossy: a pale wash of the track's colour that brightens to near-white at the top-left (a soft
       sheen), inside a gradient border of that colour (deep, light, deep), with a thin white highlight along its top edge. */
    .topic-card.tk h3 { border-color: transparent;
        background: linear-gradient(135deg, rgba(255,255,255,.95) 0%, color-mix(in srgb, var(--tk) 7%, #fff) 38%, color-mix(in srgb, var(--tk) 14%, #fff) 100%) padding-box,
            linear-gradient(120deg, var(--tk) 0%, color-mix(in srgb, var(--tk) 35%, #fff) 50%, var(--tk) 100%) border-box;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 6px 14px -10px color-mix(in srgb, var(--tk) 55%, transparent); }
    /* ★ The tracks are the stars of the Index: every track's name sits in a framed badge — a 3px border of the track's colour
       (deep, light, deep), a richer sheen of it, and a soft glow — so the eye lands on the programs first. */
    .topic-card.tk h3 { border-width: 3px;
        background: linear-gradient(135deg, #fff 0%, color-mix(in srgb, var(--tk) 10%, #fff) 40%, color-mix(in srgb, var(--tk) 20%, #fff) 100%) padding-box,
            linear-gradient(120deg, color-mix(in srgb, var(--tk) 80%, #000) 0%, color-mix(in srgb, var(--tk) 40%, #fff) 50%, color-mix(in srgb, var(--tk) 80%, #000) 100%) border-box;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 0 0 1px color-mix(in srgb, var(--tk) 22%, transparent), 0 8px 18px -10px color-mix(in srgb, var(--tk) 70%, transparent); }
    .topic-card.tk.live h3 .tk-name { font-weight: 900; letter-spacing: .005em; animation-duration: 4.5s; }   /* an open track's name: the boldest weight, and its shine passes a little more often */
    .tk-ic { display: inline-block; margin-right: .32em; }
    /* Every track's name is one size, on one line (an open track and a Coming Soon one alike). A name that would not fit
       its card on one line goes onto two at the same size (.two-line, Beyond-Legal Skills only); otherwise it is drawn smaller,
       just enough to fit (fitTrackTitles below). */
    .topic-card h3 { white-space: nowrap; }
    .topic-card h3.two-line { white-space: normal; text-wrap: balance; line-height: 1.15; }
    /* A Free Upskill track: its badge sits in the card's bottom row, centred between the status and the action, not in the title. */
    .topic-card.has-free { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); grid-template-areas: "title title title" "status free action"; column-gap: 4px; }
    .topic-card.has-free .topic-free { grid-area: free; justify-self: center; margin: 0; white-space: nowrap; }
    /* three labels on one row: on a narrow card they get a size smaller and less air, so all three fit */
    .topic-card.has-free { container-type: inline-size; }
    @container (max-width: 300px) {
        #idx-topics .topic-card.has-free .topic-status, #idx-topics .topic-card.has-free .topic-action-btn, .topic-card.has-free .topic-free { font-size: 9px; padding-left: 6px; padding-right: 6px; letter-spacing: 0; }
    }
    .topic-card.has-free .topic-status { justify-self: start; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* room below the letters: the name is painted with background-clip:text, which only paints inside its box, so at the pill's 1.1 line height
       the tails of g, y and p (Legal, Negotiator, Property) were cut off. The padding gives them room; the negative margin keeps the pill's height. */
    .tk-name { display: inline-block; line-height: 1.2; padding: .06em 0 .2em; margin: -.06em 0 -.2em; }
    .tk-name { background: linear-gradient(100deg, var(--tk-ink) 0%, var(--tk-ink) 38%, color-mix(in srgb, var(--tk) 45%, #fff) 50%, var(--tk-ink) 62%, var(--tk-ink) 100%);
        background-size: 260% 100%; background-position: 100% 0; -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: tkShine 6s ease-in-out infinite; animation-delay: var(--tkd, 0s); }
    @keyframes tkShine { 0%, 45% { background-position: 100% 0; } 85%, 100% { background-position: 0 0; } }
    .topic-card.tk.live h3 { animation: tkGlow 3.2s ease-in-out infinite; animation-delay: var(--tkd, 0s); }
    @keyframes tkGlow { 0%, 100% { box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 0 0 1px color-mix(in srgb, var(--tk) 22%, transparent), 0 8px 18px -10px color-mix(in srgb, var(--tk) 70%, transparent); } 50% { box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 0 0 4px color-mix(in srgb, var(--tk) 22%, transparent), 0 0 20px color-mix(in srgb, var(--tk) 42%, transparent); } }
    .topic-card.tk.live .tk-ic { animation: tkBob 3.2s ease-in-out infinite; animation-delay: var(--tkd, 0s); }
    @keyframes tkBob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-2px) rotate(-6deg); } }
    .topic-card.tk:not(.live) .tk-name { animation-duration: 9s; }
    /* ⏳ A Coming Soon track steps back so the open programs lead: the card draws smaller inside its grid slot (the grid
       doesn't move), on a softer white with no shadow, a smaller title in a thinner, muted frame, and no shimmer.
       The words keep their full colour, so they still read at WCAG AA. */
    .topic-card.soon { background: rgba(255,255,255,.84); box-shadow: none; border-color: rgba(15,33,72,.18); }   /* the same size as an open track's card: it steps back by its softer white, not by shrinking */
    .topic-card.tk.soon { box-shadow: inset 0 3px 0 color-mix(in srgb, var(--tk) 45%, transparent); }
    .topic-card.soon h3 { border-width: 2px; border-color: color-mix(in srgb, var(--tk, var(--navy)) 40%, #fff); background: color-mix(in srgb, var(--tk, var(--navy)) 11%, #fff); }
    .topic-card.tk.soon h3 { border-color: transparent; box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
        background: linear-gradient(135deg, rgba(255,255,255,.95) 0%, color-mix(in srgb, var(--tk) 5%, #fff) 45%, color-mix(in srgb, var(--tk) 9%, #fff) 100%) padding-box,
            linear-gradient(120deg, color-mix(in srgb, var(--tk) 45%, #fff), color-mix(in srgb, var(--tk) 18%, #fff) 50%, color-mix(in srgb, var(--tk) 45%, #fff)) border-box; }
    .topic-card.soon .tk-name { animation: none; background-position: 0 0; }
    .topic-card.soon .tk-ic { filter: grayscale(.45); opacity: .85; }
    /* 🧭 Legal VA Foundational Track, where every trainee starts: its name looks embossed, raised off the pill (a light edge above,
       a soft shadow below), and the pill itself is gently bevelled (a highlight along its top, a shade along its foot) */
    .topic-card.tk-ft .tk-name { filter: drop-shadow(0 -1px 0 rgba(255,255,255,.95)) drop-shadow(0 1.5px 0 rgba(30,35,64,.28)) drop-shadow(0 3px 3px rgba(30,35,64,.22)); }
    .topic-card.tk-ft h3 { box-shadow: inset 0 2px 0 rgba(255,255,255,.95), inset 0 -3px 6px rgba(30,35,64,.12), 0 4px 10px -4px rgba(30,35,64,.35) !important; }
    /* ▪ The track-name pill, simplified: a plain black frame on white, no coloured border, sheen or glow (the name keeps its colour) */
    .topic-card h3, .topic-card.tk h3, .topic-card.soon h3, .topic-card.tk.soon h3 { border: 2px solid #111827; background: #fff; box-shadow: none; animation: none; }
    @media (prefers-reduced-motion: reduce) { .tk-name, .topic-card.tk.live h3, .topic-card.tk.live .tk-ic { animation: none; } .tk-name { background-position: 0 0; } }
    .topic-status { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 3px 9px; border-radius: 999px; display: inline-block; width: fit-content; }
    .topic-status.approved { background: #f0fdf4; color: #166534; }
    .topic-status.passed { background: #fff7ed; color: #9a3412; }
    .topic-status.pending { background: #fffbeb; color: #b45309; }
    .topic-status.locked { background: #f1f5f9; color: #334155; }
    .topic-status.denied { background: #fef2f2; color: #b91c1c; }
    /* ✨ The card's outline, as on the LSH course cards: a thick rounded frame, navy along the top fading to gold at the bottom.
       Nothing inside the card changes. A Coming Soon card's frame is the same, softer. */
    #idx-topics .topic-card { border: 4px solid transparent; border-radius: 18px;
        background: linear-gradient(#fff, #fff) padding-box, linear-gradient(180deg, #1E2340 0%, #2c3360 30%, #a8692f 78%, #DB8437 100%) border-box;
        box-shadow: 0 16px 30px -16px rgba(30,35,64,.45), 0 4px 10px -6px rgba(30,35,64,.2); }
    #idx-topics .topic-card.soon { background: linear-gradient(rgba(255,255,255,.9), rgba(255,255,255,.9)) padding-box, linear-gradient(180deg, rgba(30,35,64,.55) 0%, rgba(219,132,55,.55) 100%) border-box; box-shadow: none; }
    .topic-status.suspended, .topic-status.suspended-passed { background: #eef2ff; color: #3730a3; }
    .topic-action-btn {
        margin-top: auto; padding: 5px 14px; border-radius: 999px; border: none; font-weight: 700; font-size: 10.5px;
        text-transform: uppercase; letter-spacing: 0.03em; text-align: center; text-decoration: none; cursor: pointer;
    }
    .topic-action-btn.primary { background: var(--navy); color: var(--orange); }
    .topic-action-btn.request { background: var(--orange); color: #0f172a; }
    .topic-action-btn.disabled { background: #f1f5f9; color: #334155; cursor: default; }
    /* 📬 Your Daily Digest: the Flash Cards card is one button that opens today's card in a popup (the popup's styles are below). */
    .tool-card { padding: clamp(6px, 1vh - 2px, 12px); }
    .tool-card .dd-open { grid-column: 1 / -1; grid-row: 1 / -1; align-self: stretch; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(4px, .8vh, 9px);
        border: 2px solid #ecc98a; border-radius: 10px; background: linear-gradient(135deg, #fffdf7 0%, #fdf2dc 45%, #f7dfb0 100%); color: var(--navy-deep); cursor: pointer; font: inherit; padding: 6px 10px; box-shadow: inset 5px 0 0 var(--orange); transition: transform .15s ease, box-shadow .15s ease; }
    .tool-card .dd-open:hover { transform: translateY(-2px); box-shadow: inset 5px 0 0 var(--orange), 0 10px 20px -12px rgba(160,100,30,.45); }
    .tool-card .dd-open:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
    .dd-open .dd-t { font-size: clamp(13px, 1.9vh, 20px); font-weight: 900; letter-spacing: .01em; white-space: nowrap; }
    .dd-open .dd-c { font-size: clamp(10.5px, 1.3vh, 13px); font-weight: 800; color: #0f172a; background: var(--orange); border-radius: 999px; padding: 3px 14px; white-space: nowrap; }
    /* The popup: today's one card (flashcards-data.js one()), a daily dose rather than a stack, in the banners' elite look:
       a navy header with the gold title, the question, and the answer
       behind a gold Reveal button. */
    #dd-pop { position: fixed; inset: 0; z-index: 9000; display: none; align-items: center; justify-content: center; background: rgba(6,10,22,.62); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); padding: 16px; }
    #dd-pop.open { display: flex; }
    #dd-pop .dd-box { width: min(680px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; border-radius: 18px; background: #fffdf8; border: 1px solid rgba(245,196,81,.55);

    // Opening a program asks the Portal to vouch for you (/api/launch), which needs a live Portal session. A Portal tab that sat in the
    // background has its heartbeat slowed by the browser, so the session can look timed out right when you click. Wake it first, then go.
    document.addEventListener('click', function (e) {
        const a = e.target && e.target.closest ? e.target.closest('a[href^="/api/launch"]') : null;
        if (!a || e.defaultPrevented || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey) return;
        e.preventDefault();
        const w = a.target === '_blank' ? window.open('', '_blank') : null;   // opened at once, so a popup blocker doesn't stop it
        if (w) { try { w.opener = null; } catch (err) { /* keep going */ } }
        const go = () => { if (w) w.location.href = a.href; else location.href = a.href; };
        const ctl = typeof AbortController === 'function' ? new AbortController() : null;
        const timer = setTimeout(() => { if (ctl) ctl.abort(); }, 3000);
        let who = '';
        try { const sess = typeof getSession === 'function' ? getSession() : null; who = (sess && (sess.fullName || sess.username)) || ''; } catch (err) { /* no name needed */ }
        fetch('/api/heartbeat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', signal: ctl ? ctl.signal : undefined,
            body: JSON.stringify({ fullName: who, currentCase: 'Opening a program' }) })
            .catch(() => {}).finally(() => { clearTimeout(timer); go(); });
    }, true);
    // An admin in 👁 trainee view (Switch view) opens a program the way a trainee sees it, too (&view=trainee)
    const programHref = (key) => SSO_PROGRAMS.includes(key) ? '/api/launch?program=' + encodeURIComponent(key) + (PortalNav.traineeView() ? '&view=trainee' : '') : null;

    // Display names that replace the topics table's `name`, so a program can
    // be renamed without editing the live database. topics_seed.sql carries
    // the same names for new databases.
    // Every card ends in "Track" (was "Playbook", and "Training" before that); the
    // section badges above them say Playbooks.
    const PROGRAM_NAMES = {
        'STANDARD TRAINING': 'Legal VA Foundational Track',
        // The live topics table still carries the old "CM Training" / "Revised CM Training"
        // from before the rename; these put the full names on the cards without a migration.
        'CM TRAINING': 'Case Management Track',
        'REVISED CM TRAINING': 'Revised Case Management Track',
        'EA  PA TRAINING-OUTSOURCED MANP': 'Executive/Personal Assistant Track',
        'REVISED EA PA TRAINING': 'Revised Executive/Personal Assistant Track',
        'CALENDAR MANAGEMENT TRAINING': 'Calendar Management Track',
        'PROPERTY DAMAGE': 'Property Damage Claims Track',
        'MEDSUM AND DEMAND': 'Medsum & Demand Track',
        'LIEN NEGOTIATION': 'Lien Negotiator Track',
        'HEALTH SUBRO': 'Health Subro Track',
        'LIEN VERIFICATION': 'Lien Verification Track',
        'LITIGATION': 'Litigation Track',
        'MASS TORT': 'Mass Tort Track',
        'BUSINESS LAW': 'Business Law Track',
        'ESTATE PLANNING': 'Estate Planning Track',
        'FAMILY LAW': 'Family Law Track',
        'IMMIGRATION LAW': 'Immigration Law Track',
        'INTELLECTUAL PROPERTY LAW': 'Intellectual Property Law Track',
        'REAL ESTATE LAW': 'Real Estate Law Track',
        'FREE UPSKILL PROGRAMS': 'Communication Mastery Track',
        'SETTLEMENTS CLOSING': 'Closing Specialist Track',
        'CLIENT INTERVIEW PREP': 'Client Matching Essentials',
        'SOCIAL MEDIA MANAGEMENT': 'Social Media Management Track',
        'BOOKKEEPING': 'Bookkeeping Track',
        'LEAD GENERATION OUTREACH': 'Lead Generation & Outreach Track',
        'AUTOMATION UPSKILL': 'Automation Upskill Track',
        'WEBSITE MANAGEMENT': 'Website Management Track',
        'FLASH CARDS': 'Flash Cards'
    };

    // 🎨 Each track's identity on the LSH Academy Index: [emblem, colour]. The colours are dark enough to read as text
    // on the white card (the name is drawn in its track's colour, with a light shimmer passing over it).
    const TRACK_LOOK = {
        'STANDARD TRAINING': ['🧭', '#1d4ed8'], 'LIEN NEGOTIATION': ['🤝', '#b45309'], 'MEDSUM AND DEMAND': ['🩺', '#be123c'],
        'CM TRAINING': ['🗂', '#0f766e'], 'REVISED CM TRAINING': ['🗂', '#0f766e'], 'PROPERTY DAMAGE': ['🏠', '#c2410c'],
        'HEALTH SUBRO': ['💊', '#7e22ce'], 'LIEN VERIFICATION': ['🔎', '#0369a1'], 'SETTLEMENTS CLOSING': ['💰', '#15803d'],
        'LITIGATION': ['⚖️', '#334155'], 'MASS TORT': ['🏭', '#9f1239'], 'BUSINESS LAW': ['💼', '#1e40af'],
        'ESTATE PLANNING': ['📜', '#92400e'], 'FAMILY LAW': ['👪', '#be185d'], 'IMMIGRATION LAW': ['🌎', '#0e7490'],
        'INTELLECTUAL PROPERTY LAW': ['💡', '#6d28d9'], 'REAL ESTATE LAW': ['🏢', '#166534'],
        'EA  PA TRAINING-OUTSOURCED MANP': ['🗓', '#a16207'], 'REVISED EA PA TRAINING': ['🗓', '#a16207'],
        'FREE UPSKILL PROGRAMS': ['🚀', '#0e7490'], 'CLIENT INTERVIEW PREP': ['🎙', '#4338ca'], 'CALENDAR MANAGEMENT TRAINING': ['📅', '#1d4ed8'],
        'SOCIAL MEDIA MANAGEMENT': ['📣', '#c026d3'], 'BOOKKEEPING': ['📒', '#4d7c0f'], 'LEAD GENERATION OUTREACH': ['🎯', '#dc2626'],
        'AUTOMATION UPSKILL': ['⚡', '#ca8a04'], 'WEBSITE MANAGEMENT': ['🌐', '#2563eb']
    };

    // Programs shown on the index that aren't in the live topics table yet.
    // Added to the list only when the database doesn't already have the key,
    // so seeding it later (topics_seed.sql carries it) changes nothing here.
    // Not in TOPIC_SEQUENCE: free programs aren't gated behind progression.
    // It opens once it is in functions/_programs.js and launch.js (its own site).
    const EXTRA_PROGRAMS = [
        { key: 'FREE UPSKILL PROGRAMS', name: 'Communication Mastery Track', sort_order: 0 },
        { key: 'LIEN NEGOTIATION', name: 'Lien Negotiator Track', sort_order: 13 },
        { key: 'SETTLEMENTS CLOSING', name: 'Closing Specialist Track', sort_order: 13 },
        { key: 'CLIENT INTERVIEW PREP', name: 'Client Matching Essentials', sort_order: 0 },
        // Beyond-Legal Skills, Coming Soon (no site yet, so not in functions/_programs.js)
        { key: 'SOCIAL MEDIA MANAGEMENT', name: 'Social Media Management Track', sort_order: 0 },
        { key: 'BOOKKEEPING', name: 'Bookkeeping Track', sort_order: 0 },
        { key: 'LEAD GENERATION OUTREACH', name: 'Lead Generation & Outreach Track', sort_order: 0 },
        { key: 'AUTOMATION UPSKILL', name: 'Automation Upskill Track', sort_order: 0 },
        { key: 'WEBSITE MANAGEMENT', name: 'Website Management Track', sort_order: 0 },
        { key: 'FLASH CARDS', name: 'Flash Cards', sort_order: 0 }
    ];
    // Portal pages anyone can open from a card, with no access request: they live on this site.
    // 🃏 Flash Cards: one flash card a day on its own card (decks in flashcards-data.js); flashcards.html has the full digest.
    const PORTAL_TOOLS = { 'FLASH CARDS': '/flashcards.html' };
    const toolCard = (t) => `
                <div class="topic-card tool-card">
                    <button type="button" class="dd-open" onclick="openDailyDigest()" aria-haspopup="dialog" title="Today's flash card: one a day, a few minutes of the legal industry">
                        <span class="dd-t">📬 Your Daily Digest</span><span class="dd-c">Click Here</span>
                    </button>
                </div>`;
    // 📬 Your Daily Digest: a daily dose, not a stack. One card a day (flashcards-data.js one(): the same card for everyone
    // today, from the next deck in turn: Rules, Trivia, Terminologies, Process, FAQs), so trainees get familiar with the
    // legal industry a little at a time without leaving their training. A Terminologies card asks what its term means;
    // the answer (a short paragraph: what to do, why, and a tip) stays behind a Reveal button so they think first.
    function openDailyDigest() {
        const F = window.LSH_FLASHCARDS; if (!F) return;
        let pop = document.getElementById('dd-pop');
        if (!pop) {
            pop = document.createElement('div'); pop.id = 'dd-pop'; pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-modal', 'true'); pop.setAttribute('aria-labelledby', 'dd-title');
            document.body.appendChild(pop);
            pop.addEventListener('click', (ev) => { if (ev.target === pop || ev.target.closest('.dd-x')) closeDailyDigest();
                const b = ev.target.closest('.dd-show'); if (b) { const a = b.nextElementSibling; a.hidden = false; b.remove(); } });
            document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && pop.classList.contains('open')) closeDailyDigest(); });
        }
        const when = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
        const { deck, i } = F.one(), [q, a] = deck.cards[i], next = F.one(F.day() + 1).deck;
        const ask = deck.id === 'terms' ? `What does “${q}” mean?` : q;
        pop.innerHTML = `<div class="dd-box"><div class="dd-head"><h2 id="dd-title">📬 Your Daily Digest</h2><button type="button" class="dd-x" aria-label="Close">✕</button>
                <p class="dd-sub">${escapeHtml(when)} · today's card, a minute of the legal industry</p></div>
            <div class="dd-body"><span class="dd-deck">${escapeHtml(deck.icon + ' ' + deck.label)}</span><p class="dd-q">${escapeHtml(ask)}</p>
                <button type="button" class="dd-show">✦ Reveal answer</button><p class="dd-a" hidden>${escapeHtml(a)}</p></div>
            <div class="dd-foot"><span>Think of your answer first, then reveal it.</span><span>Tomorrow: <b>${escapeHtml(next.icon + ' ' + next.label)}</b></span></div></div>`;
        pop.classList.add('open');
        const x = pop.querySelector('.dd-x'); if (x) x.focus();
    }
    function closeDailyDigest() { const pop = document.getElementById('dd-pop'); if (pop) pop.classList.remove('open'); const b = document.querySelector('.tool-card .dd-open'); if (b) b.focus(); }
    // Shown first on the index, ahead of the progression, with a "Free" badge.
    const PINNED_PROGRAMS = ['FREE UPSKILL PROGRAMS'];

    // Fixed VA progression order — display order only now: the topics API
    // no longer gates by sequence (its old gated copy is gone). Anything
    // NOT in this list (Handouts, Training Tools and Resources, Other
    // Resources) is reference material, not a gated training — always
    // freely requestable regardless of progression.
    const TOPIC_SEQUENCE = [
        'STANDARD TRAINING', 'LITIGATION', 'MEDSUM AND DEMAND', 'CM TRAINING',
        'EA  PA TRAINING-OUTSOURCED MANP', 'REVISED EA PA TRAINING', 'REVISED CM TRAINING',
        'BUSINESS LAW', 'ESTATE PLANNING', 'FAMILY LAW',
        'HEALTH SUBRO', 'IMMIGRATION LAW', 'INTELLECTUAL PROPERTY LAW', 'LIEN VERIFICATION', 'LIEN NEGOTIATION', 'SETTLEMENTS CLOSING',
        'MASS TORT', 'PROPERTY DAMAGE', 'REAL ESTATE LAW'
    ];

    // The number of registrations waiting for approval, on the 📝 Registrations link (admins only).
    async function showPendingRegistrations() {
        try {
            const res = await fetch('/api/users', { credentials: 'include' });
            if (!res.ok) return;
            const users = await res.json();
            const n = (Array.isArray(users) ? users : []).filter(u => u.status === 'Pending' && u.userType === 'Trainee').length;
            const b = document.getElementById('idx-reg-badge');
            if (b && n > 0) { b.textContent = n; b.classList.add('has'); }
        } catch (e) { /* no badge */ }
    }
    window.showPendingRegistrations = showPendingRegistrations;
    setInterval(() => { if (document.getElementById('idx-reg-badge') && !document.getElementById('idx-reg-badge').dataset.done) { document.getElementById('idx-reg-badge').dataset.done = '1'; showPendingRegistrations(); } }, 800);

    let __topicsCache = [];
    let __accessCache = [];

    async function loadTrainingIndex() {
        // Trainees and admins sign in on this portal. A trainee's session opens the programs from here
        // (no second sign-in inside them); an admin's adds the approval queue and Master Control link.
        let stored = getSession();
        if (!stored) {   // a new tab (back from a program, a bookmark): the cookie says who is signed in even though this tab has no copy yet
            try {
                const me = await fetch('/api/me', { credentials: 'include', cache: 'no-store' });
                if (me.ok) { const d = await me.json(); if (d && d.user) { setSession(d.user); stored = d.user; if (typeof startHeartbeat === 'function') startHeartbeat(); } }
            } catch (e) { /* signed out: the directory shows its public view */ }
        }
        const session = (stored && (stored.userType === 'Admin' || stored.userType === 'Trainee')) ? stored : { userType: 'Public' };
        // 👁 Switch view: an admin looking at the Directory as a trainee does (no approval queue, no admin heading).
        const asTrainee = session.userType === 'Admin' && PortalNav.traineeView();

        if (session.userType === 'Admin') {
            const userEl = document.getElementById('idx-user');
            // One admin bar on every main page (portal-nav.js); everything else is under System Management.
            if (userEl) userEl.innerHTML = PortalNav.adminHtml('', { back: '/index.html?stay=1', blueprintMenu: true });
            // 📢 the announcement is edited in Master Control → Broadcast & Ping: ✏️ Edit on the ticker goes straight there
            if (!asTrainee) { const tk = document.getElementById('announcement-ticker'); if (tk && !document.getElementById('idx-ann-edit')) tk.insertAdjacentHTML('afterend', '<a id="idx-ann-edit" href="/core.html#announce" title="Edit the announcement (Master Control → Broadcast &amp; Ping)" style="flex:none;padding:3px 10px;border:1px solid rgba(253,186,116,.6);border-radius:999px;color:#fdba74;font-size:11.5px;font-weight:700;text-decoration:none;white-space:nowrap">✏️ Edit</a>'); if (window.OnlineNow) OnlineNow.mount(document.getElementById('idx-ann-edit')); }
            if (asTrainee) document.querySelector('.idx-top').insertAdjacentHTML('afterend',
                `<div class="pn-trainee-view">👁 Trainee view: LSH Academy Index as trainees see it.<button type="button" onclick="PortalNav.switchView()">Back to the admin view</button></div>`);
        }

        if (session.userType === 'Trainee') {
            const userEl = document.getElementById('idx-user');
            if (userEl) userEl.innerHTML = PortalNav.traineeHtml('', { back: '/index.html?stay=1', signedIn: true });
        }

        // The hero bar is gone; the page's name lives in the top bar, so the admin view renames that.
        const headingEl = document.querySelector('.idx-title');
        const subheadEl = document.getElementById('idx-subhead');
        if ((session.userType !== 'Admin' || asTrainee) && subheadEl) subheadEl.textContent = 'Every LSH training program in one place. Trainees log in once here, then open each program from this page: no separate sign-in inside it.';
        if (session.userType === 'Admin' && !asTrainee) {
            if (headingEl) headingEl.innerHTML = 'LSH Academy <span>Index</span> — Admin View';
            if (subheadEl) subheadEl.style.display = 'none';
        }

        try {
            const res = await fetch('/api/topics', { credentials: 'include' });
            const data = await res.json();
            if (!data.success) throw new Error(data.error || 'Failed to load the training index.');
            __topicsCache = (data.topics || []).map(t => PROGRAM_NAMES[t.key] ? { ...t, name: PROGRAM_NAMES[t.key] } : t);
            EXTRA_PROGRAMS.forEach(x => { if (!__topicsCache.some(t => t.key === x.key)) __topicsCache.push({ ...x }); });
            __accessCache = data.access || [];
            SSO_PROGRAMS = Array.isArray(data.programs) ? data.programs : [];
            if (!asTrainee) renderQueue(session);
            renderTopics(session);
            startLiveAccess(session);
        } catch (e) {
            const grid = document.getElementById('idx-topics');
            if (grid) grid.innerHTML = `<div style="grid-column:1/-1; font-size:13px; color:#b91c1c; padding:20px; background:#fff; border-radius:12px;">${escapeHtml(e.message)}</div>`;
        }
    }

    // 🙋 Access requests (admins): every trainee waiting to open a program or tool, as a table at the top of the Directory,
    // with Approve / Deny. The same list, with Suspend / Restore / Revoke for access already given, is Master Control's
    // 🙋 Access Requests (core.html#access-requests), linked from here and from the System Management menu.
    let __queueUsers = null;
    async function queueUsers() {
        if (__queueUsers) return __queueUsers;
        try { const r = await fetch('/api/users', { credentials: 'include' }); const d = r.ok ? await r.json() : []; __queueUsers = Array.isArray(d) ? d : []; }
        catch (e) { __queueUsers = []; }
        return __queueUsers;
    }
    async function renderQueue(session) {
        const wrap = document.getElementById('idx-queue-wrap');
        if (!wrap) return;
        if (session.userType !== 'Admin') { wrap.innerHTML = ''; return; }

        const topicName = key => (__topicsCache.find(t => t.key === key) || {}).name || key;
        const pending = __accessCache.filter(a => a.status === 'Pending')
            .sort((a, b) => String(a.requested_at || '').localeCompare(String(b.requested_at || '')));
        const badge = document.getElementById('idx-access-badge');
        if (badge) { badge.textContent = pending.length || ''; badge.classList.toggle('has', pending.length > 0); }
        // (Marking a program as passed, suspending and restoring live in the admin screen: Program Access.)
        if (!pending.length) { wrap.innerHTML = ''; return; }
        const users = await queueUsers();
        const when = v => { if (!v) return ''; const d = new Date(String(v).replace(' ', 'T') + (/[zZ]$/.test(String(v)) ? '' : 'Z')); return isNaN(d) ? escapeHtml(v) : d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); };
        wrap.innerHTML = `
            <div class="queue-card" id="access-requests">
                <div class="queue-head"><h3>🙋 Access Requests waiting (${pending.length})</h3><a href="/core.html#access-requests">Open in Master Control &rarr;</a></div>
                <div class="queue-wrap"><table class="queue-table">
                    <thead><tr><th>Trainee</th><th>Batch</th><th>Program / tool</th><th>Requested</th><th style="text-align:right;">Decision</th></tr></thead>
                    <tbody>${pending.map(a => {
                        const u = users.find(x => x.username === a.trainee_username);
                        const k = escapeHtml(a.topic_key), n = escapeHtml(a.trainee_username);
                        return `<tr>
                            <td><b>${escapeHtml(u ? u.fullName : a.trainee_username)}</b><br><span class="sub">${n}</span></td>
                            <td class="sub">${u && typeof batchLabel === 'function' ? escapeHtml(batchLabel(u.batchId)) : ''}</td>
                            <td>${escapeHtml(topicName(a.topic_key))}</td>
                            <td class="sub">${when(a.requested_at)}</td>
                            <td><span class="queue-actions">${u
                                ? `<button class="queue-btn approve" onclick="decideTopicAccess('${k}','${n}','APPROVE')">Approve</button>
                                   <button class="queue-btn deny" onclick="decideTopicAccess('${k}','${n}','DENY')">Deny</button>`
                                : `<span class="sub">No account any more</span><button class="queue-btn deny" onclick="decideTopicAccess('${k}','${n}','CLEAR')">Clear</button>`}</span></td>
                        </tr>`;
                    }).join('')}</tbody>
                </table></div>
            </div>`;
    }

    // Archived — old/superseded modules kept in the database (and in any
    // trainee's history) but hidden from the active LSH Academy Index. Purely
    // a display-level exclusion; nothing is deleted.
    const ARCHIVED_TOPICS = ['REVISED CM TRAINING', 'REVISED EA PA TRAINING', 'CALENDAR MANAGEMENT TRAINING'];   // keep in step with PA_HIDDEN in app.js (same list; app.js loads into this page's global scope, so the names must differ)
    // Reference cards that aren't on the index either (they were the whole "More Training &
    // Resources" section, all Coming Soon). A program added later still shows up there.
    const HIDDEN_TOPICS = ['HANDOUTS', 'TRAINING TOOLS AND RESOURCES', 'OTHER RESOURCES'];

    // TOPIC_SEQUENCE was only being used for gating logic below, never for
    // the actual card order — so the grid was still showing the database's
    // original sort_order regardless of the stated progression. This sorts
    // by sequence position first (topics not in the sequence — Handouts,
    // Training Tools, Other Resources — fall to the end, in their original
    // relative order).
    function orderedTopics() {
        const seqIndex = key => { const i = TOPIC_SEQUENCE.indexOf(key); return i === -1 ? Infinity : i; };
        return __topicsCache
            .filter(t => !ARCHIVED_TOPICS.includes(t.key) && !HIDDEN_TOPICS.includes(t.key))
            .slice()
            .sort((a, b) => {
                const pa = PINNED_PROGRAMS.indexOf(a.key), pb = PINNED_PROGRAMS.indexOf(b.key);
                if (pa !== pb) return (pa === -1 ? Infinity : pa) < (pb === -1 ? Infinity : pb) ? -1 : 1;
                const ia = seqIndex(a.key), ib = seqIndex(b.key);
                // Compare directly: Infinity - Infinity is NaN, which left the
                // unsequenced cards (Handouts, Communication Mastery…) in random order.
                if (ia !== ib) return ia < ib ? -1 : 1;
                return (a.sort_order || 0) - (b.sort_order || 0);
            });
    }

    function renderTopics(session) {
        const grid = document.getElementById('idx-topics');
        if (!grid) return;
        const isAdmin = session.userType === 'Admin';

        // 🎨 Each track's own identity on its card: an emblem and a colour, with the name in that colour (TRACK_LOOK).
        const tkOpen = (t, live) => { const k = TRACK_LOOK[t.key], free = PINNED_PROGRAMS.includes(t.key) ? ' has-free' : ''; return k ? `<div class="topic-card tk${live ? ' live' : ' soon'}${free}${t.key === 'STANDARD TRAINING' ? ' tk-ft' : ''}" style="--tk:${k[1]};--tkd:${(t.key.length * 0.37) % 3}s">` : `<div class="topic-card${live ? '' : ' soon'}${free}">`; };
        const tkTitle = (t) => { const k = TRACK_LOOK[t.key];
            const line = k ? `<span class="tk-ic" aria-hidden="true">${k[0]}</span><span class="tk-name">${escapeHtml(t.name)}</span>` : escapeHtml(t.name);
            // the Free Upskill badge goes in the bottom row (.has-free), between the status and the action
            return `<h3>${line}</h3>` + (PINNED_PROGRAMS.includes(t.key) ? '<span class="topic-free">Free Upskill</span>' : ''); };
        const cardFor = (t) => {
            if (PORTAL_TOOLS[t.key]) return toolCard(t);
            const built = SSO_PROGRAMS.includes(t.key);
            const myAccess = isAdmin ? null : __accessCache.find(a => a.topic_key === t.key);
            const status = isAdmin ? 'approved' : (myAccess ? myAccess.status.toLowerCase() : 'locked');

            if (session.userType === 'Public') {
                return `
                ${tkOpen(t, !!built)}
                    ${tkTitle(t)}
                    <span class="topic-status ${built ? 'approved' : 'locked'}">${built ? 'Available' : 'Coming Soon'}</span>
                    ${built ? `<a class="topic-action-btn primary" href="/trainee-login.html">Log in to open &rarr;</a>` : `<span class="topic-action-btn disabled">Coming Soon</span>`}
                </div>`;
            }

            let statusLabel = { approved: 'Approved', passed: 'Completed', pending: 'Pending Approval', denied: 'Access Denied', locked: 'Not Yet Requested', suspended: 'Access Suspended', 'suspended-passed': 'Access Suspended' }[status];
            let actionHtml;

            // No required order: any built program can be requested at any time, and an admin approves it.

            if (!built) {
                actionHtml = `<span class="topic-action-btn disabled">Coming Soon</span>`;
            } else if (isAdmin || status === 'approved' || status === 'passed') {   // finished: the program stays open
                actionHtml = `<a class="topic-action-btn primary" href="${programHref(t.key)}" target="_blank" rel="noopener">Enter Program &rarr;</a>`;
            } else if (status === 'pending') {
                actionHtml = `<span class="topic-action-btn disabled">Awaiting Admin Approval</span>`;
            } else if (status.startsWith('suspended')) {   // ⏸ an admin paused it (Program Access → Suspend): no asking again until restored
                actionHtml = `<span class="topic-action-btn disabled" title="Your trainer suspended your access for now">Suspended: talk to your trainer</span>`;
            } else {
                // not requested yet, or denied: (re)request it
                actionHtml = `<button class="topic-action-btn request" onclick="requestTopicAccess('${escapeHtml(t.key)}')">Request Access</button>`;
            }

            return `
                ${tkOpen(t, !!built)}
                    ${tkTitle(t)}
                    <span class="topic-status ${status}">${isAdmin ? (built ? 'Available' : 'Coming Soon') : statusLabel}</span>
                    ${actionHtml}
                </div>
            `;
        };
        grid.className = 'topic-groups';
        grid.innerHTML = groupedTopicsHtml(cardFor);
        fitTrackTitles();
    }
    // One size for every track name; a name too long for its card on one line steps down (half a pixel at a time, to 9px at
    // the least) until it fits, and only that name.
    function fitTrackTitles() {
        document.querySelectorAll('#idx-topics .topic-card h3').forEach(h => {
            h.style.fontSize = ''; h.classList.remove('two-line');
            // a long name (Executive/Personal Assistant Track) goes onto two lines at the same size, if the card has the height
            if (h.scrollWidth > h.clientWidth + 1 && h.closest('.tg-beyond')) {
                h.classList.add('two-line');
                if (h.scrollHeight > h.clientHeight + 1 || h.scrollWidth > h.clientWidth + 1) h.classList.remove('two-line');
            }
            let px = parseFloat(getComputedStyle(h).fontSize);
            while (h.scrollWidth > h.clientWidth + 1 && px > 9) { px -= 0.5; h.style.fontSize = px + 'px'; }
        });
    }
    window.addEventListener('resize', () => { clearTimeout(window.__fitTitlesT); window.__fitTitlesT = setTimeout(fitTrackTitles, 120); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitTrackTitles());

    // The cards are grouped by practice area: everything personal injury is in one place.
    const TOPIC_GROUPS = [
        { title: 'Personal Injury Playbooks', note: '',
          keys: ['STANDARD TRAINING', 'LIEN NEGOTIATION', 'MEDSUM AND DEMAND', 'CM TRAINING', 'PROPERTY DAMAGE', 'HEALTH SUBRO', 'LIEN VERIFICATION', 'SETTLEMENTS CLOSING'] },
        { title: 'Cross-Practice Playbooks', note: '',
          keys: ['LITIGATION', 'MASS TORT', 'BUSINESS LAW', 'ESTATE PLANNING', 'FAMILY LAW', 'IMMIGRATION LAW', 'INTELLECTUAL PROPERTY LAW', 'REAL ESTATE LAW'] },
        { title: 'Beyond-Legal Skills', note: '',
          keys: ['EA  PA TRAINING-OUTSOURCED MANP', 'FREE UPSKILL PROGRAMS', 'CLIENT INTERVIEW PREP',
                 'SOCIAL MEDIA MANAGEMENT', 'BOOKKEEPING', 'LEAD GENERATION OUTREACH', 'AUTOMATION UPSKILL', 'WEBSITE MANAGEMENT', 'FLASH CARDS'] }
    ];
    // How many across, so a group's last row is not a stub. Four is the default
    // and the widest the cards look right at; three when the count divides by
    // three and not by four. Personal Injury Playbooks' eight reads 4 + 4;
    // Cross-Practice Playbooks' eight stays 4 + 4. A group of more than eight (Beyond-Legal Skills' nine)
    // takes two rows, five + four, so the directory still fits one screen.
    const columnsFor = (n) => (n > 8 ? Math.ceil(n / 2) : n % 4 === 0 ? 4 : n % 3 === 0 ? 3 : 4);

    function groupedTopicsHtml(cardFor) {
        const all = orderedTopics();
        const used = new Set();
        const sections = TOPIC_GROUPS.map(g => {
            const cards = g.keys.map(k => all.find(t => t.key === k)).filter(Boolean);
            cards.forEach(t => used.add(t.key));
            return { title: g.title, note: g.note, cards };
        });
        // anything not named above (new programs, reference material) goes last, so nothing disappears
        const rest = all.filter(t => !used.has(t.key));
        if (rest.length) sections.push({ title: 'More Training & Resources', note: '', cards: rest });
        return sections.filter(sec => sec.cards.length).map(sec =>
            `<section class="topic-group${sec.title === 'Beyond-Legal Skills' ? ' tg-beyond' : ''}" style="--rows:${Math.ceil(sec.cards.length / columnsFor(sec.cards.length))}"><div class="topic-group-head"><h2>${escapeHtml(sec.title)}</h2>${sec.note ? `<span>${escapeHtml(sec.note)}</span>` : ''}</div>`
            + `<div class="topic-grid${columnsFor(sec.cards.length) === 3 ? ' cols-3' : ''}" style="--cols:${columnsFor(sec.cards.length)}">${sec.cards.map(cardFor).join('')}</div></section>`).join('');
    }

    // Live access: while a trainee has a request waiting for approval, the page asks for the latest every 12 seconds (only while the tab is
    // in view, and again the moment they come back to it), so an approved program turns into "Enter Program" without a refresh.
    let __liveTimer = null, __liveSession = null;
    const sameAccess = (a, b) => JSON.stringify((a || []).map(x => x.topic_key + ':' + x.status).sort()) === JSON.stringify((b || []).map(x => x.topic_key + ':' + x.status).sort());
    function startLiveAccess(session) {
        if (__liveTimer) { clearInterval(__liveTimer); __liveTimer = null; }
        __liveSession = session;
        if (!session || session.userType !== 'Trainee') return;
        if (!__accessCache.some(a => String(a.status).toLowerCase() === 'pending')) return;
        __liveTimer = setInterval(checkAccessNow, 12000);
    }
    async function checkAccessNow() {
        if (document.hidden || !__liveSession) return;
        try {
            const res = await fetch('/api/topics', { credentials: 'include', cache: 'no-store' });
            if (!res.ok) return;
            const data = await res.json();
            if (!data.success) return;
            const next = data.access || [];
            if (sameAccess(__accessCache, next)) return;
            const nameOf = key => ((__topicsCache.find(t => t.key === key) || {}).name) || key;
            next.forEach(n => {
                const was = __accessCache.find(a => a.topic_key === n.topic_key);
                const now = String(n.status).toLowerCase(), before = was ? String(was.status).toLowerCase() : '';
                if (before === 'pending' && (now === 'approved' || now === 'passed')) showToast('Approved: you can now open ' + nameOf(n.topic_key) + '.', 'success');
                else if (before === 'pending' && now === 'denied') showToast('Your request for ' + nameOf(n.topic_key) + ' was not approved.', 'error');
            });
            __accessCache = next;
            renderTopics(__liveSession);
            startLiveAccess(__liveSession);
        } catch (e) { /* try again on the next tick */ }
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden && __liveTimer) checkAccessNow(); });

    async function requestTopicAccess(topicKey) {
        try {
            await postJson('/api/topics', { action: 'REQUEST_ACCESS', topicKey });
            showToast('Access requested — an admin will review it.', 'success');
            loadTrainingIndex();
        } catch (e) {
            showToast(e.message, 'error');
        }
    }

    async function decideTopicAccess(topicKey, traineeUsername, action) {
        try {
            await postJson('/api/topics', { action, topicKey, traineeUsername });
            showToast(action === 'APPROVE' ? 'Access approved.' : action === 'CLEAR' ? 'Request cleared.' : 'Access denied.', 'success');
            loadTrainingIndex();
        } catch (e) {
            showToast(e.message, 'error');
        }
    }

    document.addEventListener('DOMContentLoaded', loadTrainingIndex);
</script>
</body>
</html>
