# Runs on every pull request and every push to main. A failure shows as a red
# "Checks" status on the PR/commit with a readable log, and GitHub emails the
# person who pushed. Nothing here deploys.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Syntax, files and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: JavaScript syntax, local files, JSON
        run: node .github/scripts/check-site.mjs
      - name: Build the Pages Functions without deploying
        run: npx --yes wrangler@3 pages functions build --outdir "$RUNNER_TEMP/dist"

  smoke:
    name: Smoke test in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Open every page and simulator (desktop and phone)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/smoke.cjs
      - name: Server requests from an open page (one /api/live every 20 s, heartbeat every 30 s)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/requests.cjs
      - name: Server request meter (admins only; every level; sparing)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          node .github/scripts/request-meter-widget.cjs request-budget.js
          node .github/scripts/request-meter.cjs
