<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulators — LSH Training Portal</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/simulators/sim.css">
<style>
    /* The hub is meant to be taken in at a glance: on a desktop screen the seven
       cards sit above the fold, so the page does not scroll to show a simulator. */
    .hub-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 1000px) { .hub-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 620px) { .hub-grid { grid-template-columns: 1fr; } }
    .hub-card { display: flex; flex-direction: column; gap: 10px; }
    .hub-card .icon { width: 48px; height: 48px; border-radius: 14px; background: #fff7ed; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .hub-card h3 { margin: 0; font-size: 17px; font-weight: 900; }
    .hub-card p { margin: 0; font-size: 13.5px; font-weight: 500; color: var(--slate); line-height: 1.55; flex: 1; }
    .hub-card .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; }
    .hub-card .uses { font-size: 11.5px; color: var(--slate); font-weight: 800; }
    .hub-card.soon { background: #fbfaf7; }
    /* the hub uses the window's whole width (a 24px gutter), not the simulators' centred 1280px column */
    .sim-wrap.hub-wrap { max-width: none; }
    .hub-wrap .sim-hero p { max-width: none; }

    /* One screen: a room-sized window (wide enough for four columns, tall enough
       for two rows of cards) gets the compact hub — four across, a shorter hero and
       each description cut to a few lines, with the whole text on hover. Anything
       smaller keeps the roomy layout and scrolls as before. */
    @media (min-width: 1180px) and (min-height: 700px) {
        .sim-wrap { padding-bottom: 28px; }
        .sim-hero { padding: 18px 24px; margin-bottom: 16px; }
        .sim-hero .eyebrow { margin-bottom: 8px; padding: 3px 10px; font-size: 11px; }
        .sim-hero h1 { font-size: 23px; margin-bottom: 5px; }
        .sim-hero p { font-size: 13px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .hub-grid { grid-template-columns: repeat(4, 1fr); gap: 13px; }
        .sim-card.hub-card { padding: 15px; gap: 8px; }
        .hub-card .icon { width: 38px; height: 38px; border-radius: 11px; font-size: 19px; }
        .hub-card h3 { font-size: 15.5px; }
        .hub-card p { font-size: 12.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
        .hub-card .row { margin-top: 2px; }
        .hub-card .uses { font-size: 11px; }
        .hub-card .sim-btn { padding: 7px 14px; font-size: 12.5px; }
    }
    @media (min-width: 1180px) and (min-height: 700px) and (max-height: 820px) {
        .hub-card p { -webkit-line-clamp: 4; }
    }
    @media (min-width: 1180px) and (min-height: 700px) and (max-height: 740px) {
        .sim-wrap { padding-top: 22px; padding-bottom: 20px; }
        .sim-hero { padding: 14px 22px; margin-bottom: 12px; }
        .hub-card p { -webkit-line-clamp: 3; }
    }
</style>
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div id="topbar"></div>
<div class="sim-wrap hub-wrap">
    <section class="sim-hero">
        <div class="eyebrow">Shared across every program</div>
        <h1>Simulators</h1>
        <p>Hands-on tools every LSH program can use — Case Management, EA/PA and the specialised trainings. Pick a simulator, work a realistic scenario, and get a scored debrief. Your results are saved to your account.</p>
    </section>

    <div class="hub-grid" id="hub-grid"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="/app.js"></script>
<script src="/portal-nav.js"></script>
<script src="/portal.js"></script>
<script src="/simulators/sim.js"></script>
<script>
    const SIMULATORS = [
        { id: 'call', icon: '📞', title: 'Call Simulator', status: 'live', href: '/api/launch?tool=ringchannel&to=calls', uses: 'Standard · CM · PD · EA/PA · all programs',
          desc: 'Real phone calls on ☎ LSH Ring Channel, the training phone (it opens there, already signed in): the phone rings, the caller speaks, you answer out loud with your headset (or type), and use the phone\'s own keys — mute, hold, transfer — on the line the call comes in on. Reception and Calendar Management ring the Main Line, Intake the Intake Line; the case files are in 🔎 Case lookup. Practice with an AI caller, or take a graded call: a caller you don\'t see first, graded on your line\'s Mock Calls Metrics, and it counts in your course. Your trainer can also ring you for a live mock call on the same phone.' },
        { id: 'messaging', icon: '💬', title: 'Client Messaging', status: 'live', href: '/api/launch?tool=ringchannel&to=messages', uses: 'Reception · Intake · CM · Medsum and Demand · PD · EA/PA',
          desc: 'Text with clients the way a case management system does it, on ☎ LSH Ring Channel (it opens there, already signed in): a text lands on the client\'s file in its 💬 Messages tab and you answer it from the file, in your program\'s role. A client who lost an appointment card, a "cousin" who isn\'t on the file, an unknown number, a STOP, a client in danger, an offer they want you to decide, storage fees, a mediation time. Verify before you share, follow the firm\'s texting policy, use the quick replies, log the Case Note. Practice with coaching, or take it graded: scored on the Client Messaging scorecard, and it counts in your course.' },
        { id: 'automessaging', icon: '🤖', title: 'Automated Messaging', status: 'live', href: '/api/launch?tool=ringchannel&to=automessages', uses: 'Standard · CM · PD · EA/PA · Medsum and Demand',
          desc: 'The firm\'s automated messaging, on ☎ LSH Ring Channel (it opens there, already signed in): an automation texts a client — an appointment reminder, the intake auto-responder, a records chaser, a settlement-check notice — the client texts back, and you take the thread from there. The automation keeps sending on its own schedule whether or not you have replied, so you are answering a conversation that is already moving: read what has landed, verify before you share, keep advice and figures off text, and leave the client with a clear next step. The case files are in 🔎 Case lookup and the firm\'s texting policy is beside the thread. Practice, or take it graded: scored on the Client Messaging Metrics, and it counts in your course.' },
        { id: 'calsim', icon: '📆', title: 'Calendaring Simulators', status: 'live', href: '/simulators/calsim.html', uses: 'Foundational · CM · EA/PA',
          desc: 'All the calendaring practice in one place: the Google Calendar Simulator for each program. 🎓 Standard Training (Foundational · Calendar Management), ⚖️ Litigation Week (Case Management) and 🏢 Executive Week (EA / PA). Callers ask for appointments: book them on the attorney\'s (or executive\'s) calendar under the rules, with the right title, description, Google Meet for video calls and an email reminder a day before, move or cancel what they ask, then check your calendar. Scores are saved for your trainer.' },
        { id: 'email', icon: '✉️', title: 'Email Simulators', status: 'live', href: '/simulators/email.html', uses: 'All programs · CM',
          desc: 'All the email practice in one place: the ✉️ Email Workspace, a Gmail-style practice inbox (a ready-made CM or EA/PA inbox, or one for any program) to triage, label, reply, forward and report phishing, and ✍️ Email Replies, one email at a time answered like at work (an upset client, an adjuster, a lien letter, your attorney, a phishing attempt), here or from your own inbox. Scored on filing, security, triage and writing, with a model reply.' },
        { id: 'docket', icon: '⚖️', title: 'Docket System', status: 'live', href: '/simulators/docket.html', uses: 'CM · Litigation · all programs',
          desc: 'Law-firm docketing. Court notices and mail arrive in an inbox: put what belongs on the court docket there and calendar every deadline it triggers, counted under federal (FRCP 6) or state rules, with a responsible attorney and reminders. Federal-style docket reports for every case, a firm calendar and a rules-based deadline calculator.' },
        { id: 'records', icon: '🗂', title: 'Medical Records Requests', status: 'live', href: '/simulators/records.html', uses: 'CM · Medsum and Demand',
          desc: 'A medical records request platform on the John Doe file. Check the HIPAA authorization, request records and itemized bills from the right departments for the right dates, and move the calendar forward. Handle what comes back: rejections, invoices over the fee cap, silence, partial ledgers and providers hiding in the records. Scored against the attorney\'s objectives.' },
        { id: 'drafting', icon: '✍️', title: 'Drafting', status: 'live', href: '/simulators/drafting.html', uses: 'Standard Foundational · CM',
          desc: 'Draft the firm\'s letters in the firm\'s own templates: the 1P Letter of Representation to the client\'s carrier and the 3P letter with affidavit to the defendant\'s. The page shows the letter the way Word has it — the firm\'s wording is fixed, and the blanks it highlighted in yellow are yours to fill, from the case notes beside you. The download is that same Word file with your answers written into it, letterhead and logo included, named the way the trainers ask, ready to upload to SA.' },
        { id: 'efiling', icon: '🏛', title: 'Court E-Filing', status: 'live', href: '/simulators/efiling.html', uses: 'CM · Litigation',
          desc: 'File like US courts require: a federal filing through electronic case filing (event, case, filer, linked entry, attachments, docket text) and state filings through an e-filing provider (filing code, parties, service contacts, fees). Fix the documents first: OCR, signatures, certificates of service, redaction, size limits, passwords. Then submit and see if the clerk accepts it.' }
    ];
    const CHIP = { live: ['live', 'Live'], next: ['next', 'Coming next'], plan: ['plan', 'Planned'], input: ['input', 'Needs input'] };

    function renderHub() {
        document.getElementById('topbar').innerHTML = Sim.topbar('hub');
        Sim.label('Simulators');
        document.getElementById('hub-grid').innerHTML = SIMULATORS.map(s => `
            <div class="sim-card hub-card ${s.status === 'live' ? '' : 'soon'}">
                <div class="row" style="margin-top:0;"><span class="icon">${s.icon}</span><span class="sim-chip ${CHIP[s.status][0]}">${CHIP[s.status][1]}</span></div>
                <h3>${Sim.esc(s.title)}</h3>
                <p title="${Sim.esc(s.desc)}">${Sim.esc(s.desc)}</p>
                <div class="row"><span class="uses">${Sim.esc(s.uses)}</span>
                    ${s.href ? `<a class="sim-btn primary" href="${s.href}">Open →</a>` : `<button class="sim-btn ghost" disabled>Not yet</button>`}</div>
            </div>`).join('');
    }

    // A new tab has the signed cookie but no copy of who in its own storage: ask first, so an admin gets the admin hub, and the heartbeat runs.
    document.addEventListener('DOMContentLoaded', async () => { await Sim.restore(); renderHub(); });
</script>
</body>
</html>
