# name: the Cloudflare Pages project this config belongs to. The site answers at cm-training-activity.pages.dev, and
# case-management-training.legalsupporthelp.workers.dev is a different service (the CM course Worker), so this name may
# not be the Pages project's. It is left as it is on purpose: the live site deploys from Git through the Pages dashboard,
# and renaming it here without confirming the project's real name in the dashboard could break those deploys. Never run
# `wrangler pages deploy` from this repo until it is confirmed (Workers & Pages → the project → its name).
name = "case-management-training"
# Moved from 2024-03-20 on 2026-11-19: `wrangler pages dev` answered the same on both dates for the front doors, admin
# and member pages, the attendance script, /api/launch, /api/me and the _redirects rules, and every check passes.
compatibility_date = "2025-06-01"
pages_build_output_dir = "./" 

# 1. OLD D1 DATABASE: Accounts, Logins, Registrations, Heartbeats
[[d1_databases]]
binding = "DB" 
database_name = "lshcasemanagementtraining-trainingcrmlogins"
database_id = "9b1afc1b-a26f-4fc2-aadf-acb9e704b75f"

# 2. NEW D1 DATABASE: Activities, Decks, Lectures, Submissions, Grades, Activity Logs
[[d1_databases]]
binding = "TRAINING_DB"
database_name = "lsh-training-activities-db"
database_id = "6d23429e-e69b-413b-b9fe-0e724f7992e7"

# 3. COURSE DATA: the KV namespace the course Workers use for trainees and progress
#    (EA/PA: "trainee:*", CM course: "cm:trainee:*"; every prefix in functions/_programs.js).
#    Admin → Trainee Progress (/progress.html, /api/program-progress) reads it. The Portal also
#    writes it: each program's access:blocked list (_ft-block.js), revoke's purge (_purge.js),
#    attendance (_attendance.js) and graded simulator / call results (api/sim-results.js, api/call-results.js).
[[kv_namespaces]]
binding = "COURSE_KV"
id = "b121aa911590471bbad351d03274d7f4"
