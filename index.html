<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CM Training Interface — Trainee Portal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="logo-row">
      <div class="logo-box">CM</div>
      <div class="logo-text">
        <div class="l1">CASE MANAGEMENT</div>
        <div class="l2">TRAINING INTERFACE</div>
      </div>
    </div>

    <div class="roletoggle" id="roleToggle">
      <button data-role="trainee" class="active">TRAINEE</button>
      <button data-role="admin">ADMIN</button>
    </div>

    <div>
      <div class="field-label">YOUR NAME</div>
      <input class="side-input" id="nameInput" type="text" placeholder="Enter your name" />
    </div>

    <div class="nav-label">TRAINING ACTIVITIES</div>
    <div class="nav-list" id="navList"></div>

    <div class="sidebar-spacer"></div>
    <button class="btn-full btn-green" id="primaryActionBtn">SUBMIT ANSWERS</button>
    <div class="signed-in" id="signedInBlock">Not signed in</div>
    <button class="btn-full btn-outline-red" id="logoutBtn">LOG OUT</button>
  </aside>

  <div style="flex:1; display:flex; flex-direction:column; min-width:0;">
    <div class="topbar">
      <span class="badge">CM</span>
      <span class="portal-title" id="portalTitle">CASE MANAGEMENT TRAINING INTERFACE — TRAINEE PORTAL</span>
      <span class="announce">ANNOUNCEMENT:</span>
      <span class="announce-text" id="announceText">Welcome to the CM Training Interface.</span>
      <span class="spacer"></span>
      <span class="clock" id="clock"></span>
      <select class="loc">
        <option>Manila</option>
        <option>Caloocan</option>
        <option>Quezon City</option>
      </select>
    </div>

    <div class="main">
      <div id="panel"></div>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
