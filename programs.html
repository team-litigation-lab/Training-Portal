<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Index — LSH TRC</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="styles.css">
<style>
    :root {
        --navy: #0f2148; --navy-deep: #081226; --navy-mid: #132a5c;
        --orange: #f97316; --orange-soft: #fb923c; --slate: #64748b; --paper: #faf8f4;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; font-family: 'IBM Plex Sans', Arial, Helvetica, sans-serif; background: var(--paper); color: var(--navy);
        /* styles.css (shared with core.html) sets body to height:100vh +
           overflow:hidden — correct for core.html's fixed "app shell" with
           its own internally-scrolling panels, but this page has no such
           inner scroll container, so inheriting that rule blocked the
           whole page from scrolling at all. Restored to normal flow. */
        height: auto; overflow: visible;
    }

    .idx-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; background: var(--navy-deep); }
    .idx-brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 800; font-size: 14px; }
    .idx-brand-mark { width: 34px; height: 34px; border-radius: 10px; background: #0f172a; border: 2px solid var(--orange); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
    .idx-brand-mark img { width: 100%; height: 100%; object-fit: cover; }
    .idx-user { display: flex; align-items: center; gap: 14px; }
    .idx-user-name { color: rgba(255,255,255,0.85); font-size: 12.5px; font-weight: 700; }
    .idx-logout { color: rgba(255,255,255,0.5); font-size: 12px; font-weight: 600; text-decoration: none; cursor: pointer; }
    .idx-logout:hover { color: #fff; }

    .idx-wrap { max-width: 1080px; margin: 0 auto; padding: 40px 24px 80px; }
    .idx-head { margin-bottom: 32px; }
    .idx-head .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--orange); margin-bottom: 8px; }
    .idx-head h1 { font-size: 28px; font-weight: 800; margin: 0 0 8px; }
    .idx-head p { font-size: 14px; color: var(--slate); margin: 0; max-width: 60ch; }

    .queue-card { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 16px; padding: 18px 20px; margin-bottom: 28px; }
    .queue-card h3 { font-size: 13px; font-weight: 800; color: #9a3412; margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.03em; }
    .queue-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid #fed7aa; font-size: 12.5px; }
    .queue-row:first-of-type { border-top: none; }
    .queue-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .queue-btn { padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; border: none; cursor: pointer; }
    .queue-btn.approve { background: #166534; color: #fff; }
    .queue-btn.deny { background: #fff; color: #b91c1c; border: 1px solid #fca5a5; }

    .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .topic-card { background: #fff; border-radius: 18px; padding: 20px; border: 1px solid rgba(15,33,72,0.06); box-shadow: 0 6px 18px rgba(15,33,72,0.05); display: flex; flex-direction: column; gap: 12px; }
    .topic-card h3 { font-size: 14.5px; font-weight: 800; margin: 0; color: var(--navy); }
    .topic-status { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 4px 10px; border-radius: 999px; display: inline-block; width: fit-content; }
    .topic-status.approved { background: #f0fdf4; color: #166534; }
    .topic-status.pending { background: #fffbeb; color: #b45309; }
    .topic-status.locked { background: #f1f5f9; color: #64748b; }
    .topic-status.denied { background: #fef2f2; color: #b91c1c; }
    .topic-action-btn {
        margin-top: auto; padding: 9px; border-radius: 999px; border: none; font-weight: 800; font-size: 11px;
        text-transform: uppercase; letter-spacing: 0.03em; text-align: center; text-decoration: none; cursor: pointer;
    }
    .topic-action-btn.primary { background: var(--navy); color: var(--orange); }
    .topic-action-btn.request { background: var(--orange); color: #0f172a; }
    .topic-action-btn.disabled { background: #f1f5f9; color: #94a3b8; cursor: default; }
</style>
</head>
<body>
<script>
    // Same guard pattern as core.html — no session, no index. Runs before
    // any content paints rather than waiting for app.js to load.
    (function () {
        try {
            const raw = sessionStorage.getItem('LSH_SESSION_V1') || localStorage.getItem('LSH_SESSION_V1');
            if (!raw || raw === 'null') window.location.replace('/bridge.html');
        } catch (e) { window.location.replace('/bridge.html'); }
    })();
</script>

<div class="idx-wrap">
    <div class="idx-head">
        <div class="eyebrow">All Programs</div>
        <h1 id="idx-heading">Your Training Index</h1>
        <p id="idx-subhead">Every program LSH runs, in one place. Programs you're approved for open directly; others need admin approval first.</p>
    </div>

    <div id="idx-queue-wrap"></div>
    <div id="idx-topics" class="topic-grid">
        <div style="grid-column:1/-1; font-size:13px; color:#94a3b8; padding:20px;">Loading programs...</div>
    </div>
</div>

<script src="app.js"></script>
<script src="portal.js"></script>
<script>
    // CM Training is the only program with a real, built portal so far —
    // everything else in the topics table is reference-only until its own
    // site exists (see the "(Each will be built soon)" plan). Keyed by the
    // exact `key` value seeded into the topics table.
    const BUILT_PROGRAMS = { 'CM TRAINING': 'https://lshcasemanagementtraining-trainingcrm.pages.dev/' };

    let __topicsCache = [];
    let __accessCache = [];

    async function loadTrainingIndex() {
        const session = getSession();
        if (!session) return;

        const nameEl = document.getElementById('idx-user-name');
        if (nameEl) nameEl.textContent = session.fullName || session.username;

        const headingEl = document.getElementById('idx-heading');
        const subheadEl = document.getElementById('idx-subhead');
        if (session.userType === 'Admin') {
            if (headingEl) headingEl.textContent = 'Training Index — Admin View';
            if (subheadEl) subheadEl.textContent = 'Every program LSH runs. As an admin, all built programs are directly open to you — use the queue below to approve trainee requests.';
        }

        try {
            const res = await fetch('/api/topics', { credentials: 'include' });
            const data = await res.json();
            if (!data.success) throw new Error(data.error || 'Failed to load the training index.');
            __topicsCache = data.topics || [];
            __accessCache = data.access || [];
            renderQueue(session);
            renderTopics(session);
        } catch (e) {
            const grid = document.getElementById('idx-topics');
            if (grid) grid.innerHTML = `<div style="grid-column:1/-1; font-size:13px; color:#b91c1c; padding:20px;">${escapeHtml(e.message)}</div>`;
        }
    }

    function renderQueue(session) {
        const wrap = document.getElementById('idx-queue-wrap');
        if (!wrap) return;
        if (session.userType !== 'Admin') { wrap.innerHTML = ''; return; }

        const pending = __accessCache.filter(a => a.status === 'Pending');
        if (!pending.length) { wrap.innerHTML = ''; return; }

        const topicName = key => (__topicsCache.find(t => t.key === key) || {}).name || key;
        wrap.innerHTML = `
            <div class="queue-card">
                <h3>Pending Topic Requests (${pending.length})</h3>
                ${pending.map(a => `
                    <div class="queue-row">
                        <span><b>${escapeHtml(a.trainee_username)}</b> &mdash; ${escapeHtml(topicName(a.topic_key))}</span>
                        <span class="queue-actions">
                            <button class="queue-btn approve" onclick="decideTopicAccess('${escapeHtml(a.topic_key)}','${escapeHtml(a.trainee_username)}','APPROVE')">Approve</button>
                            <button class="queue-btn deny" onclick="decideTopicAccess('${escapeHtml(a.topic_key)}','${escapeHtml(a.trainee_username)}','DENY')">Deny</button>
                        </span>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function renderTopics(session) {
        const grid = document.getElementById('idx-topics');
        if (!grid) return;
        const isAdmin = session.userType === 'Admin';

        grid.innerHTML = __topicsCache.map(t => {
            const built = BUILT_PROGRAMS[t.key];
            const myAccess = isAdmin ? null : __accessCache.find(a => a.topic_key === t.key);
            const status = isAdmin ? 'approved' : (myAccess ? myAccess.status.toLowerCase() : 'locked');

            let statusLabel = { approved: 'Approved', pending: 'Pending Approval', denied: 'Access Denied', locked: 'Not Yet Requested' }[status];
            let actionHtml;

            if (!built) {
                actionHtml = `<span class="topic-action-btn disabled">Coming Soon</span>`;
            } else if (isAdmin || status === 'approved') {
                actionHtml = `<a class="topic-action-btn primary" href="${built}">Enter Program &rarr;</a>`;
            } else if (status === 'pending') {
                actionHtml = `<span class="topic-action-btn disabled">Awaiting Admin Approval</span>`;
            } else {
                // locked or denied — same action, ask again
                actionHtml = `<button class="topic-action-btn request" onclick="requestTopicAccess('${escapeHtml(t.key)}')">Request Access</button>`;
            }

            return `
                <div class="topic-card">
                    <h3>${escapeHtml(t.name)}</h3>
                    <span class="topic-status ${status}">${isAdmin ? (built ? 'Available' : 'Coming Soon') : statusLabel}</span>
                    ${actionHtml}
                </div>
            `;
        }).join('');
    }

    async function requestTopicAccess(topicKey) {
        try {
            await postJson('/api/topics', { action: 'REQUEST_ACCESS', topicKey });
            showToast('Access requested — an admin will review it.', 'success');
            loadTrainingIndex();
        } catch (e) {
            showToast(e.message, 'error');
        }
    }

    async function decideTopicAccess(topicKey, traineeUsername, action) {
        try {
            await postJson('/api/topics', { action, topicKey, traineeUsername });
            showToast(action === 'APPROVE' ? 'Access approved.' : 'Access denied.', 'success');
            loadTrainingIndex();
        } catch (e) {
            showToast(e.message, 'error');
        }
    }

    document.addEventListener('DOMContentLoaded', loadTrainingIndex);
</script>
