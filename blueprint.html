<!--
  Platform Blueprint for the LSH Training Portal (the master portal).
  The deck itself is drawn by /lsh-blueprint.js, the Blueprint engine every LSH platform shares:
  the same navy cover band with the numbered contents, the same points / where to find it / tip
  slide, and the same real-text PDF — so the portal's blueprint and every program's blueprint
  read as one deck. This page is its front door: the standard portal header and the two tracks.
  Every blueprint link stays here: nothing on this page opens a deck inside a program or a tool.
    • Trainees: the portal, the Training Directory, program sign-in, Simulators, Knowledge Base.
    • Trainers & Admins: admin sign-in, the Directory's admin view, System Management,
      Trainee Monitoring, Attendance, program admin, Knowledge Base review, the daily workflow.
  Public page: nothing private is shown (no passwords, access codes or trainee data).
  Trainees read it on screen; ⬇ Download PDF is a trainer's, for sharing the deck outside the portal.
  Slides are in SLIDES below. Deep link: /blueprint.html?track=admin&slide=3 (/orientation.html forwards here)
  In the deck: ← → (or Page Up / Page Down), the contents strip, Esc to close.
-->
<style>
    :root {
        --navy: #0f2148; --navy-deep: #081226; --navy-mid: #132a5c;
        --orange: #f97316; --orange-soft: #fb923c; --orange-deep: #c2410c; --orange-pale: #fff7ed;
        --slate: #334155; --paper: #faf8f4; --line: rgba(15,33,72,.1);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'IBM Plex Sans', Arial, Helvetica, sans-serif; background: var(--paper); color: var(--navy); -webkit-font-smoothing: antialiased; }
    a { color: inherit; }

    .or-wrap { max-width: 1240px; margin: 0 auto; padding: 22px 16px 40px; }
    .or-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
    /* This label sits straight on the page's photo backdrop. No orange in the
       brand's range clears AA there (--orange measures 1.25:1, the darkest
       burnt orange 3.15:1), so the eyebrow takes the navy ink, 5.31:1, and
       keeps its size, weight and letter-spacing to stay a label. */
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--navy); }
    .or-head h1 { margin: 4px 0 0; font-size: clamp(24px, 3.2vw, 32px); font-weight: 900; letter-spacing: -.01em; }
    .or-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .or-tabs { display: inline-flex; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
    .or-tabs button { border: 0; background: none; font: inherit; font-size: 13px; font-weight: 700; color: var(--slate); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
    .or-tabs button.on { background: var(--navy); color: #fff; }
    .btn { font: inherit; font-size: 13px; font-weight: 700; border-radius: 10px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--navy); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { border-color: var(--orange); }
    /* .btn sets display, which beats the browser's own [hidden] rule — without this a hidden button still shows. */
    .btn[hidden] { display: none !important; }
    .btn.pri { background: var(--orange); border-color: var(--orange); color: #111827; }
    /* This line sits straight on the page's photo backdrop with no card
       under it, and --slate measures 3.49:1 over the darkest part of that
       photo — under AA for 12.5px. The navy ink reads 5.31:1 there, so the
       tip keeps its size and loses the grey. */
    .or-tip { font-size: 12.5px; color: var(--navy); }

    /* The front door for the deck. The deck itself is the engine's, full screen over this page:
       the navy cover band, the numbered contents and the slides, exactly as on every program. */
    .bp-open { background: linear-gradient(135deg, #1f2440 0%, #2b3158 60%, #353c68 100%); border-radius: 20px; padding: 44px 28px; text-align: center; color: #fff; box-shadow: 0 18px 40px -22px rgba(20,24,48,.65); }
    .bp-open h2 { font-size: clamp(21px, 2.4vw, 27px); margin: 0 0 8px; font-weight: 800; }
    .bp-open p { margin: 0 auto 20px; max-width: 64ch; font-size: 14.5px; line-height: 1.6; color: #c9cde3; }
    .bp-open .btn.pri { font-size: 15px; padding: 12px 22px; }
    .bp-contents { margin: 26px auto 0; max-width: 940px; list-style: none; padding: 0; columns: 2; column-gap: 40px; text-align: left; }
    .bp-contents li { break-inside: avoid; display: flex; align-items: center; gap: 12px; font-size: 14.5px; color: #e8ebf5; margin-bottom: 11px; }
    /* White on the orange fill is 2.80:1; the dark navy every other orange
       control on the portal uses for its label is 6.66:1. */
    .bp-contents li span { flex: 0 0 auto; width: 26px; height: 23px; border-radius: 6px; background: var(--orange); color: #081226; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    @media (max-width: 640px) { .bp-contents { columns: 1; } }
</style>

<script>
// Who is reading this page: the header (the standard portal bar) and the deck both ask.
function lshSession() {
    try { return JSON.parse(sessionStorage.getItem('LSH_SESSION_V1') || localStorage.getItem('LSH_SESSION_V1') || 'null'); }
    catch (e) { return null; }
}
function isAdmin() { const s = lshSession(); return !!(s && s.userType === 'Admin'); }
function signedIn() { return !!lshSession(); }
</script>

<div class="sim-top">
    <a class="sim-brand" href="/programs.html"><img src="/img/logo.png" alt="Legal Support Help" width="70" height="46"><span>LSH Training Portal<small>Blueprint</small></span></a>
    <div class="sim-nav">
        <script>document.write(isAdmin() ? PortalNav.adminHtml('orient', { back: '/programs.html' })
            : PortalNav.traineeHtml('orient', { back: '/index.html?stay=1', signedIn: signedIn() }));</script>
    </div>
</div>

<main class="or-wrap">
    <div class="or-head">
        <div>
            <div class="eyebrow">Platform Blueprint · for screen sharing</div>
            <h1>🧭 Welcome to the LSH Training Portal</h1>
        </div>
        <div class="or-tools">
            <div class="or-tabs" role="tablist" aria-label="Blueprint track">
                <button type="button" role="tab" data-track="trainee" onclick="setTrack('trainee')">Trainees</button>
                <button type="button" role="tab" data-track="admin" onclick="setTrack('admin')">Trainers &amp; Admins</button>
            </div>
            <button type="button" class="btn pri" id="orPdf" hidden onclick="downloadTrackPdf()" title="Download this track as a PDF, made from the live site">⬇ Download PDF</button>
        </div>

        <button type="button" class="btn pri" onclick="openDeck()">🧭 Open the blueprint</button>

/* ---------- 🧭 Who sees which track, and the deck (README → 🧭 Blueprint) ----------
   Trainees (and visitors) get the Trainees track only; the Trainers & Admins track is for a signed-in Admin.
   The deck and its PDF are lsh-blueprint.js, the same Blueprint engine as every LSH platform: it is made from
   the slides deployed right now, stamped with the deploy and the date. */
const SUBS = {
    trainee: 'The LSH Training Portal: how to find and use your training',
    admin: 'The LSH Training Portal: running training from the admin side'
};
let track = 'trainee';
const $ = id => document.getElementById(id);
const deckKey = () => (track === 'admin' ? 'trainer' : 'trainee');

let ver = null;
function version() {
    if (!ver) ver = fetch(location.pathname, { method: 'HEAD', cache: 'no-store' })
        .then(r => { const t = (r.headers.get('etag') || '').replace(/^W\//, '').replace(/[^A-Za-z0-9]/g, ''); return t ? 'deploy ' + t.slice(0, 8) : ''; }).catch(() => '');
    return ver;
}
window.LSH_BLUEPRINT = {
    product: 'LSH Training Portal', site: 'LSH Training Portal', file: 'LSH_Training_Portal', logo: '/lsh-logo-dark.png',
    trainee: { sub: SUBS.trainee, slides: SLIDES.trainee },
    get trainer() { return SLIDES.admin ? { sub: SUBS.admin, slides: SLIDES.admin } : null; },
    role: () => (isAdmin() ? 'trainer' : 'trainee'),
    version
};

/* The page itself: the contents of the track that's showing, and the button that opens the deck over it. */
function renderTrack() {
    const slides = track === 'admin' ? SLIDES.admin : SLIDES.trainee;
    $('bpTitle').textContent = track === 'admin' ? 'The Trainer blueprint' : 'The Trainee blueprint';
    $('bpSub').textContent = `${SUBS[track]} — ${slides.length} slides. ← → or the contents strip move through it${isAdmin() && track === 'admin' ? ', ⬇ Download PDF saves it' : ''}, Esc closes it.`;
    $('bpContents').innerHTML = slides.map((s, i) => `<li><span>${i + 1}</span>${s.title}</li>`).join('');
    document.querySelectorAll('.or-tabs button').forEach(b => { const on = b.dataset.track === track; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
    // ⬇ Download PDF belongs to the Trainers & Admins track alone: it is a trainer's way of sharing
    // the deck outside the portal, so it is not on the Trainees track even for an admin.
    const pdf = $('orPdf');
    if (pdf) pdf.hidden = !(isAdmin() && track === 'admin');
    document.title = (track === 'admin' ? 'Trainer Blueprint' : 'Blueprint') + ' — LSH Training Portal';
    const q = new URLSearchParams(location.search);
    q.set('track', track);
    history.replaceState(null, '', location.pathname + '?' + q);
}
function openDeck(slide) {
    if (!window.LSHBlueprint) return false;
    LSHBlueprint.open(deckKey());
    if (slide) LSHBlueprint.go(slide, true);
    return true;
}
function setTrack(t) {
    if (!SLIDES[t]) return;
    track = t;
    renderTrack();
    if (window.LSHBlueprint && LSHBlueprint.isOpen()) LSHBlueprint.deck(deckKey());
}
function downloadTrackPdf() { return window.LSHBlueprint ? LSHBlueprint.pdf(deckKey()) : null; }

// A trainee (or a visitor) reads the blueprint on screen: no track to switch to, and no PDF to take
// away. ⬇ Download PDF is a trainer's, and renderTrack() shows it on the Trainers & Admins track only.
if (!isAdmin()) { delete SLIDES.admin; document.querySelectorAll('.or-tabs').forEach(t => t.hidden = true); }

(function init() {
    const q = new URLSearchParams(location.search);
    if (SLIDES[q.get('track')]) track = q.get('track');
    else if (isAdmin() && !q.get('track')) track = 'admin';
    renderTrack();
    // A deep link to a slide (?slide=3) opens the deck straight on it; otherwise the page shows
    // the track's contents and waits, so the header, the program blueprints and ⬇ Download PDF
    // are there to use without the deck covering them.
    const slide = parseInt(q.get('slide'), 10) || 0;
    if (slide) { const open = () => { if (!openDeck(slide)) setTimeout(open, 50); }; window.addEventListener('load', open); }
})();
</script>
<script src="/lsh-blueprint.js"></script>
