<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orientation — LSH Training Portal</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!--
  Platform Orientation for the LSH Training Portal (the master portal).
  A slide deck for screen sharing (Google Meet), in two tracks:
    • Trainees: the portal, the Training Directory, program sign-in, Simulators, Knowledge Base.
    • Trainers & Admins: admin sign-in, the Directory's admin view, Master Control,
      Progress & Feedback, program admin, Knowledge Base review, the daily workflow.
  Public page: nothing private is shown (no passwords, access codes or trainee data).
  Slides are in SLIDES below. Deep link: /orientation.html?track=admin&slide=3
  Keys: ← → (or Page Up / Page Down / Space), F for full screen.
-->
<style>
    :root {
        --navy: #0f2148; --navy-deep: #081226; --navy-mid: #132a5c;
        --orange: #f97316; --orange-soft: #fb923c; --orange-pale: #fff7ed;
        --slate: #64748b; --paper: #faf8f4; --paper-warm: #f5f0e8; --line: rgba(15,33,72,.1);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'IBM Plex Sans', Arial, Helvetica, sans-serif; background: var(--paper); color: var(--navy); -webkit-font-smoothing: antialiased; }
    a { color: inherit; }

    .or-bar { background: var(--navy-deep); color: #fff; }
    .or-bar-in { max-width: 1240px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .or-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; text-decoration: none; }
    .or-brand img { width: 30px; height: 30px; border-radius: 7px; }
    .or-brand small { display: block; font-size: 11px; font-weight: 600; color: #fdba74; letter-spacing: .08em; text-transform: uppercase; }
    .or-links { display: flex; gap: 14px; margin-left: auto; font-size: 13px; font-weight: 600; flex-wrap: wrap; }
    .or-links a { text-decoration: none; color: rgba(255,255,255,.78); }
    .or-links a:hover { color: #fdba74; }

    .or-wrap { max-width: 1240px; margin: 0 auto; padding: 22px 16px 40px; }
    .or-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--orange); }
    .or-head h1 { margin: 4px 0 0; font-size: clamp(24px, 3.2vw, 32px); font-weight: 900; letter-spacing: -.01em; }
    .or-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .or-tabs { display: inline-flex; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
    .or-tabs button { border: 0; background: none; font: inherit; font-size: 13px; font-weight: 700; color: var(--slate); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
    .or-tabs button.on { background: var(--navy); color: #fff; }
    .btn { font: inherit; font-size: 13px; font-weight: 700; border-radius: 10px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--navy); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { border-color: var(--orange); }
    .btn.pri { background: var(--orange); border-color: var(--orange); color: #111827; }
    .btn:disabled { opacity: .4; cursor: default; border-color: var(--line); }
    .or-tip { font-size: 12.5px; color: var(--slate); }

    .or-stage { background: #fff; border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 24px 50px -30px rgba(8,18,38,.45); overflow: hidden; display: flex; flex-direction: column; }
    .or-stage:fullscreen { border-radius: 0; border: 0; justify-content: center; background: var(--paper); }
    .or-stage:fullscreen .or-slide { max-width: 1240px; width: 100%; margin: 0 auto; }
    .or-slide { display: none; position: relative; padding: clamp(22px, 4vw, 48px) clamp(18px, 4.5vw, 56px) 30px; min-height: 520px; }
    .or-slide.on { display: block; }
    .or-kicker { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 700; color: var(--orange); letter-spacing: .06em; text-transform: uppercase; }
    .or-slide h2 { font-size: clamp(24px, 3.4vw, 38px); font-weight: 900; letter-spacing: -.015em; margin: 8px 0 12px; line-height: 1.12; }
    .or-lead { font-size: clamp(15px, 1.6vw, 18px); line-height: 1.6; color: #334155; max-width: 72ch; margin: 0 0 20px; }
    .or-slide ul.pts { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; max-width: 900px; }
    .or-slide ul.pts li { position: relative; padding-left: 26px; font-size: clamp(14.5px, 1.45vw, 16.5px); line-height: 1.55; color: #1e293b; }
    .or-slide ul.pts li::before { content: ""; position: absolute; left: 4px; top: .6em; width: 9px; height: 9px; border-radius: 3px; background: var(--orange); }
    .or-slide b { color: var(--navy); }
    .or-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 4px 0 22px; }
    .or-flow span { background: var(--navy); color: #fff; font-weight: 700; font-size: 14px; border-radius: 12px; padding: 10px 14px; }
    .or-flow span.alt { background: var(--orange-pale); color: var(--navy); border: 1px solid #fed7aa; }
    .or-flow i { font-style: normal; color: var(--orange); font-weight: 900; }
    .or-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 12px; margin-top: 4px; }
    .or-card { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; background: #fbfaf7; }
    .or-card b { display: block; font-size: 15px; margin-bottom: 4px; }
    .or-card span { font-size: 13.5px; color: #475569; line-height: 1.5; display: block; }
    .or-note { margin-top: 18px; font-size: 13.5px; color: #7c2d12; background: var(--orange-pale); border: 1px solid #fed7aa; border-radius: 12px; padding: 10px 14px; max-width: 900px; }
    .or-go { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
    .or-check { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; max-width: 900px; counter-reset: c; }
    .or-check li { counter-increment: c; display: flex; gap: 12px; align-items: baseline; font-size: clamp(14.5px, 1.45vw, 16.5px); line-height: 1.5; }
    .or-check li::before { content: counter(c); flex: 0 0 28px; height: 28px; border-radius: 50%; background: var(--navy); color: #fff; font-weight: 800; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; }
    .or-controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-top: 1px solid var(--line); background: #fff; }
    .or-pager { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
    .or-dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .or-dots button { width: 10px; height: 10px; border-radius: 50%; border: 0; background: #cbd5e1; padding: 0; cursor: pointer; }
    .or-dots button.on { background: var(--orange); width: 24px; border-radius: 6px; }
    .or-count { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--slate); font-weight: 600; white-space: nowrap; }

    /* On screen, the slides sit on the LSH deck background: navy, the patterned band with the logo and
       its orange rule, and the orange line-art waves at the sides (.or-art, drawn once behind the slides).
       Sizes are in cqw (the slide area's width), so the background keeps the deck's 16:9 proportions at
       any size and in full screen. Print keeps the light slides above. */
    @media screen {
        #orSlides { --deck: #2b2e45; --deck-orange: #e07a2e; position: relative; container-type: inline-size; background: var(--deck); overflow: hidden; }
        .or-art { position: absolute; inset: 0; pointer-events: none; }
        .or-band { position: absolute; left: 0; top: 0; width: 80%; height: 9.8cqw; background-color: #84858e;
            background-image: repeating-linear-gradient(33deg, rgba(255,255,255,.13) 0 1px, transparent 1px 2.6cqw), repeating-linear-gradient(-33deg, rgba(255,255,255,.13) 0 1px, transparent 1px 2.6cqw); }
        .or-logo { position: absolute; left: 2.1cqw; top: 1.15cqw; display: flex; flex-direction: column; align-items: center; gap: .45cqw; }
        .or-logo i { display: block; width: 5.4cqw; height: 5.4cqw; overflow: hidden; position: relative; }
        /* lsh-logo-dark.png is 640 × 401 with the mark at x 168–472, y 10–312: show just the mark */
        .or-logo img { position: absolute; width: 11.37cqw; left: -2.98cqw; top: -.18cqw; }
        .or-logo b { color: #fff; font-size: 1.05cqw; font-weight: 800; letter-spacing: .01em; white-space: nowrap; }
        .or-rule { position: absolute; left: 21%; width: 59%; top: 11cqw; height: max(2px, .28cqw); background: var(--deck-orange); }
        .or-art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        .or-art path { fill: none; stroke: var(--deck-orange); stroke-width: 1; opacity: .5; }
        /* every slide is stacked in one cell, so they all take the tallest one's height and the stage never jumps;
           a slide is 16:9 unless its content needs more room */
        #orSlides { display: grid; }
        .or-art, .or-slide { grid-area: 1 / 1; }
        .or-slide { display: block; visibility: hidden; position: relative; z-index: 1; aspect-ratio: 16 / 9; min-height: auto; padding: 13.6cqw 10cqw 3cqw; color: #e2e5ef; }
        .or-slide.on { visibility: visible; }
        /* text and spacing scale with the slide, like a real deck: the same layout at any size and in full screen */
        .or-kicker { color: #fb923c; font-size: clamp(11px, 1.05cqw, 20px); }
        .or-slide h2 { color: #fff; font-size: clamp(22px, 3.25cqw, 62px); margin: .7cqw 0 1cqw; }
        .or-lead { color: #cfd4e2; font-size: clamp(14px, 1.55cqw, 30px); margin-bottom: 1.7cqw; }
        .or-slide b { color: #fff; }
        .or-slide ul.pts, .or-check { gap: .9cqw; max-width: 78cqw; }
        .or-slide ul.pts li, .or-check li { font-size: clamp(14px, 1.4cqw, 27px); }
        .or-slide ul.pts li { color: #e2e5ef; padding-left: 1.6em; }
        .or-slide ul.pts li::before { left: .25em; top: .6em; width: .55em; height: .55em; border-radius: .18em; }
        .or-check li::before { background: var(--orange); color: #fff; flex: 0 0 2.1em; height: 2.1em; font-size: .8em; }
        .or-flow { gap: .7cqw; margin: .4cqw 0 1.9cqw; }
        .or-flow span { background: #fff; color: var(--navy); font-size: clamp(13px, 1.2cqw, 23px); padding: .7em 1em; border-radius: .85em; }
        .or-flow span.alt { background: transparent; color: #fff; border: 1px solid #fb923c; }
        .or-flow i { color: #fb923c; font-size: clamp(13px, 1.2cqw, 23px); }
        .or-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 17cqw), 1fr)); gap: 1cqw; }
        .or-card { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.16); padding: 1.2cqw 1.4cqw; border-radius: 1.3cqw; }
        .or-card b { font-size: clamp(14px, 1.3cqw, 25px); margin-bottom: .35cqw; }
        .or-card span { color: #c3c9d9; font-size: clamp(13px, 1.15cqw, 22px); }
        .or-note { color: #fde4cc; background: rgba(249,115,22,.14); border-color: rgba(251,146,60,.45); font-size: clamp(12.5px, 1.15cqw, 22px); margin-top: 1.5cqw; padding: .75em 1.05em; border-radius: .9em; max-width: 78cqw; }
        .or-go { margin-top: 1.7cqw; gap: .9cqw; }
        .or-go .btn { font-size: clamp(13px, 1.1cqw, 21px); padding: .62em 1.08em; border-radius: .78em; }
        /* the whole stage fits the window's height, Next included (full screen fills the screen) */
        .or-stage { max-width: max(640px, (100vh - 250px) * 16 / 9); margin: 0 auto; }
        .or-stage:fullscreen { background: #1d1f31; }
        .or-stage:fullscreen #orSlides { width: min(100vw, (100vh - 64px) * 16 / 9); margin: 0 auto; }
        .or-stage:fullscreen .or-slide { max-width: none; }
    }

    @media (max-width: 640px) {
        .or-slide { min-height: 0; }
        #orSlides .or-slide { aspect-ratio: auto; padding: calc(14cqw + 8px) 18px 22px; }
        .or-logo b { display: none; }
        .or-art path { opacity: .22; }
        .or-controls { flex-wrap: wrap; }
        .or-pager { order: 3; width: 100%; }
        .or-links { margin-left: 0; }
    }
    @media print {
        @page { size: letter landscape; margin: 0.4in; }
        body { background: #fff; }
        .or-bar, .or-head, .or-controls { display: none !important; }
        .or-wrap { padding: 0; max-width: none; }
        .or-stage { border: 0; box-shadow: none; border-radius: 0; }
        .or-slide { display: block !important; min-height: 0; page-break-after: always; break-after: page; padding: 0.2in 0.1in; }
        .or-slide:last-child { page-break-after: auto; break-after: auto; }
        .or-slide:not([data-track~="print"]) { display: none !important; }
        .or-art { display: none; }
    }
</style>
</head>
<body>

<div class="or-bar"><div class="or-bar-in">
    <a class="or-brand" href="/"><img src="/favicon.png" alt=""><span>LSH Training Portal<small>Orientation</small></span></a>
    <nav class="or-links">
        <a href="/">Home</a>
        <a href="/programs.html">Training Directory</a>
        <a href="/simulators.html">Simulators</a>
        <a href="/kb.html">Knowledge Base</a>
    </nav>
</div></div>

<main class="or-wrap">
    <div class="or-head">
        <div>
            <div class="eyebrow">Platform Orientation · for screen sharing</div>
            <h1>🧭 Welcome to the LSH Training Portal</h1>
        </div>
        <div class="or-tools">
            <div class="or-tabs" role="tablist" aria-label="Orientation track">
                <button type="button" role="tab" data-track="trainee" onclick="setTrack('trainee')">Trainees</button>
                <button type="button" role="tab" data-track="admin" onclick="setTrack('admin')">Trainers &amp; Admins</button>
            </div>
            <button type="button" class="btn" onclick="toggleFull()" title="Full screen (F)">⛶ Full screen</button>
            <button type="button" class="btn" onclick="window.print()" title="Print or save this track as a PDF">🖨 Print</button>
            <button type="button" class="btn pri" id="orPdf" onclick="downloadTrackPdf()" title="Download this track as a PDF, made from the live site">⬇ Download PDF</button>
        </div>
    </div>
    <p class="or-tip" style="margin:-4px 0 14px;">Share this tab in Google Meet: nothing private is shown here. Use ← → to move between slides.</p>

    <section class="or-stage" id="orStage" aria-live="polite">
        <div id="orSlides"></div>
        <div class="or-controls">
            <button type="button" class="btn" id="orPrev" onclick="go(-1)">← Previous</button>
            <div class="or-pager"><div class="or-dots" id="orDots"></div><span class="or-count" id="orCount"></span></div>
            <button type="button" class="btn pri" id="orNext" onclick="go(1)">Next →</button>
        </div>
    </section>
</main>

<script>
const PROGRAMS_LIVE = 'Standard Foundational Training, CM Training and EA / PA Training';

const SLIDES = {
trainee: [
{ k: 'Welcome', h: 'One portal for all of your LSH training', body: `
    <p class="or-lead">The LSH Training Portal is the master portal. It's the front door to every LSH training program, plus the practice tools and resources that all programs share.</p>
    <div class="or-flow"><span>Portal home</span><i>→</i><span>Training Directory</span><i>→</i><span>Your program</span><i>+</i><span class="alt">Simulators</span><span class="alt">Knowledge Base</span></div>
    <ul class="pts">
        <li><b>Training Directory:</b> every LSH program in one place. Open yours from here.</li>
        <li><b>Your program:</b> where your lessons, activities, progress and certificate live. Each program has its own sign-in.</li>
        <li><b>Simulators:</b> practice calls, calendaring, email, docketing, medical records requests and court e-filing.</li>
        <li><b>Knowledge Base:</b> the firm's official SOPs, plus tips and guides from other LSH VAs.</li>
    </ul>` },
{ k: 'Training Directory', h: 'Find your program in the Training Directory', body: `
    <p class="or-lead">Open <b>Training Directory</b> from the portal's top menu (or <b>Browse Trainings</b>). It lists every program LSH runs.</p>
    <div class="or-grid">
        <div class="or-card"><b>Available → Open Program</b><span>The program is live. It opens in a new tab.</span></div>
        <div class="or-card"><b>Coming Soon</b><span>Listed so you can see what's next; it isn't open yet.</span></div>
        <div class="or-card"><b>Free</b><span>Free Upskill Programs are pinned at the top and marked Free.</span></div>
        <div class="or-card"><b>Simulators &amp; Knowledge Base</b><span>The two cards at the top of the Directory open them.</span></div>
    </div>
    <p class="or-note">Programs open now: ${PROGRAMS_LIVE}.</p>
    <div class="or-go"><a class="btn pri" href="/programs.html">Open the Training Directory</a></div>` },
{ k: 'Signing in', h: 'Each program has its own sign-in', body: `
    <p class="or-lead">You don't sign in on this portal. You sign in inside your program.</p>
    <ul class="pts">
        <li>Enter your <b>name</b> and your <b>Batch ID</b> exactly as your trainer gave them to you.</li>
        <li>Your trainer <b>approves</b> your sign-in. After that, you go straight in.</li>
        <li>Your progress is <b>saved to your account</b>, not your browser. Sign in on any computer and pick up where you left off.</li>
        <li>Use the same name and Batch ID every time. Your progress, scores and certificate follow them.</li>
    </ul>
    <p class="or-note">Log-in details for work tools (email, CMS, time tracker) are never posted on the portal. Your trainer shares them privately.</p>` },
{ k: 'Inside a program', h: 'What you do inside your program', body: `
    <div class="or-grid">
        <div class="or-card"><b>📚 Lessons</b><span>Slides you move through one at a time, with Full screen. Your trainer opens each lesson or day for your batch.</span></div>
        <div class="or-card"><b>▶ Videos &amp; files</b><span>Lecture videos and documents open right on the page, or in a new tab.</span></div>
        <div class="or-card"><b>🧪 Practice</b><span>Activities, practice labs and checks, depending on the program. Your work saves as you go.</span></div>
        <div class="or-card"><b>🎯 Trainer feedback</b><span>Your trainer's notes on your work: strengths, areas to build and what to focus on next.</span></div>
        <div class="or-card"><b>💬 Your feedback</b><span>Rate the lessons and the training. You can send it anonymously.</span></div>
        <div class="or-card"><b>🎓 Certificate</b><span>Unlocks when you complete the program.</span></div>
    </div>` },
{ k: 'Simulators', h: 'Practice on the Simulators', body: `
    <p class="or-lead">The Simulators let you practice real work safely, with fictional cases, and get a score and feedback.</p>
    <div class="or-grid">
        <div class="or-card"><b>📞 Call Simulator</b><span>A caller phones in; answer by voice or typing, then get a scored debrief.</span></div>
        <div class="or-card"><b>🗓 Calendaring</b><span>A busy week full of conflicts to sort out under real rules.</span></div>
        <div class="or-card"><b>✉️ Email Workspace &amp; 📨 Email Replies</b><span>Triage a practice inbox, and answer emails like you would at work.</span></div>
        <div class="or-card"><b>⚖️ Docket · 🗂 Records · 🏛 E-Filing</b><span>Docket court deadlines, request medical records and bills, and file with the court.</span></div>
    </div>
    <ul class="pts" style="margin-top:16px;">
        <li>The first time, enter your <b>name and Batch ID</b> ("Who's practicing?") so your scores reach your trainer. Opening a simulator from inside your program fills them in for you.</li>
    </ul>
    <div class="or-go"><a class="btn pri" href="/simulators.html">Open the Simulators</a></div>` },
{ k: 'Knowledge Base', h: 'Look things up in the Knowledge Base', body: `
    <p class="or-lead">The Knowledge Base is where LSH VAs find the firm's SOPs and share what they know. It's for the team only.</p>
    <ul class="pts">
        <li>Sign in with the <b>team access code</b> (your trainer gives it to you) and your name. Your browser stays signed in for 30 days.</li>
        <li><b>Official</b> SOPs and resources, each with its original file to download.</li>
        <li><b>From the team:</b> tips, how-to guides, checklists and templates. Mark them 👍 Helpful, or reply with your own experience.</li>
        <li>Share your own. An admin reviews every post before it's published. Add a profile so people know who wrote it.</li>
    </ul>
    <div class="or-go"><a class="btn pri" href="/kb.html">Open the Knowledge Base</a></div>` },
{ k: 'Good habits', h: 'Tips for a smooth training', body: `
    <ul class="pts">
        <li>Use <b>Google Chrome</b>, and keep the portal and your program open in separate tabs.</li>
        <li>Most links open in a <b>new tab</b>, so you never lose your place.</li>
        <li><b>Never share passwords</b> in chat, notes or the Knowledge Base. The portal doesn't need them.</li>
        <li>Can't get into your program, or something looks wrong? Message your <b>trainer or batch administrator</b> with your name, Batch ID and a screenshot.</li>
    </ul>` },
{ k: 'Ready', h: "You're ready: your first steps", body: `
    <ol class="or-check">
        <li>Bookmark the LSH Training Portal.</li>
        <li>Open the <b>Training Directory</b> and click <b>Open Program</b> on your program.</li>
        <li>Sign in with your name and Batch ID, and wait for your trainer's approval.</li>
        <li>Start your first open lesson.</li>
        <li>Try a <b>Simulator</b>, and look around the <b>Knowledge Base</b>.</li>
    </ol>
    <div class="or-go"><a class="btn pri" href="/programs.html">Go to the Training Directory</a></div>` }
],
admin: [
{ k: 'The admin side', h: 'Running training from the master portal', body: `
    <p class="or-lead">Trainers and admins sign in to the portal to monitor every batch, communicate with trainees, and review what they share.</p>
    <div class="or-flow"><span>🔒 Admin sign-in</span><i>→</i><span>Training Directory (admin view)</span><i>→</i><span>Master Control</span><span class="alt">📊 Progress &amp; Feedback</span><span class="alt">📚 Knowledge Base review</span></div>
    <ul class="pts">

let track = 'trainee', idx = 0;
const $ = id => document.getElementById(id);

// The deck background (on screen only): the patterned band with the logo, its orange rule, and two ribbons
// of orange line art. A ribbon is a fan of curves between two edge curves that cross, which gives the twist.
function ribbon(a, b, n) {
    const mix = (t) => a.map((p, i) => [p[0] + (b[i][0] - p[0]) * t, p[1] + (b[i][1] - p[1]) * t].map(v => v.toFixed(1)).join(' '));
    let d = '';
    for (let i = 0; i < n; i++) { const [p0, p1, p2, p3] = mix(i / (n - 1)); d += `M${p0}C${p1} ${p2} ${p3}`; }
    return `<path vector-effect="non-scaling-stroke" d="${d}"/>`;
}
const DECK_ART = `<div class="or-art" aria-hidden="true">
    <div class="or-band"></div>
    <div class="or-logo"><i><img src="/lsh-logo-dark.png" alt=""></i><b>LEGAL SUPPORT HELP</b></div>
    <div class="or-rule"></div>
    <svg viewBox="0 0 1600 900" preserveAspectRatio="none">
        ${ribbon([[-20, 290], [230, 360], [20, 650], [150, 920]], [[-20, 430], [70, 520], [250, 720], [20, 920]], 26)}
        ${ribbon([[1290, -20], [1590, 120], [1340, 400], [1620, 640]], [[1500, -20], [1360, 170], [1620, 330], [1620, 560]], 26)}
    </svg>
</div>`;

function renderTrack() {
    const list = SLIDES[track];
    $('orSlides').innerHTML = DECK_ART + list.map((s, i) => `
        <article class="or-slide" data-track="print" aria-label="Slide ${i + 1} of ${list.length}">
            <div class="or-kicker">${String(i + 1).padStart(2, '0')} · ${s.k}</div>
            <h2>${s.h}</h2>
            ${s.body}
        </article>`).join('');
    $('orDots').innerHTML = list.map((s, i) => `<button type="button" title="${s.k}" aria-label="Slide ${i + 1}: ${s.k}" onclick="show(${i})"></button>`).join('');
    document.querySelectorAll('.or-tabs button').forEach(b => { const on = b.dataset.track === track; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
    document.title = (track === 'admin' ? 'Admin Orientation' : 'Orientation') + ' — LSH Training Portal';
}
function show(i) {
    const list = SLIDES[track];
    idx = Math.max(0, Math.min(i, list.length - 1));
    document.querySelectorAll('.or-slide').forEach((el, k) => el.classList.toggle('on', k === idx));
    document.querySelectorAll('.or-dots button').forEach((el, k) => el.classList.toggle('on', k === idx));
    $('orPrev').disabled = idx === 0;
    $('orNext').disabled = idx === list.length - 1;
    $('orCount').textContent = `${idx + 1} / ${list.length}`;
    const q = new URLSearchParams(location.search);
    q.set('track', track); q.set('slide', idx + 1);
    history.replaceState(null, '', location.pathname + '?' + q);
}
function go(d) { show(idx + d); }
function setTrack(t) { if (!SLIDES[t]) return; track = t; renderTrack(); show(0); }
function toggleFull() {
    const el = $('orStage');
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {});
    else if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
}
document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, textarea, select')) return;
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(1); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(-1); }
    else if (e.key === 'f' || e.key === 'F') toggleFull();
});

/* ---------- 🧭 Who sees which track, and the PDF (README → 🧭 Orientation) ----------
   Trainees (and visitors) get the Trainees track only; the Trainers & Admins track is for a signed-in Admin.
   ⬇ Download PDF makes a real-text PDF of the track that's showing with lsh-blueprint.js (the same Blueprint engine
   as every LSH platform), from the slides deployed right now, stamped with the deploy and the date. */
function isAdmin() {
    try { const s = JSON.parse(sessionStorage.getItem('LSH_SESSION_V1') || localStorage.getItem('LSH_SESSION_V1') || 'null'); return !!(s && s.userType === 'Admin'); }
    catch (e) { return false; }
}
// a slide as the Blueprint's { icon, title, points, where, tip }: its lead, list items, cards and notes, as text
function asBlueprint(list, name) {
    const text = (el) => el.textContent.replace(/\s+/g, ' ').trim();
    const cut = (t) => t.length > 190 ? t.slice(0, 187).replace(/\s+\S*$/, '') + '…' : t;
    return { name, sub: name === 'Trainee blueprint' ? 'The LSH Training Portal: how to find and use your training' : 'The LSH Training Portal: running training from the admin side',
        slides: list.map(sl => {
            const d = document.createElement('div'); d.innerHTML = sl.body;
            const pts = [];
            d.querySelectorAll('.or-lead, li, .or-card, .or-note').forEach(el => {
                if (el.classList.contains('or-card')) { const b = el.querySelector('b'), sp = el.querySelector('span'); pts.push((b ? text(b) : '') + (sp ? ': ' + text(sp) : '')); }
                else if (!el.closest('.or-card')) pts.push(text(el));
            });
            return { icon: '', title: sl.h.replace(/<[^>]+>/g, ''), points: pts.filter(Boolean).slice(0, 5).map(cut) };
        }) };
}
let ver = null;
function version() {
    if (!ver) ver = fetch(location.pathname, { method: 'HEAD', cache: 'no-store' })
        .then(r => { const t = (r.headers.get('etag') || '').replace(/^W\//, '').replace(/[^A-Za-z0-9]/g, ''); return t ? 'deploy ' + t.slice(0, 8) : ''; }).catch(() => '');
    return ver;
}
window.LSH_BLUEPRINT = {
    product: 'LSH Training Portal', site: 'LSH Training Portal', file: 'LSH_Training_Portal', logo: '/lsh-logo-dark.png',
    get trainee() { return asBlueprint(SLIDES.trainee, 'Trainee blueprint'); },
    get trainer() { return asBlueprint(SLIDES.admin, 'Trainer blueprint'); },
    role: () => (isAdmin() ? 'trainer' : 'trainee'),
    version
};
async function downloadTrackPdf() {
    if (!window.LSHBlueprint) return;
    await LSHBlueprint.pdf(track === 'admin' ? 'trainer' : 'trainee');
}
if (!isAdmin()) { delete SLIDES.admin; document.querySelectorAll('.or-tabs').forEach(t => t.hidden = true); }

(function init() {
    const q = new URLSearchParams(location.search);
    if (SLIDES[q.get('track')]) track = q.get('track');
    else if (isAdmin() && !q.get('track')) track = 'admin';
    renderTrack();
    show((parseInt(q.get('slide'), 10) || 1) - 1);
})();
</script>
