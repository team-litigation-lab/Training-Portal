<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSH SIMUL8 — LSH Nexus</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/simulators/sim.css">
<style>
    /* The hub is meant to be taken in at a glance: on a desktop screen every card sits
       above the fold, so the page does not scroll to show a simulator. */
    .hub-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 1000px) { .hub-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 620px) { .hub-grid { grid-template-columns: 1fr; } }
    .hub-card { display: flex; flex-direction: column; gap: 10px; }
    .hub-card .icon { width: 48px; height: 48px; border-radius: 14px; background: #fff7ed; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .hub-card h3 { margin: 0; font-size: 17px; font-weight: 900; }
    .hub-card p { margin: 0; font-size: 13.5px; font-weight: 500; color: var(--slate); line-height: 1.55; flex: 1; }
    .hub-card .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; }
    .hub-card .uses { font-size: 11.5px; color: var(--slate); font-weight: 800; }
    .hub-card.soon { background: #fbfaf7; }
    .hub-card.locked { background: #f1f5f9; opacity: .6; }
    .hub-card.locked .icon { filter: grayscale(1); }
    /* the hub uses the window's whole width (a 24px gutter), not the simulators' centred 1280px column */
    .sim-wrap.hub-wrap { max-width: none; }
    .hub-wrap .sim-hero p { max-width: none; }

    /* One screen: every card fits on a laptop or desktop screen without scrolling. Each description is a sentence or two
       (the whole of it is in the card's tooltip), so four columns of three rows fit from 1180x700 up. */
    @media (min-width: 1180px) {
        .sim-wrap { padding-top: 18px; padding-bottom: 18px; }
        .sim-hero { padding: 12px 22px; margin-bottom: 10px; }
        .sim-hero .eyebrow { margin-bottom: 6px; padding: 3px 10px; font-size: 11px; }
        .sim-hero h1 { font-size: 22px; margin-bottom: 4px; }
        .sim-hero p { font-size: 13px; line-height: 1.45; }
        .hub-grid { grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .sim-card.hub-card { padding: 13px 15px; gap: 6px; }
        .hub-card .icon { width: 34px; height: 34px; border-radius: 10px; font-size: 18px; }
        .hub-card h3 { font-size: 15.5px; }
        .sim-hero .eyebrow { display: none; }
        .hub-card p { font-size: 13px; line-height: 1.42; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .hub-card .row { margin-top: 0; }
        .hub-card .uses { font-size: 11px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hub-card .sim-btn { padding: 6px 14px; font-size: 12.5px; white-space: nowrap; flex-shrink: 0; }
    }
    @media (min-width: 1180px) and (max-width: 1299px) {
        .hub-wrap { padding-left: 16px; padding-right: 16px; }
        .sim-card.hub-card { padding: 12px 12px; }
        .hub-card p { font-size: 12.2px; letter-spacing: -.005em; }
    }
</style>
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div id="topbar"></div>
<div class="sim-wrap hub-wrap">
    <section class="sim-hero">
        <div class="eyebrow">Shared across every program</div>
        <h1>🛠 LSH SIMUL8</h1>
        <p>Hands-on practice for every LSH program. Pick a simulator, work a realistic scenario and get a scored debrief, saved to your account.</p>
    </section>

    <div class="hub-grid" id="hub-grid"></div>

    <!-- 📈 Your results: every graded run saved to your account, from any device (and this browser's practice runs) -->
    <section class="sim-card" id="my-results" hidden style="margin-top:18px;">
        <h3 style="margin-top:0;">📈 Your results</h3>
        <p id="my-results-note" style="margin:4px 0 10px;"></p>
        <div style="overflow-x:auto;"><table class="sim-table" style="width:100%;border-collapse:collapse;font-size:13px;">
            <thead><tr><th style="text-align:left;padding:6px 8px;">When</th><th style="text-align:left;padding:6px 8px;">Simulator</th><th style="text-align:left;padding:6px 8px;">Scenario</th><th style="text-align:right;padding:6px 8px;">Score</th></tr></thead>
            <tbody id="my-results-rows"></tbody>
        </table></div>
        <div class="row" style="margin-top:10px;"><button class="sim-btn ghost" id="my-results-more" hidden onclick="showMyResults(true)">Show all</button></div>
    </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>
<script src="/app.js"></script>
<script src="/portal-nav.js"></script>
<script src="/portal.js"></script>
<script src="/simulators/sim.js"></script>
<script>
    const SIMULATORS = [
        { id: 'call', icon: '📞', title: 'Call Sim', status: 'live', href: '/api/launch?tool=ringchannel&to=calls', uses: 'All programs',
          desc: 'Answer phone calls on ☎️ LSH CommX with an AI caller: practice, or a graded call.' },
        { id: 'messaging', icon: '💬', title: 'Client Messaging', status: 'live', href: '/api/launch?tool=ringchannel&to=messages', uses: 'CM · PD · EA/PA · Medsum',
          desc: 'Text clients from their case file on ☎️ LSH CommX, under the firm\'s texting policy.' },
        { id: 'automessaging', icon: '🤖', title: 'Automated Messaging', status: 'live', href: '/api/launch?tool=ringchannel&to=automessages', uses: 'CM · PD · EA/PA · Medsum',
          desc: 'Pick up client threads the firm\'s automated reminders and notices started.' },
        { id: 'calsim', icon: '📆', title: 'Calendaring Sims', status: 'live', href: '/simulators/calsim.html', uses: 'Standard · CM · EA/PA',
          desc: 'Book, move and cancel appointments on the attorney\'s calendar by the rules.' },
        { id: 'email', icon: '✉️', title: 'Email Sims', status: 'live', href: '/simulators/email.html', uses: 'All programs',
          desc: 'Triage a Gmail-style inbox, or answer one work email at a time with a model reply.' },
        { id: 'docket', icon: '⚖️', title: 'Docket System', status: 'live', href: '/simulators/docket.html', uses: 'CM · Litigation',
          desc: 'Docket court notices and calendar every deadline under federal or state rules.' },
        { id: 'records', icon: '🗂', title: 'Medical Records Requests', status: 'live', href: '/simulators/records.html', uses: 'CM · Medsum',
          desc: 'Request records and bills on the John Doe file and handle what comes back.' },
        { id: 'drafting', icon: '✍️', title: 'Drafting', status: 'live', href: '/simulators/drafting.html', uses: 'Standard · CM',
          desc: 'Fill the firm\'s 1P and 3P letter templates and download the finished Word file.' },
        { id: 'packet', icon: '📚', title: 'Demand Packets & Binders', status: 'live', gated: true, href: '/simulators/demand-packet.html', uses: 'CM · Medsum · Litigation',
          desc: 'Build the demand packet or binder as one Bates-stamped, indexed PDF.' },
        { id: 'drive', icon: '📂', title: 'Backup Drive', status: 'live', href: '/simulators/drive.html', uses: 'All programs',
          desc: 'Lay out the firm\'s case-file folders on your Google Drive, graded folder by folder.' },
        { id: 'efiling', icon: '🏛', title: 'Court E-Filing', status: 'live', href: '/simulators/efiling.html', uses: 'CM · Litigation',
          desc: 'Fix the filing documents, then e-file in federal or state court.' }
    ];
    // 📚 Demand Packets & Binders is for Case Management and Medsum and Demand only (Sim.packetAccess, the same rule the page
    // itself and Drafting's tab use): grayed out until that is known, and for everyone else (Standard Foundational Training).
    let PACKET_OK = false;
    const CHIP = { live: ['live', 'Live'], next: ['next', 'Coming next'], plan: ['plan', 'Planned'], input: ['input', 'Needs input'] };

    function renderHub() {
        document.getElementById('topbar').innerHTML = Sim.topbar('hub');
        Sim.label('LSH SIMUL8');
        document.getElementById('hub-grid').innerHTML = SIMULATORS.map(s => `
            <div class="sim-card hub-card ${s.status === 'live' ? '' : 'soon'}${s.gated && !PACKET_OK ? ' locked' : ''}">
                <div class="row" style="margin-top:0;"><span class="icon">${s.icon}</span><span class="sim-chip ${CHIP[s.status][0]}">${CHIP[s.status][1]}</span></div>
                <h3>${Sim.esc(s.title)}</h3>
                <p title="${Sim.esc(s.desc)}">${Sim.esc(s.desc)}</p>
                <div class="row"><span class="uses">${Sim.esc(s.uses)}</span>
                    ${s.gated && !PACKET_OK ? `<button class="sim-btn ghost" disabled title="Part of Case Management and Medsum and Demand training, not Standard Foundational Training">🔒 CM · Medsum only</button>`
                        : s.href ? `<a class="sim-btn primary" href="${s.href}">Open →</a>` : `<button class="sim-btn ghost" disabled>Not yet</button>`}</div>
            </div>`).join('');
    }

    // 📈 Your results: a signed-in trainee's come from their account (every device), a visitor's from this browser; administrators
    // see everyone's on the Portal's own pages, so the panel is not shown to them.
    let MY_RESULTS = null;
    async function showMyResults(all) {
        const box = document.getElementById('my-results');
        if (Sim.isAdmin()) { box.hidden = true; return; }
        if (!MY_RESULTS) { try { MY_RESULTS = await Sim.results(); } catch (e) { MY_RESULTS = { results: Sim.localHistory(), offline: true }; } }
        const rows = (MY_RESULTS.results || []).filter(r => r && r.simulator);
        if (!rows.length) { box.hidden = true; return; }
        const shown = all ? rows : rows.slice(0, 10);
        document.getElementById('my-results-rows').innerHTML = shown.map(r => `<tr>
            <td style="padding:6px 8px;white-space:nowrap;">${Sim.esc(Sim.fmtDate(r.created_at))}</td><td style="padding:6px 8px;">${Sim.esc(r.simulator)}</td>
            <td style="padding:6px 8px;">${Sim.esc(r.scenario || '')}</td><td style="padding:6px 8px;text-align:right;">${Sim.scoreChip(r.score == null ? null : Number(r.score))}</td></tr>`).join('');
        const signedIn = !!Sim.session().userType;
        document.getElementById('my-results-note').textContent = (signedIn
            ? (MY_RESULTS.offline ? 'Your account\'s results couldn\'t be loaded just now, so this is what this browser kept.' : 'Every result saved to your account, from any device, newest first.')
            : 'Kept in this browser only: sign in on the Portal to keep your results on your account.') + ` ${rows.length} in all.`;
        const more = document.getElementById('my-results-more');
        more.hidden = all || rows.length <= 10; more.textContent = `Show all ${rows.length}`;
        box.hidden = false;
    }

    // A new tab has the signed cookie but no copy of who in its own storage: ask first, so an admin gets the admin hub, and the heartbeat runs.
    document.addEventListener('DOMContentLoaded', async () => { await Sim.restore(); renderHub(); showMyResults(false); PACKET_OK = await Sim.packetAccess(); if (PACKET_OK) renderHub(); });
</script>
</body>
</html>
